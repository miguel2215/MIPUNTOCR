name: Android APK - PUNTO YA CR

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'logo-*.png'
      - 'icon-*.png'
      - 'apple-touch-icon.png'
      - 'favicon-32.png'
      - 'splash-*.png'
      - 'capacitor.config.json'
      - 'package.json'
      - 'scripts/**'
      - 'assets/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    name: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verificar Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version
          adb --version

      - name: Aceptar licencias Android
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Preparar archivos web para Android
        run: npm run mobile:prepare-web

      - name: Crear proyecto Android con Capacitor
        shell: bash
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Generar iconos y splash Android
        run: npx @capacitor/assets generate --android

      - name: Aplicar configuración Android
        run: npm run mobile:patch-android

      - name: Instalar plataforma Android requerida
        shell: bash
        run: |
          COMPILE_SDK=$(grep -E 'compileSdkVersion\s*=' android/variables.gradle | grep -oE '[0-9]+' | head -1)
          echo "compileSdk detectado: ${COMPILE_SDK}"
          sdkmanager "platform-tools" "platforms;android-${COMPILE_SDK}"

      - name: Dar permiso a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK de prueba
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: PUNTO-YA-CR-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
