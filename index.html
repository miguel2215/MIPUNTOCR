/* =========================
   PEDIDOS · RESTAURANTE
   Flujo secuencial en ventanas flotantes:
   Mesa → Categoría → Productos → Revisar → Guardar
========================= */
let orderDraft = null;

function normalizeOrderStatus(status) {
  if (status === "Pendiente" || status === "Tomado" || status === "taken") return "Recibido";
  if (status === "Preparando" || status === "En preparación" || status === "preparing") return "Recibido";
  if (status === "ready") return "Listo";
  if (status === "delivered") return "Entregado";
  if (status === "on_way") return "Listo";
  return status || "Recibido";
}

function orderStatusTime(o) {
  const status = normalizeOrderStatus(o.status);
  const at = status === "Entregado"
    ? o.deliveredAt
    : status === "Listo"
        ? o.readyAt
        : o.createdAt;

  return at
    ? new Date(at).toLocaleTimeString("es-CR", { hour: "2-digit", minute: "2-digit" })
    : "";
}

let ordersTab = "table";
function orderKind(order) { return order.kind || (order.tableNumber ? "table" : "whatsapp"); }
function orderOriginLabel(order) {
  if (orderKind(order) === "table") return `Mesa ${order.tableNumber || "-"}`;
  return order.fulfillment === "Express" ? "WhatsApp · Express" : "WhatsApp";
}
function orderTotal(order) {
  const base = (order.items || []).reduce((sum, item) => sum + Number(item.price || 0) * Number(item.qty || 0), 0);
  return totals(base + Number(order.expressFee || 0)).total;
}
function orderPaidSale(order) {
  if (!order?.linkedSaleId) return null;
  const sale = state.sales.find(s => s.id === order.linkedSaleId);
  return sale && !sale.voided ? sale : null;
}
function orderIsPaid(order) { return !!orderPaidSale(order) || order?.paymentStatus === "Pagado"; }
function orderAgeText(order) {
  const mins = Math.max(0, Math.floor((Date.now() - new Date(order.createdAt || Date.now()).getTime()) / 60000));
  if (mins < 1) return "Ahora";
  if (mins < 60) return `Hace ${mins} min`;
  const hours = Math.floor(mins / 60);
  return `Hace ${hours} h ${mins % 60} min`;
}
function nextVisibleOrderStatus(order) {
  const status = normalizeOrderStatus(order.status);
  if (isProducts() && orderKind(order) === "whatsapp") {
    if ((status === "Recibido" || status === "Listo") && orderIsPaid(order)) return "Entregado";
    return "";
  }
  if (status === "Recibido") return "Listo";
  if (status === "Listo") {
    if (orderKind(order) === "whatsapp" && !orderIsPaid(order)) return "";
    return "Entregado";
  }
  return "";
}
function retailQuoteHref(order) {
  if (!isProducts() || orderKind(order) !== "whatsapp") return "";
  const customer=String(order.customer||"").trim();
  const lines=[`Hola${customer?`, ${customer}`:""} 👋`,``,"Revisamos tu solicitud en PUNTO YA CR:",...(order.items||[]).map(i=>`${Number(i.qty||0)} × ${i.name}${i.variant?` · ${i.variant}`:""} — ${money(Number(i.price||0)*Number(i.qty||0))}`),...(Number(order.expressFee||0)>0?[`Entrega — ${money(order.expressFee)}`]:[]),``,`Total estimado: ${money(orderTotal(order))}`,``,`Si estás de acuerdo, confírmanos por este chat para continuar con el pedido.`];
  return orderPhoneHref(order,lines.join("\n"));
}
function orderPhoneHref(order, text = "") {
  const digits = String(order.phone || "").replace(/\D/g, "");
  if (!digits) return "";
  const phone = digits.length === 8 ? `506${digits}` : digits;
  return `https://wa.me/${phone}${text ? `?text=${encodeURIComponent(text)}` : ""}`;
}

function nextOrderNumber() {
  return Math.max(0, ...state.orders.map(o => Number(o.number || 0))) + 1;
}

function orderDraftSubtotal() {
  return (orderDraft?.items || []).reduce(
    (sum, item) => sum + Number(item.price || 0) * Number(item.qty || 0),
    0
  );
}

function orderDraftQty() {
  return (orderDraft?.items || []).reduce(
    (sum, item) => sum + Number(item.qty || 0),
    0
  );
}

function mergeTableItems(base = [], added = []) {
  const result = base.map(item => ({ ...item }));

  for (const item of added) {
    const variant = item.variant || "";
    const found = result.find(current =>
      current.id === item.id && (current.variant || "") === variant
    );

    if (found) {
      found.qty = Number(found.qty || 0) + Number(item.qty || 0);
    } else {
      result.push({
        id: item.id,
        name: item.name,
        variant,
        price: Number(item.price || 0),
        qty: Number(item.qty || 0)
      });
    }
  }

  return result;
}

function orderTablePickerHtml() {
  const count = Number(state.settings.tableCount || 0);

  return Array.from({ length: count }, (_, index) => index + 1)

      const paid = account?.status === "paid";
      const label = paid
        ? "Pagada · limpiar primero"
        : account?.status === "open"
          ? `Cuenta abierta · ${money(tableItemsTotal(account.items))}`
          : "Libre";

      return `
        <button
          class="table-pick"
          ${paid ? "disabled" : ""}
          style="${paid ? "opacity:.45;cursor:not-allowed" : ""}"
          onclick="startOrderForTable(${number})"
        >
          Mesa ${number}
          <small>${label}</small>
        </button>
      `;
    })
    .join("");
}

function orderDraftSummaryHtml() {
  if (!orderDraft?.items?.length) {
    return `<div class="empty" style="padding:18px 8px">Todavía no has agregado productos.</div>`;
  }

  return orderDraft.items
    .map(item => `
      <div class="ticket-line">

        <strong>${money(Number(item.price || 0) * Number(item.qty || 0))}</strong>

}

function renderOrders() {

    .filter(o => foodOrders && ordersTab === "table" ? orderKind(o) === "table" : orderKind(o) === "whatsapp")

  const html = list.length ? list.map(order => {
    const status = normalizeOrderStatus(order.status);

    const account = orderKind(order) === "table"

      : null;
    const accountState = account?.status === "open"
      ? `Cuenta abierta · ${money(tableItemsTotal(account.items))}`
      : account?.status === "paid"
        ? "Cuenta pagada"
        : orderKind(order) === "table" ? "Cuenta de mesa" : `${order.customer || "Cliente"}${order.phone ? ` · ${order.phone}` : ""}`;
    const statusTime = orderStatusTime(order);
    const title = orderKind(order) === "table" ? `Mesa ${esc(order.tableNumber || "-")}` : `${esc(order.customer || "Cliente WhatsApp")}`;
    const subtitle = orderKind(order) === "table"
      ? `Pedido #${order.number} · ${dateTime(order.createdAt)}`
      : `Pedido #W-${String(order.number || "").padStart(3,"0")} · ${esc(order.fulfillment || "Recoger")} · ${dateTime(order.createdAt)}`;
    const whatsHref = orderPhoneHref(order);
    const customerName = String(order.customer || "").trim();
    const readyText = [
      `¡Hola${customerName ? `, ${customerName}` : ""}! 👋`,
      "",
      `Tu pedido #W-${String(order.number || "").padStart(3,"0")} ya está listo ✅`,
      "",
      `Total: ${money(orderTotal(order))}`,
      "",
      order.fulfillment === "Express" ? "Tu pedido está listo para salir a entrega." : "Puedes pasar a retirarlo cuando gustes.",
      "",
      `¡Gracias por comprar en ${state.settings.businessName || "nuestro negocio"}! 😊`
    ].join("\n");
    const readyHref = orderPhoneHref(order, readyText);
    const quoteHref = retailQuoteHref(order);
    const whatsappButtons = orderKind(order) === "whatsapp" ? `
      ${whatsHref ? `<a class="btn ghost" href="${whatsHref}" target="_blank" rel="noopener">Abrir chat</a>` : ""}
      ${isProducts() && quoteHref ? `<a class="btn ghost" href="${quoteHref}" target="_blank" rel="noopener">Enviar cotización</a>` : ""}
      ${isFood() && status === "Listo" && readyHref ? `<a class="btn ghost" href="${readyHref}" target="_blank" rel="noopener">Avisar listo</a>` : ""}
    ` : "";

    let workflowButtons = "";
    if (next) workflowButtons += `<button class="btn primary" onclick="orderStatus('${order.id}','${next}')">${next}</button>`;
    if (orderKind(order) === "whatsapp" && !paid && ((isFood() && status === "Listo") || (isProducts() && (status === "Recibido" || status === "Listo")))) workflowButtons += `<button class="btn primary" onclick="openOrderInSale('${order.id}')">Cobrar pedido</button>`;
    if (paidSale) workflowButtons += `<button class="btn ghost" onclick="showOrderReceipt('${order.id}')">Ver comprobante #${paidSale.number}</button>`;
    if (orderKind(order) === "table" && account?.status === "open") workflowButtons += `<button class="btn ghost" onclick="openTable(${Number(order.tableNumber)})">Abrir cuenta de mesa</button>`;

    return `
      <div class="row-card">
        <div class="row-head">
          <div>
            <strong style="font-size:21px">${title}</strong>
            <div class="muted">${subtitle}</div>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><span class="badge">${esc(status)}</span>${orderKind(order)==="whatsapp" ? `<span class="badge" style="${paid ? "background:#e8f4ec;color:#2d6d43" : "background:#fff3d6;color:#8a5600"}">${paid ? "Pagado" : "Por cobrar"}</span>` : ""}</div>
        </div>
        <div class="muted" style="margin-top:8px">${esc(accountState)} · ${orderAgeText(order)}${statusTime ? ` · ${esc(status)} ${esc(statusTime)}` : ""}</div>
        <div style="margin-top:12px">
          ${(order.items || []).map(item => `<div class="ticket-line"><span>${item.qty} × ${esc(item.name)}</span><strong>${money(Number(item.price || 0) * Number(item.qty || 0))}</strong></div>`).join("")}
          ${Number(order.expressFee||0)>0 ? `<div class="ticket-line"><span>Express</span><strong>${money(order.expressFee)}</strong></div>` : ""}
          <div class="ticket-line ticket-total"><span>Total</span><strong>${money(orderTotal(order))}</strong></div>
        </div>
        <div class="toolbar" style="margin-top:12px">
          ${workflowButtons}
          ${whatsappButtons}
          <button class="btn ghost" onclick="showOrderDetail('${order.id}')">Ver pedido</button>
        </div>
      </div>`;
  }).join("") : `<div class="empty">No hay pedidos activos en esta sección.</div>`;

  const orderTabs = foodOrders ? `
    <div class="toolbar order-tabs">
      <button class="btn ${ordersTab === "table" ? "primary" : "ghost"}" onclick="ordersTab='table';renderOrders()">Pedidos de mesa (${tableCount})</button>
      <button class="btn ${ordersTab === "whatsapp" ? "primary" : "ghost"}" onclick="ordersTab='whatsapp';renderOrders()">Pedidos WhatsApp (${whatsCount})</button>
    </div>` : `
    <div class="toolbar order-tabs">
      <button class="btn primary" onclick="ordersTab='whatsapp';renderOrders()">Pedidos WhatsApp (${whatsCount})</button>

  const orderActions = foodOrders ? `

      <button class="btn primary" onclick="newOrder()">Tomar pedido de mesa</button>
      <button class="btn ghost" onclick="newWhatsappOrder()">Nuevo pedido WhatsApp</button>
      <button class="btn ghost" onclick="go('tables')">Ver mesas</button>
    </div>` : `
    <div class="toolbar">
      <button class="btn primary" onclick="newWhatsappOrder()">Nuevo pedido WhatsApp</button>
    </div>`;

  $("#app").innerHTML = shell(`
    <section class="screen-title"><h2>Pedidos</h2><p>${foodOrders?"Recibido → Listo → Cobrar → Entregado.":"Estados simples: Recibido → Entregado. Cobra cuando el cliente confirme."}</p></section>
    ${orderTabs}
    ${orderActions}
    <div class="list">${html}</div>
  `, "orders");
}

  const sale = orderPaidSale(order);

    <div class="ticket-line"><span>Pago</span><strong>${sale ? `Pagado · Comprobante #${sale.number}` : "Por cobrar"}</strong></div>
    ${order.customer ? `<div class="ticket-line"><span>Cliente</span><strong>${esc(order.customer)}</strong></div>` : ""}
    ${order.phone ? `<div class="ticket-line"><span>Teléfono</span><strong>${esc(order.phone)}</strong></div>` : ""}
    ${order.address ? `<div class="panel" style="box-shadow:none;margin:10px 0;padding:12px"><span class="muted">Dirección / referencia</span><div>${esc(order.address)}</div></div>` : ""}
    <div class="divider"></div>
    ${(order.items||[]).map(item=>`<div class="ticket-line"><span>${item.qty} × ${esc(item.name)}${item.variant?` · ${esc(item.variant)}`:""}</span><strong>${money(Number(item.price||0)*Number(item.qty||0))}</strong></div>`).join("")}
    ${Number(order.expressFee||0)>0?`<div class="ticket-line"><span>Express</span><strong>${money(order.expressFee)}</strong></div>`:""}
    <div class="ticket-line ticket-total"><span>Total</span><strong>${money(orderTotal(order))}</strong></div>
    ${order.notes ? `<div class="panel" style="box-shadow:none;margin-top:10px;padding:12px"><span class="muted">Nota</span><div>${esc(order.notes)}</div></div>` : ""}
    <div class="toolbar" style="margin-top:14px">${sale ? `<button class="btn primary" onclick="closeModal();showReceipt(state.sales.find(s=>s.id==='${sale.id}'))">Ver comprobante</button>` : (orderKind(order)==="whatsapp" && ((isFood()&&normalizeOrderStatus(order.status)==="Listo")||(isProducts()&&["Recibido","Listo"].includes(normalizeOrderStatus(order.status)))) ? `<button class="btn primary" onclick="closeModal();openOrderInSale('${order.id}')">Cobrar pedido</button>` : "")}${isProducts()&&retailQuoteHref(order)?`<a class="btn ghost" href="${retailQuoteHref(order)}" target="_blank" rel="noopener">Enviar cotización</a>`:""}<button class="btn" onclick="closeModal()">Cerrar</button></div>`);
};
window.showOrderReceipt = id => {
  const order = state.orders.find(o => o.id === id);
  const sale = order ? orderPaidSale(order) : null;
  if (!sale) return toast("Este pedido todavía no tiene un comprobante pagado.");
  showReceipt(sale);
};

window.newOrder = () => {
  if (!isFood()) return toast("Los pedidos de mesa solo están disponibles en Comida.");
  if (!currentShift()) return toast("Primero debes abrir la caja.");
  if (!Number(state.settings.tableCount || 0)) return configureTables();

  orderDraft = {
    tableNumber: "",
    items: [],
    note: "",
    category: ""
  };

  showOrderTableStep();
};

window.showOrderTableStep = () => {
  if (!orderDraft) {
    orderDraft = { tableNumber: "", items: [], note: "", category: "" };
  }

  modal(`
    <div class="category-modal-header">
      <div>
        <h3>1. Elegir mesa</h3>
        <p class="muted" style="margin:5px 0 0">Selecciona la mesa donde vas a tomar el pedido.</p>
      </div>
      <button class="modal-close" onclick="cancelOrderDraft()">×</button>
    </div>

    <div class="table-picker-grid">
      ${orderTablePickerHtml()}
    </div>

    ${orderDraft.items.length ? `
      <div class="table-account-banner" style="margin-top:16px">
        <span>Tu pedido sigue guardado</span>
        <strong>${orderDraftQty()} productos · ${money(totals(orderDraftSubtotal()).total)}</strong>
      </div>
    ` : ""}

    <div class="toolbar" style="margin-top:18px">
      <button class="btn" onclick="cancelOrderDraft()">Cancelar</button>
    </div>
  `);
};

window.startOrderForTable = number => {
  const account = tableAccount(number);

  if (account?.status === "paid") {
    return toast(`Mesa ${number} ya fue pagada. Límpiala antes de usarla de nuevo.`);
  }

  if (!orderDraft) {
    orderDraft = { tableNumber: "", items: [], note: "", category: "" };
  }

  orderDraft.tableNumber = Number(number);
  showOrderCategoryStep();
};

function showOrderCategoryStep() {
  if (!orderDraft) return renderOrders();

  const categories = productCategories();
  const isWhatsappDraft = orderDraft.kind === "whatsapp";
  const account = isWhatsappDraft ? null : tableAccount(orderDraft.tableNumber);
  const accountText = isWhatsappDraft
    ? `${orderDraft.fulfillment || "Recoger"}${orderDraft.customer ? ` · ${orderDraft.customer}` : ""}`
    : account?.status === "open"
      ? `Cuenta abierta: ${money(tableItemsTotal(account.items))}`
      : "Mesa sin cuenta abierta";

  const categoryHtml = categories.length
    ? categories.map(category => {
        const count = currentProducts().filter(
          product => (product.category?.trim() || "Otros") === category
        ).length;

        return `
          <button
            class="category-card"
            onclick="orderPickCategory(decodeURIComponent('${enc(category)}'))"
          >
            <span class="category-name">${esc(category)}</span>
            <span class="category-count">${count} productos</span>
            <span class="category-arrow">›</span>
          </button>
        `;
      }).join("")
    : `<div class="empty">Primero agrega productos y categorías.</div>`;

  modal(`
    <div class="category-modal-header">
      <div>
        <h3>${isWhatsappDraft ? "Elegir categoría" : "2. Elegir categoría"}</h3>
        <p class="muted" style="margin:5px 0 0">${isWhatsappDraft ? "WhatsApp" : `Mesa ${orderDraft.tableNumber}`} · ${esc(accountText)}</p>
      </div>
      <button class="modal-close" onclick="cancelOrderDraft()">×</button>
    </div>

    <div class="category-grid" style="margin-top:16px">
      ${categoryHtml}
    </div>

    ${orderDraft.items.length ? `
      <div class="table-account-banner" style="margin-top:16px">
        <span>${orderDraftQty()} productos en este pedido</span>
        <strong>${money(totals(orderDraftSubtotal()).total)}</strong>
      </div>
    ` : ""}

    <div class="toolbar" style="margin-top:16px">
      <button class="btn ghost" onclick="orderDraft.kind === 'whatsapp' ? showWhatsappInfoStep() : showOrderTableStep()">‹ Volver</button>
      ${orderDraft.items.length ? `<button class="btn primary" onclick="showOrderReviewStep()">Revisar pedido</button>` : ""}
      <button class="btn" onclick="cancelOrderDraft()">Cancelar</button>
    </div>
  `);
}

window.orderPickCategory = category => {
  if (!orderDraft) return;
  orderDraft.category = category;
  showOrderProductsStep();
};

function showOrderProductsStep() {
  if (!orderDraft) return renderOrders();

  if (!orderDraft.category) return showOrderCategoryStep();

  const products = currentProducts().filter(
    product => (product.category?.trim() || "Otros") === orderDraft.category
  );

  const productHtml = products.length
    ? products.map(product => {
        const selected = orderDraft.items.find(item => item.id === product.id);
        return `
          <button
            class="category-product"
            onclick="addOrderProduct('${product.id}')"
          >
            <div>
              <strong>${esc(product.name)}</strong>
              <small>${selected ? `Agregado × ${selected.qty}` : "Toca para agregar"}</small>
            </div>
            <span class="category-product-price">${money(product.price)}</span>
          </button>
        `;
      }).join("")
    : `<div class="empty">No hay productos en esta categoría.</div>`;

  modal(`
    <div class="category-modal-header">
      <div>
        <h3>3. ${esc(orderDraft.category)}</h3>
        <p class="muted" style="margin:5px 0 0">${orderDraft.kind === "whatsapp" ? "WhatsApp" : `Mesa ${orderDraft.tableNumber}`} · toca cada producto para agregarlo.</p>
      </div>
      <button class="modal-close" onclick="cancelOrderDraft()">×</button>
    </div>

    <div class="category-products" style="margin-top:16px">
      ${productHtml}
    </div>

    <div class="table-account-banner" style="margin-top:16px">
      <span>${orderDraftQty()} productos seleccionados</span>
      <strong>${money(totals(orderDraftSubtotal()).total)}</strong>
    </div>

    <div class="toolbar" style="margin-top:16px">
      <button class="btn ghost" onclick="showOrderCategoryStep()">‹ Categorías</button>
      <button class="btn primary" onclick="showOrderReviewStep()">Revisar pedido</button>
      <button class="btn" onclick="cancelOrderDraft()">Cancelar</button>
    </div>
  `);
}

window.addOrderProduct = id => {
  if (!orderDraft) return;

  const product = currentProducts().find(item => item.id === id);
  if (!product) return;

  const cartId = `${product.id}_normal`;
  const found = orderDraft.items.find(item => item.cartId === cartId);

  if (found) {
    found.qty++;
  } else {
    orderDraft.items.push({
      cartId,
      id: product.id,
      name: product.name,
      variant: "",
      price: Number(product.price || 0),
      qty: 1
    });
  }

  showOrderProductsStep();
};

window.showOrderReviewStep = () => {
  if (!orderDraft) return;

  if (!orderDraft.items.length) {
    toast("Agrega al menos un producto.");
    return showOrderProductsStep();
  }

  const expressFee = orderDraft.kind === "whatsapp" && orderDraft.fulfillment === "Express" ? Number(orderDraft.expressFee || 0) : 0;
  const total = totals(orderDraftSubtotal() + expressFee).total;

  modal(`
    <div class="category-modal-header">
      <div>
        <h3>4. Revisar pedido</h3>
        <p class="muted" style="margin:5px 0 0">${orderDraft.kind === "whatsapp" ? `WhatsApp · ${esc(orderDraft.fulfillment || "Recoger")}` : `Mesa ${orderDraft.tableNumber}`}</p>
      </div>
      <button class="modal-close" onclick="cancelOrderDraft()">×</button>
    </div>

    <div class="cart-list" style="margin-top:12px">
      ${orderDraft.items.map(item => `
        <div class="cart-item">
          <div>
            <strong>${esc(item.name)}</strong>
            <div class="muted">${money(item.price)} c/u</div>
          </div>
          <div class="qty">
            <button onclick="orderQty('${item.cartId}',-1)">−</button>
            <strong>${item.qty}</strong>
            <button onclick="orderQty('${item.cartId}',1)">+</button>
          </div>
        </div>
      `).join("")}
    </div>

    <div class="divider"></div>

    <div class="field">
      <label>Nota opcional</label>
      <textarea
        id="orderReviewNote"
        rows="3"
        placeholder="Ej. una hamburguesa sin cebolla"
        oninput="orderSetNote(this.value)"
      >${esc(orderDraft.note)}</textarea>
    </div>

    ${expressFee>0?`<div class="ticket-line"><span>Express</span><strong>${money(expressFee)}</strong></div>`:""}
    <div class="total-box">
      <span>Total de este pedido</span>
      <span>${money(total)}</span>
    </div>

    <div class="toolbar">
      <button class="btn ghost" onclick="showOrderProductsStep()">‹ Productos</button>
      <button class="btn primary" onclick="orderDraft.kind === 'whatsapp' ? saveWhatsappOrder() : saveTableOrder()">Guardar pedido</button>
      <button class="btn" onclick="cancelOrderDraft()">Cancelar</button>
    </div>
  `);
};

window.orderQty = (cartId, delta) => {
  if (!orderDraft) return;

  const item = orderDraft.items.find(current => current.cartId === cartId);
  if (!item) return;

  item.qty += delta;

  if (item.qty <= 0) {
    orderDraft.items = orderDraft.items.filter(current => current.cartId !== cartId);
  }

  if (!orderDraft.items.length) {
    return showOrderProductsStep();
  }

  showOrderReviewStep();
};

window.orderSetNote = value => {
  if (orderDraft) orderDraft.note = value;
};

window.clearOrderDraft = () => {
  if (!orderDraft) return;
  orderDraft.items = [];
  orderDraft.note = "";
  showOrderProductsStep();
};

window.cancelOrderDraft = () => {
  orderDraft = null;
  closeModal();
  screen = "orders";
  renderOrders();
};

window.saveTableOrder = async () => {
  if (!orderDraft?.items?.length) return toast("Agrega al menos un producto.");

  const now = new Date().toISOString();
  let account = tableAccount(orderDraft.tableNumber);

  if (account?.status === "paid") {
    return toast("Esta mesa ya fue pagada. Límpiala primero.");
  }

  if (!account) {
    account = {
      id: uid("table"),
      tableNumber: Number(orderDraft.tableNumber),
      openedAt: now,
      status: "open",
      items: [],
      orderIds: []
    };
    state.tableAccounts.push(account);
  }

  const order = {
    id: uid("o"),
    number: nextOrderNumber(),
    tableNumber: Number(orderDraft.tableNumber),
    tableAccountId: account.id,
    customer: "",
    items: orderDraft.items.map(item => ({
      id: item.id,
      name: item.name,
      variant: item.variant || "",
      price: Number(item.price || 0),
      qty: Number(item.qty || 0)
    })),
    notes: orderDraft.note.trim(),
    status: "Recibido",
    paymentStatus: "Pendiente",
    kind: "table",
    fulfillment: "Mesa",

function shiftReportData(shift){
  const sales=state.sales.filter(s=>s.shiftId===shift.id&&!s.voided);
  const refunds=currentBusinessRefunds().filter(r=>r.shiftId===shift.id);
  const refundBy=m=>refunds.filter(r=>r.refundMethod===m).reduce((a,b)=>a+Number(b.total||0),0);
  const sum=m=>sales.filter(s=>s.method===m).reduce((a,b)=>a+Number(b.total||0),0)-refundBy(m);
  const moves=state.cashMoves.filter(m=>m.shiftId===shift.id);
  const ins=moves.filter(m=>m.type==="in").reduce((a,b)=>a+Number(b.amount||0),0);
  const outs=moves.filter(m=>m.type==="out").reduce((a,b)=>a+Number(b.amount||0),0);
  const creditCash=moves.filter(m=>m.type==="creditPayment"&&m.method==="Efectivo").reduce((a,b)=>a+Number(b.amount||0),0);
  const products={};for(const sale of sales)for(const item of sale.items||[]){const k=item.name+(item.variant?` · ${item.variant}`:"");products[k]=(products[k]||0)+Number(item.qty||0);}
  const cash=sum("Efectivo"),sinpe=sum("SINPE"),card=sum("Tarjeta/Otro"),credit=sum("Crédito");
  const creditPayments=state.creditMoves.filter(m=>m.shiftId===shift.id&&m.type==="payment").reduce((a,b)=>a+Number(b.amount||0),0);
  const orderCounts={Mostrador:0,"Para llevar":0,Express:0,Mesa:0,WhatsApp:0};
  for(const sale of sales){const key=sale.orderType||"Mostrador";orderCounts[key]=(orderCounts[key]||0)+1;}
  return {sales,count:sales.length,gross:sales.reduce((a,b)=>a+Number(b.total||0),0)-refunds.reduce((a,b)=>a+Number(b.total||0),0),tax:sales.reduce((a,b)=>a+Number(b.tax||0),0)-refunds.reduce((a,b)=>a+Number(b.tax||0),0),cash,sinpe,card,credit,creditCash,creditPayments,ins,outs,expected:Number(shift.opening||0)+cash+ins+creditCash-outs,products,orderCounts};
}
function closingHistoryHtml(){const closed=[...state.cashSessions].filter(s=>s.status==="closed").sort((a,b)=>new Date(b.closedAt)-new Date(a.closedAt));return closed.length?closed.map(s=>`<button class="row-card" style="width:100%;text-align:left" onclick="showDayReport('${s.id}')"><div class="row-head"><div><strong>${new Date(s.closedAt).toLocaleDateString("es-CR")}</strong><div class="muted">${dateTime(s.openedAt)} → ${dateTime(s.closedAt)}</div></div><strong>${money(s.report?.gross||shiftReportData(s).gross)}</strong></div><div class="muted" style="margin-top:7px">${s.report?.count??shiftReportData(s).count} ventas · Diferencia ${money(s.difference||0)}</div></button>`).join(""):`<div class="empty">Todavía no hay cierres guardados.</div>`;}

window.saveCloseCash=async expected=>{if(!requirePermission("cash","No tienes permiso para cerrar la caja."))return;const sh=currentShift();if(!sh)return;const report=shiftReportData(sh);sh.expected=expected;sh.counted=Number($("#counted").value||0);sh.difference=sh.counted-expected;sh.closedAt=new Date().toISOString();sh.status="closed";sh.report=buildShiftSnapshot(sh);cloudQueueAuditEvent(sh,"close","cash_shift",{status:"open",opening:Number(sh.opening||0)},{status:"closed",expected:Number(sh.expected||0),counted:Number(sh.counted||0),difference:Number(sh.difference||0)});await put("cashSessions",sh);try{await cloudSaveCashSessionFromApp(sh);}catch(error){console.error(error);sh.cloudPending=true;await put("cashSessions",sh);}closeModal();showDayReport(sh.id);};

/* =========================
   RESPALDOS / RESTAURACIÓN
   PUNTO YA CR v7.15
========================= */
const MPCR_BACKUP_VERSION = 1;
const MPCR_BACKUP_TABLES = [
  "categories",
  "products",
  "clients",
  "business_employees",
  "restaurant_tables",
  "cash_shifts",
  "table_accounts",
  "sales",
  "sale_items",
  "payments",
  "credit_movements",
  "cash_movements",
  "orders",
  "order_items",
  "inventory_movements",
  "audit_log"
];

let pendingBackupRestore = null;

function backupReady() {
  return !!(role === "owner" && isProPlan() && mpCloud && mpCloudUser && mpCloudBusiness?.id && state.settings.cloudLinked);
}

function renderBackupSettingsPanel() {
  if (role !== "owner" || !isProPlan()) return "";
  const online = navigator.onLine;
  return `<div class="panel" style="margin-top:14px">
    <div class="row-head">
      <div>
        <strong>Copias de seguridad</strong>
        <p class="muted" style="margin:5px 0 0">Descarga un respaldo del negocio desde Supabase y úsalo para recuperar información si fuera necesario.</p>
      </div>
    </div>
    <div class="toolbar" style="margin-top:12px">
      <button class="btn primary" onclick="cloudExportBusinessBackup()" ${online ? "" : "disabled"}>Descargar respaldo</button>
      <button class="btn ghost" onclick="openBackupRestore()" ${online ? "" : "disabled"}>Restaurar respaldo</button>
    </div>
    <input id="backupRestoreFile" type="file" accept="application/json,.json" hidden onchange="readBackupRestoreFile(this)">
    <p class="muted" style="margin:10px 0 0">Solo el Dueño puede exportar o restaurar. La restauración recupera los registros incluidos en el archivo y no elimina información más nueva que no esté en ese respaldo.</p>
  </div>`;
}

function backupFileName(name, exportedAt) {
  const safe = String(name || "negocio")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9_-]+/gi, "-")
    .replace(/^-+|-+$/g, "")
    .slice(0, 40) || "negocio";
  const date = new Date(exportedAt || Date.now()).toISOString().slice(0, 10);
  return `PUNTO-YA-CR-${safe}-${date}.json`;
}

async function backupSelectAll(table, businessId) {
  const pageSize = 1000;
  const rows = [];
  for (let from = 0; ; from += pageSize) {
    const { data, error } = await mpCloud
      .from(table)
      .select("*")
      .eq("business_id", businessId)
      .order("id", { ascending: true })
      .range(from, from + pageSize - 1);
    if (error) throw error;
    const batch = data || [];
    rows.push(...batch);
    if (batch.length < pageSize) break;
  }
  return rows;
}

async function backupAudit(action, newData = null) {
  if (!backupReady()) return;
  try {
    await mpCloud.from("audit_log").insert({
      business_id: mpCloudBusiness.id,
      user_id: mpCloudUser.id,
      action,
      entity_type: "backup",
      entity_id: null,
      old_data: null,
      new_data: newData
    });
  } catch (error) {
    console.warn("Auditoría respaldo:", error?.message || error);
  }
}

window.cloudExportBusinessBackup = async () => {
  if (role !== "owner") return toast("Solo el Dueño puede crear respaldos.");
  if (!navigator.onLine) return toast("Necesitas Internet para descargar el respaldo.");
  if (!backupReady()) return toast("La cuenta no está conectada a la nube.");

  try {
    modal(`<h3>Preparando respaldo</h3><p class="muted">Estamos leyendo la información del negocio desde Supabase. No cierres esta ventana.</p>`);

    // Primero intenta subir cualquier trabajo offline pendiente.
    await cloudSyncCatalogClients({ silent: true });
    await cloudSyncOperations({ silent: true });

    const businessId = mpCloudBusiness.id;
    const { data: business, error: businessError } = await mpCloud
      .from("businesses")
      .select("id,name,business_type,settings,created_at,updated_at")
      .eq("id", businessId)
      .single();
    if (businessError) throw businessError;

    const tables = {};
    for (const table of MPCR_BACKUP_TABLES) {
      tables[table] = await backupSelectAll(table, businessId);
    }

    const exportedAt = new Date().toISOString();
    const payload = {
      app: "PUNTO YA CR",
      backupVersion: MPCR_BACKUP_VERSION,
      exportedAt,
      businessId,
      businessName: business?.name || state.settings.businessName || "PUNTO YA CR",
      businessType: business?.business_type || state.settings.businessType || "food",
      business,
      tables
    };

    const json = JSON.stringify(payload, null, 2);
    const blob = new Blob([json], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = backupFileName(payload.businessName, exportedAt);
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);

    await backupAudit("backup_export", {
      exported_at: exportedAt,
      counts: Object.fromEntries(Object.entries(tables).map(([key, value]) => [key, value.length]))
    });

    closeModal();
    toast("Respaldo descargado.");
  } catch (error) {
    console.error("Respaldo:", error);
    closeModal();
    toast(`No se pudo crear el respaldo: ${cloudAuthErrorMessage(error)}`);
  }
};

window.openBackupRestore = () => {
  if (role !== "owner") return toast("Solo el Dueño puede restaurar respaldos.");
  if (!navigator.onLine) return toast("Necesitas Internet para restaurar.");
  const input = document.querySelector("#backupRestoreFile");
  if (!input) return toast("Abre Configuración e inténtalo de nuevo.");
  input.value = "";
  input.click();
};

function backupSummaryHtml(backup) {
  const t = backup.tables || {};
  const items = [
    ["Productos / servicios", (t.products || []).length],
    ["Clientes", (t.clients || []).length],
    ["Ventas", (t.sales || []).length],
    ["Pagos", (t.payments || []).length],
    ["Cajas", (t.cash_shifts || []).length],
    ["Pedidos", (t.orders || []).length]
  ];
  return items.map(([label, count]) => `<div class="ticket-line"><span>${esc(label)}</span><strong>${Number(count || 0)}</strong></div>`).join("");
}

window.readBackupRestoreFile = async input => {
  const file = input?.files?.[0];
  if (!file) return;
  if (file.size > 50 * 1024 * 1024) {
    input.value = "";
    return toast("El archivo supera el límite de 50 MB.");
  }

  try {
    const parsed = JSON.parse(await file.text());
    if (!["PUNTO YA CR","Mi Punto CR"].includes(parsed?.app) || Number(parsed?.backupVersion || 0) !== MPCR_BACKUP_VERSION || !parsed?.tables) {
      throw new Error("El archivo no es un respaldo válido de PUNTO YA CR.");
    }
    if (!backupReady()) throw new Error("La cuenta no está conectada a la nube.");
    if (String(parsed.businessId || "") !== String(mpCloudBusiness.id || "")) {
      throw new Error("Este respaldo pertenece a otro negocio.");
    }

    pendingBackupRestore = parsed;
    modal(`<h3>Restaurar respaldo</h3>
      <p class="muted">Respaldo de <strong>${esc(parsed.businessName || "PUNTO YA CR")}</strong> · ${esc(dateTime(parsed.exportedAt))}</p>
      <div style="margin:14px 0">${backupSummaryHtml(parsed)}</div>
      <div class="setup-note">La restauración reemplaza por ID los registros incluidos en el respaldo, pero no borra registros más nuevos que no estén en el archivo. Debes estar conectado a Internet.</div>
      <p style="margin:14px 0 7px"><strong>Para confirmar escribe RESTAURAR</strong></p>
      <input id="restoreConfirmText" autocomplete="off" placeholder="RESTAURAR" style="text-transform:uppercase">
      <div class="toolbar" style="margin-top:14px">
        <button class="btn danger" onclick="confirmCloudRestoreBackup()">Restaurar ahora</button>
        <button class="btn ghost" onclick="pendingBackupRestore=null;closeModal()">Cancelar</button>
      </div>`);
  } catch (error) {
    console.error("Leer respaldo:", error);
    pendingBackupRestore = null;
    toast(error?.message || "No se pudo leer el respaldo.");
  } finally {
    input.value = "";
  }
};

function backupRows(backup, table) {
  return Array.isArray(backup?.tables?.[table]) ? backup.tables[table] : [];
}

function backupBusinessRows(backup, table, transform = null) {
  return backupRows(backup, table).map(row => {
    const next = { ...row, business_id: mpCloudBusiness.id };
    return transform ? transform(next, row) : next;
  });
}

async function backupUpsert(table, rows, { ignoreDuplicates = false } = {}) {
  if (!rows.length) return;
  const chunkSize = 200;
  for (let i = 0; i < rows.length; i += chunkSize) {
    const chunk = rows.slice(i, i + chunkSize);
    const { error } = await mpCloud
      .from(table)
      .upsert(chunk, { onConflict: "id", ignoreDuplicates });
    if (error) throw error;
  }
}

window.confirmCloudRestoreBackup = async () => {
  if (role !== "owner") return toast("Solo el Dueño puede restaurar respaldos.");
  if (!navigator.onLine) return toast("Necesitas Internet para restaurar.");
  if (!pendingBackupRestore) return toast("Selecciona nuevamente el respaldo.");
  if (String(document.querySelector("#restoreConfirmText")?.value || "").trim().toUpperCase() !== "RESTAURAR") {
    return toast("Escribe RESTAURAR para confirmar.");
  }

  const backup = pendingBackupRestore;
  pendingBackupRestore = null;

  try {
    modal(`<h3>Restaurando</h3><p class="muted">Estamos recuperando la información en Supabase. No cierres PUNTO YA CR hasta que termine.</p>`);

    const businessPatch = {
      name: backup.business?.name || backup.businessName || mpCloudBusiness.name,
      business_type: backup.business?.business_type || backup.businessType || mpCloudBusiness.business_type,
      settings: backup.business?.settings && typeof backup.business.settings === "object" ? backup.business.settings : (mpCloudBusiness.settings || {})
    };
    const { data: restoredBusiness, error: businessError } = await mpCloud
      .from("businesses")
      .update(businessPatch)
      .eq("id", mpCloudBusiness.id)
      .select("*")
      .single();
    if (businessError) throw businessError;

    // Dependencias básicas.
    await backupUpsert("categories", backupBusinessRows(backup, "categories"));
    await backupUpsert("products", backupBusinessRows(backup, "products"));
    await backupUpsert("clients", backupBusinessRows(backup, "clients"));
    await backupUpsert("business_employees", backupBusinessRows(backup, "business_employees"));
    await backupUpsert("restaurant_tables", backupBusinessRows(backup, "restaurant_tables"));
    await backupUpsert("cash_shifts", backupBusinessRows(backup, "cash_shifts"));

    // Rompemos temporalmente el ciclo table_accounts <-> sales.
    const originalAccounts = backupBusinessRows(backup, "table_accounts");
    await backupUpsert("table_accounts", originalAccounts.map(row => ({ ...row, paid_sale_id: null })));
    await backupUpsert("sales", backupBusinessRows(backup, "sales"));
    await backupUpsert("table_accounts", originalAccounts);

    await backupUpsert("sale_items", backupBusinessRows(backup, "sale_items"));
    await backupUpsert("payments", backupBusinessRows(backup, "payments"));
    await backupUpsert("credit_movements", backupBusinessRows(backup, "credit_movements"));
    await backupUpsert("cash_movements", backupBusinessRows(backup, "cash_movements"));
    await backupUpsert("orders", backupBusinessRows(backup, "orders"));
    await backupUpsert("order_items", backupBusinessRows(backup, "order_items"));

    // Tablas de solo historial: si el ID ya existe, se conserva el registro actual.
    await backupUpsert("inventory_movements", backupBusinessRows(backup, "inventory_movements"), { ignoreDuplicates: true });
    await backupUpsert("audit_log", backupBusinessRows(backup, "audit_log"), { ignoreDuplicates: true });

    mpCloudBusiness = restoredBusiness || { ...mpCloudBusiness, ...businessPatch };
    await cloudPersistLocalIdentity(mpCloudUser, mpCloudBusiness, mpCloudMembership);

    // Recarga local directamente desde la nube sin subir primero el caché viejo.
    const catalogRemote = await cloudLoadCatalogClientsRemote();
    await cloudMergeRemoteCatalogClients(catalogRemote);
    const operationsRemote = await cloudLoadOperationsRemote();
    await cloudMergeOperationsRemote(operationsRemote);

    await backupAudit("backup_restore", {
      backup_exported_at: backup.exportedAt || null,
      restored_at: new Date().toISOString()
    });

    closeModal();
    screen = "home";
    render();
    toast("Respaldo restaurado correctamente.");
  } catch (error) {
    console.error("Restaurar respaldo:", error);
    closeModal();
    toast(`No se pudo completar la restauración: ${cloudAuthErrorMessage(error)}`);
  }
};

function catalogPublicUrl({scope="all",category="",items=[]}={}) {
  const url = new URL(window.location.href);
  const publicBusinessId = state.settings.cloudBusinessId || (String(state.settings.localDataBusinessId||"").match(/^[0-9a-f-]{36}$/i) ? state.settings.localDataBusinessId : "");
  const params=new URLSearchParams();
  params.set("catalog","1");
  if(publicBusinessId) params.set("business",publicBusinessId);
  if(isProducts() && scope==="category" && category){params.set("share","category");params.set("category",category);}
  if(isProducts() && scope==="products" && items.length){params.set("share","products");params.set("items",items.join(","));}
  url.search=`?${params.toString()}`;
  url.hash = "";
  return url.toString();
}

function adminTrackedEntities() {
  return [
    ...state.products,
    ...state.clients,
    ...state.sales,
    ...state.orders,
    ...state.cashMoves,
    ...state.cashSessions,
    ...state.creditMoves,
    ...state.tableAccounts
  ];
}

function adminPendingSyncCount() {
  if (!isProPlan()) return 0;
  return adminTrackedEntities().reduce((total, entity) => {
    if (!entity || typeof entity !== "object") return total;
    let pending = 0;
    if (entity.cloudPending) pending += 1;
    if (entity.cloudPendingDelete) pending += 1;
    if (Array.isArray(entity.cloudAuditQueue)) pending += entity.cloudAuditQueue.length;
    if (Array.isArray(entity.cloudInventoryQueue)) pending += entity.cloudInventoryQueue.length;
    return total + pending;
  }, 0);
}

function adminLastSyncAt() {
  const values = [
    state.settings.catalogLastCloudSyncAt,
    state.settings.operationsLastCloudSyncAt
  ].filter(Boolean).map(value => new Date(value)).filter(date => !Number.isNaN(date.getTime()));
  if (!values.length) return "";
  return new Date(Math.max(...values.map(date => date.getTime()))).toISOString();
}

function renderAdminSyncPanel() {
  const pending = adminPendingSyncCount();
  const online = navigator.onLine;
  const linked = !!state.settings.cloudLinked;
  const pro = isProPlan();
  const lastSync = adminLastSyncAt();
  if (linked && !pro) {
    return `<div class="panel" style="margin-top:14px"><div class="row-head"><div><strong>Plan Gratis · datos locales</strong><p class="muted" style="margin:5px 0 0">Ventas, clientes, caja e inventario operativo se guardan en este dispositivo. Tu catálogo público sí puede publicarse en línea.</p></div><button class="btn primary" onclick="openProPlans()">Ver Pro</button></div></div>`;
  }
  let title = state.settings.guestMode ? "Modo sin cuenta" : "Nube no vinculada";
  let detail = state.settings.guestMode ? "Tus datos están solo en este dispositivo." : "Inicia sesión para usar tu cuenta.";
  if (linked && !online) { title = pending ? `${pending} cambio${pending===1?"":"s"} pendiente${pending===1?"":"s"}` : "Sin conexión"; detail = pending ? "Se subirán cuando vuelva Internet." : "Puedes seguir trabajando offline."; }
  else if (linked && pending) { title = `${pending} cambio${pending===1?"":"s"} pendiente${pending===1?"":"s"}`; detail = "Puedes sincronizar ahora o esperar a la sincronización automática."; }
  else if (linked) { title = "Todo sincronizado ✓"; detail = lastSync ? `Última sincronización: ${dateTime(lastSync)}.` : "Tu operación Pro está conectada a la nube."; }
  return `<div class="panel" style="margin-top:14px"><div class="row-head"><div><strong>Estado del negocio</strong><p class="muted" style="margin:5px 0 0">${esc(title)} · ${esc(detail)}</p></div>${linked ? `<button class="btn ${pending?"primary":"ghost"}" onclick="syncBusinessNow()" ${online?"":"disabled"}>Sincronizar ahora</button>` : (state.settings.guestMode ? `<button class="btn primary" onclick="openCloudLink()">Crear cuenta</button>` : "")}</div></div>`;
}

  const links = [];
  const add = (target, title, sub) => links.push(`<button class="home-card" onclick="go('${target}')"><strong>${title}</strong><small>${sub}</small></button>`);
  if (state.settings.cloudLinked && isProPlan()) add("users", "Empleados Pro", "Códigos y permisos");

window.syncBusinessNow = async () => {
  if (!navigator.onLine) return toast("No hay conexión a Internet.");
  if (!state.settings.cloudLinked) return toast("Este negocio no está conectado a la nube.");
  if (!isProPlan()) return openProPlans();
  try {
    toast("Sincronizando…");
    await cloudSyncCatalogClients({ silent: true });
    await cloudSyncOperations({ silent: true });
    await put("settings", state.settings);
    renderSettings();
    toast(adminPendingSyncCount() ? "Quedan cambios pendientes de sincronizar." : "Todo sincronizado.");
  } catch (error) {
    console.error(error);
    toast("No se pudo completar la sincronización. Intenta nuevamente.");
  }
};

function renderProSettingsPanel() {

  const detail = pro ? "Tu negocio tiene PUNTO YA CR PRO activo. Respaldo y sincronización Pro están habilitados." : "La operación básica funciona offline. Pro agrega nube, facturación electrónica y herramientas para crecer.";

ales a anunciantes.</p><h4>Conservación y controles</h4><p>El usuario puede exportar sus datos locales, cerrar sesión y solicitar la eliminación de su cuenta. Algunos registros comerciales o fiscales pueden necesitar conservarse cuando exista una obligación legal aplicable.</p><h4>Seguridad</h4><p>La aplicación aplica bloqueo por inactividad, permisos por rol cuando corresponde y protección del PIN local mediante derivación criptográfica en navegadores compatibles. Ningún sistema es completamente inmune a incidentes, por lo que también es importante proteger el dispositivo y las credenciales de la cuenta.</p></div>`; }

function periodStart(days){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(days-1));return d;}

function profitStats(days=30){const start=periodStart(days), sales=activeCurrentSales().filter(s=>new Date(s.createdAt)>=start);const revenue=sales.reduce((a,s)=>a+Number(s.total||0),0);const cost=sales.reduce((a,s)=>a+(s.items||[]).reduce((x,i)=>x+Number(i.cost||0)*Number(i.qty||0),0),0);const expenses=businessExpenses(days).reduce((a,e)=>a+Number(e.amount||0),0);return{revenue,cost,expenses,profit:revenue-cost-expenses};}

let lockPinBuffer = "";
let pinFailedAttempts = 0;
let pinLockoutUntil = 0;
function proCodeMode(){ return !state.settings.guestMode && isProPlan(); }
function renderLock() {
  lockPinBuffer = "";
  const pro = proCodeMode();
  const display = pro
    ? `<div class="employee-code-display"><span>CR</span><strong id="lockPinDisplay">____</strong></div>`
    : `<div class="pin-display" id="lockPinDisplay">____</div>`;
  $("#app").innerHTML = `<div class="lock-screen"><div class="lock-card pin-pad-card"><div class="lock-brand">${brandVertical("brand-logo-vertical")}${pro ? `<div class="lock-pro-badge">${proBrandBadge()}</div>` : ""}</div><p>${pro ? "Ingresa tu código CR." : "Ingresa tu código."}</p>${display}<div class="pin-keypad">${[1,2,3,4,5,6,7,8,9].map(n => `<button onclick="lockPinKey('${n}')">${n}</button>`).join("")}<button class="key-delete" onclick="lockPinBackspace()">⌫</button><button onclick="lockPinKey('0')">0</button><button class="key-clear" onclick="lockPinClear()">×</button></div><div id="lockPinStatus" class="muted" style="text-align:center;margin-top:10px"></div></div></div>`;
}
function drawLockPin() {
  const len = 4;
  const el = $("#lockPinDisplay");
  if (el) el.textContent = "•".repeat(lockPinBuffer.length) + "_".repeat(Math.max(0, len - lockPinBuffer.length));
}
window.lockPinKey = digit => {
  if (lockPinBuffer.length >= 4) return;
  lockPinBuffer += String(digit);
  drawLockPin();
  if (lockPinBuffer.length === 4) setTimeout(unlock, 100);
};
window.lockPinBackspace = () => { lockPinBuffer = lockPinBuffer.slice(0, -1); drawLockPin(); };
window.lockPinClear = () => { lockPinBuffer = ""; drawLockPin(); };
window.unlock = async () => {
  const p = lockPinBuffer;
  const status = $("#lockPinStatus");
  if (Date.now() < pinLockoutUntil) { if(status) status.textContent=`Espera ${Math.ceil((pinLockoutUntil-Date.now())/1000)} s antes de intentar de nuevo.`; lockPinBuffer=""; return drawLockPin(); }
  if (proCodeMode()) {
    const n = Number(p);
    if (n === Number(state.settings.ownerProCode || 1000)) {
      role = "owner";
      state.settings.employeeId = ""; state.settings.employeeCode = ""; state.settings.memberDisplayName = "";
      await put("settings", state.settings);
      locked = false; lockPinBuffer = ""; lastActivityAt = Date.now(); return render();
    }
    try {
      if (status) status.textContent = "Verificando…";
      const row = await cloudEmployeeCodeLogin(n);
      if (!row) throw new Error("Código incorrecto");
      locked = false; lockPinBuffer = ""; lastActivityAt = Date.now(); return render();
    } catch (error) {
      console.error(error);
      if (status) status.textContent = "Código incorrecto.";
      lockPinBuffer = ""; return drawLockPin();
    }
  }
  if (await verifyLocalPin(p)) {
    pinFailedAttempts = 0; pinLockoutUntil = 0; role = "owner"; locked = false; lockPinBuffer = ""; lastActivityAt = Date.now(); return render();
  }
  pinFailedAttempts += 1;
  if (pinFailedAttempts >= 5) { pinFailedAttempts = 0; pinLockoutUntil = Date.now() + 30000; if(status) status.textContent="Demasiados intentos. Espera 30 segundos."; }
  else if (status) status.textContent = "Código incorrecto.";
  lockPinBuffer = ""; drawLockPin();
};

/* ===== PEDIDOS A PROVEEDOR ===== */
function retailSupplierOrders(){return Array.isArray(state.settings.retailSupplierOrders)?state.settings.retailSupplierOrders:[];}
function retailPayables(){return Array.isArray(state.settings.retailPayables)?state.settings.retailPayables:[];}
function supplierById(id){return retailSuppliers().find(s=>s.id===id)||null;}
function supplierOrderStatus(order){const ordered=(order.items||[]).reduce((n,i)=>n+Number(i.orderedQty||0),0),received=(order.items||[]).reduce((n,i)=>n+Number(i.receivedQty||0),0);return received<=0?'Pendiente':received<ordered?'Parcial':'Recibido';}
function supplierOrderNextNumber(){return retailSupplierOrders().reduce((m,o)=>Math.max(m,Number(o.number||0)),0)+1;}
function supplierOrderTotal(order,receivedOnly=false){return (order.items||[]).reduce((n,i)=>n+Number(receivedOnly?i.receivedQty:i.orderedQty||0)*Number(i.unitCost||0),0);}
function supplierOrderRemaining(order){return (order.items||[]).reduce((n,i)=>n+Math.max(0,Number(i.orderedQty||0)-Number(i.receivedQty||0)),0);}
function payableOutstanding(){return retailPayables().filter(p=>p.status!=='Pagado').reduce((n,p)=>n+Math.max(0,Number(p.balance ?? p.amount ?? 0)),0);}
let supplierOrderDraft=null;

function supplierOrderDraftRows(){return (supplierOrderDraft?.items||[]).map((i,idx)=>`<div class="purchase-draft-row"><div class="row-head"><div><strong>${esc(i.name)}</strong><div class="muted">${i.orderedQty} unidades · costo estimado ${money(i.unitCost)} c/u</div></div><strong>${money(Number(i.orderedQty||0)*Number(i.unitCost||0))}</strong></div><div class="toolbar"><button class="btn danger" onclick="removeSupplierOrderDraftItem(${idx})">Quitar</button></div></div>`).join('')||`<div class="empty">Agrega productos al pedido.</div>`;}

window.openNewSupplierOrder=(prefillIds=[])=>{const ids=Array.isArray(prefillIds)?prefillIds:[];supplierOrderDraft={id:uid('suporder'),number:supplierOrderNextNumber(),supplierId:'',note:'',createdAt:new Date().toISOString(),items:ids.map(id=>{const p=currentProducts().find(x=>x.id===id);if(!p)return null;const target=Math.max(Number(p.minStock||0)*2,Number(p.stock||0)+1),qty=Math.max(1,Math.ceil(target-Number(p.stock||0)));return{productId:p.id,name:p.name,orderedQty:qty,receivedQty:0,unitCost:Number(p.cost||0)};}).filter(Boolean)};renderSupplierOrderDraft();};

function v742InferPrinterWidth(name){

  if(/(^|[^0-9])58([^0-9]|$)|pos[-_ ]?58|rp[-_ ]?58|xp[-_ ]?58/.test(n))return'58';
  if(/(^|[^0-9])80([^0-9]|$)|pos[-_ ]?80|rp[-_ ]?80|xp[-_ ]?80|tm[-_ ]?t/.test(n))return'80';

}

  console.error(err);
  injectStyles();
  document.querySelector("#app").innerHTML = `<section class="onboarding"><div class="onboard-card">${brandHorizontal("brand-logo-horizontal compact")}<h2>No se pudo iniciar</h2><p>Ocurrió un error al abrir los datos locales.</p><pre style="white-space:pre-wrap;font-size:12px">${esc(err?.message || err)}</pre></div></section>`;
  window.finishPycStartupSplash?.();
});

</script>
</body>
