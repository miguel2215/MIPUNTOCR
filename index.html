<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0BB79A">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="format-detection" content="telephone=no">
<title>PUNTO YA CR</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
:root {
  --bg: #f7f7f3;
  --surface: #ffffff;
  --text: #162B38;
  --muted: #536B79;
  --primary: #11A680;
  --primary-dark: #065F5E;
  --primary-soft: #E8F7F3;
  --line: #e8e9e7;
  --danger: #b42318;
  --danger-soft: #fee4e2;
  --warning: #a15c00;
  --warning-soft: #fff3d6;
  --blue-soft: #eaf2ff;
  --shadow: 0 7px 22px rgba(25, 35, 45, 0.055);
  --radius: 22px;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  overscroll-behavior-y: none;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

#app {
  min-height: 100vh;
}

.shell {
  max-width: 1080px;
  margin: auto;
  padding: 14px 16px 110px;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;

  padding: 9px 0 13px;

  background: rgba(247, 247, 243, 0.95);
  backdrop-filter: blur(12px);
}

.brand h1 {
  margin: 0;
  font-size: 1.42rem;
  line-height: 1.1;
  font-weight: 850;
}

.brand p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 0.92rem;
}

.status-row {
  display: flex;
  gap: 7px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;

  padding: 8px 11px;

  border-radius: 999px;

  font-size: 0.79rem;
  font-weight: 750;

  background: #eceeed;
  color: #525866;
}

.badge.online {
  background: #ddf8e7;
  color: #286638;
}

.badge.offline {
  background: #fee4e2;
  color: #9b261f;
}

.screen-title {
  margin: 14px 0 17px;
}

.screen-title h2 {
  margin: 0;
  font-size: 1.5rem;
}

.screen-title p {
  margin: 5px 0 0;
  color: var(--muted);
  line-height: 1.4;
}

.home-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

.big-card {
  width: 100%;
  min-height: 84px;

  border: 1px solid var(--line);
  border-radius: 21px;

  background: var(--surface);

  padding: 18px 20px;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;

  text-align: left;

  box-shadow: var(--shadow);

  transition:
    transform 0.1s ease,
    background 0.1s ease;
}

.big-card:active {
  transform: scale(0.985);
}

.big-card strong {
  display: block;

  color: var(--text);

  font-size: 1.07rem;
  font-weight: 820;
}

.big-card small {
  display: block;

  margin-top: 5px;

  color: var(--muted);

  font-size: 0.9rem;
  line-height: 1.3;
}

.big-card.primary {
  min-height: 96px;

  background: var(--primary);
  border-color: var(--primary);
}

.big-card.primary strong {
  color: white;
  font-size: 1.16rem;
}

.big-card.primary small {
  color: #daf3ee;
}

.card-arrow {
  flex: 0 0 auto;

  color: #a4a8af;

  font-size: 1.75rem;
  font-weight: 400;
}

.big-card.primary .card-arrow {
  color: rgba(255, 255, 255, 0.82);
}

.panel {
  background: var(--surface);

  border: 1px solid var(--line);
  border-radius: var(--radius);

  padding: 16px;

  box-shadow: var(--shadow);
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;

  margin-bottom: 14px;
}

.btn {
  min-height: 45px;

  border: 0;
  border-radius: 14px;

  padding: 11px 15px;

  background: #eceeed;
  color: var(--text);

  font-weight: 760;
}

.btn.primary {
  background: var(--primary);
  color: white;
}

.btn.primary:active {
  background: var(--primary-dark);
}

.btn.ghost {
  background: white;
  border: 1px solid var(--line);
}

.btn.danger {
  background: var(--danger-soft);
  color: var(--danger);
}

.btn.full {
  width: 100%;
}

.search {
  width: 100%;

  border: 1px solid var(--line);
  border-radius: 15px;

  padding: 14px;

  margin-bottom: 12px;

  background: white;

  outline: none;
}

.search:focus,
.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: #78aaa3;
  box-shadow: 0 0 0 3px rgba(54, 127, 118, 0.09);
}

.sale-layout {
  display: grid;
  gap: 14px;
}

.grid-products {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.product-card {
  min-height: 105px;

  border: 1px solid var(--line);
  border-radius: 18px;

  background: white;

  padding: 14px;

  display: flex;
  flex-direction: column;
  justify-content: space-between;

  box-shadow: 0 4px 13px rgba(0, 0, 0, 0.035);
}

.product-card:active {
  background: #f7fbfa;
}

.product-card button {
  width: 100%;
  height: 100%;

  border: 0;
  padding: 0;

  background: transparent;

  text-align: left;
}

.product-card strong {
  font-size: 1rem;
}

.price {
  margin-top: 8px;

  color: var(--primary);

  font-size: 1.08rem;
  font-weight: 850;
}

.muted {
  color: var(--muted);
}

.cart-list {
  display: grid;
  gap: 5px;
}

.cart-item {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;

  padding: 11px 0;

  border-bottom: 1px solid var(--line);
}

.qty {
  display: flex;
  align-items: center;
  gap: 7px;
}

.qty button {
  width: 35px;
  height: 35px;

  border: 1px solid var(--line);
  border-radius: 11px;

  background: white;

  font-size: 1.05rem;
  font-weight: 850;
}

.total-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;

  margin-top: 14px;

  font-size: 1.23rem;
  font-weight: 850;
}

.payment-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 9px;

  margin-top: 15px;
}

.pay-btn {
  min-height: 57px;

  border: 0;
  border-radius: 17px;

  padding: 15px;

  font-weight: 820;
}

.pay-cash {
  background: #def7e7;
  color: #216b39;
}

.pay-sinpe {
  background: #e6f0ff;
  color: #2764b3;
}

.pay-card {
  background: #efebff;
  color: #6244a6;
}

.pay-credit {
  background: var(--warning-soft);
  color: var(--warning);
}

.list {
  display: grid;
  gap: 10px;
}

.row-card {
  padding: 15px;

  background: white;

  border: 1px solid var(--line);
  border-radius: 18px;
}

.row-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}

.form-grid {
  display: grid;
  gap: 11px;
}

.field {
  display: grid;
  gap: 6px;
}

.field label {
  color: var(--muted);

  font-size: 0.84rem;
  font-weight: 720;
}

.field input,
.field select,
.field textarea {
  width: 100%;

  border: 1px solid var(--line);
  border-radius: 14px;

  padding: 12px 13px;

  background: white;

  outline: none;
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
}

.kpi {
  min-width: 0;

  padding: 14px;

  background: white;

  border: 1px solid var(--line);
  border-radius: 17px;
}

.kpi strong {
  display: block;

  margin-top: 5px;

  font-size: 1.22rem;

  overflow-wrap: anywhere;
}

.bottom-nav {
  position: fixed;

  left: 12px;
  right: 12px;
  bottom: max(8px, env(safe-area-inset-bottom));

  z-index: 40;

  min-height: 65px;

  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 5px;

  padding: 5px;

  background: rgba(255, 255, 255, 0.97);

  border: 1px solid var(--line);
  border-radius: 22px;

  box-shadow: 0 9px 28px rgba(20, 30, 40, 0.11);

  backdrop-filter: blur(15px);
}

.bottom-nav button {
  min-width: 0;

  border: 0;
  border-radius: 16px;

  padding: 10px 3px;

  background: transparent;

  color: #6c7380;

  font-size: 0.8rem;
  font-weight: 760;
}

.bottom-nav button.active {
  background: var(--primary-soft);
  color: var(--primary);
}

.modal-backdrop {
  position: fixed;
  inset: 0;

  z-index: 100;

  display: flex;
  align-items: flex-end;
  justify-content: center;

  background: rgba(20, 28, 37, 0.46);
}

.modal {
  width: min(680px, 100%);
  max-height: 90vh;

  overflow: auto;

  padding: 20px 18px calc(20px + env(safe-area-inset-bottom));

  background: white;

  border-radius: 26px 26px 0 0;
}

.modal h3 {
  margin: 0 0 12px;
}

.modal p {
  line-height: 1.45;
}

.empty {
  padding: 30px 18px;

  color: var(--muted);

  text-align: center;
}

.divider {
  height: 1px;

  margin: 14px 0;

  background: var(--line);
}

.ticket {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

.ticket-business {
  text-align: center;
}

.ticket-business h3 {
  margin-bottom: 4px;
}

.ticket-line {
  display: flex;
  justify-content: space-between;
  gap: 10px;

  padding: 5px 0;
}

.ticket-total {
  font-size: 1.24rem;
  font-weight: 850;
}

.order-builder-products {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;

  margin-top: 10px;
}

.order-builder-products button {
  min-height: 52px;

  border: 1px solid var(--line);
  border-radius: 13px;

  padding: 10px;

  background: white;

  text-align: left;
}

.lock-screen {
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background: var(--bg);
}

.lock-card {
  width: min(420px, 100%);

  padding: 28px 20px;

  background: white;

  border: 1px solid var(--line);
  border-radius: 26px;

  box-shadow: var(--shadow);
}

.lock-card h1 {
  margin: 0;
}

.lock-card p {
  color: var(--muted);
}

.pin-input {
  width: 100%;

  padding: 15px;

  border: 1px solid var(--line);
  border-radius: 15px;

  font-size: 1.2rem;
  text-align: center;
  letter-spacing: 6px;
}

.catalog-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;

  padding: 14px 0;

  border-bottom: 1px solid var(--line);
}

.catalog-card:last-child {
  border-bottom: 0;
}

.offline-note {
  margin-bottom: 13px;

  padding: 11px 13px;

  border-radius: 14px;

  background: #fff2f0;
  color: #922b21;

  font-size: 0.86rem;
}

@media (min-width: 700px) {
  .shell {
    padding-bottom: 105px;
  }

  .home-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .grid-products {
    grid-template-columns: repeat(3, 1fr);
  }

  .sale-layout {
    grid-template-columns: 1.35fr 0.9fr;
  }

  .payment-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .kpi-grid {
    grid-template-columns: repeat(4, 1fr);
  }

  .bottom-nav {
    left: 50%;
    right: auto;

    width: min(680px, calc(100% - 24px));

    transform: translateX(-50%);
  }
}

@media (min-width: 1000px) {
  .grid-products {
    grid-template-columns: repeat(4, 1fr);
  }
}
/* ================================
   CATEGORÍAS DE VENTA
================================ */

.category-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 11px;
}

.category-card {
  position: relative;

  width: 100%;
  min-height: 82px;

  border: 1px solid var(--line);
  border-radius: 19px;

  background: white;

  padding: 17px 48px 17px 18px;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;

  text-align: left;

  box-shadow:
    0 4px 13px
    rgba(0, 0, 0, 0.035);
}

.category-card:active {
  background: var(--primary-soft);
  transform: scale(.985);
}

.category-name {
  color: var(--text);

  font-size: 1.08rem;
  font-weight: 820;
}

.category-count {
  margin-top: 5px;

  color: var(--muted);

  font-size: .86rem;
}

.category-arrow {
  position: absolute;

  right: 18px;
  top: 50%;

  transform: translateY(-50%);

  color: #a4a8af;

  font-size: 1.65rem;
}


/* ================================
   VENTANA DE CATEGORÍA
================================ */

.category-modal-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;

  gap: 15px;

  margin-bottom: 15px;
}

.category-modal-header h3 {
  margin: 0;
}

.category-modal-header p {
  margin: 5px 0 0;
}

.modal-close {
  flex: 0 0 auto;

  width: 42px;
  height: 42px;

  border: 0;
  border-radius: 50%;

  background: #f0f1f0;

  color: var(--text);

  font-size: 1.6rem;
  line-height: 1;
}


.category-products,
.variant-list {
  display: grid;
  gap: 9px;
}


.category-product {
  width: 100%;
  min-height: 68px;

  border: 1px solid var(--line);
  border-radius: 16px;

  background: white;

  padding: 13px 15px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;

  text-align: left;
}


.category-product:active {
  background: var(--primary-soft);
}


.category-product strong {
  display: block;

  color: var(--text);

  font-size: 1rem;
}


.category-product small {
  display: block;

  margin-top: 4px;

  color: var(--muted);

  font-size: .82rem;
}


.category-product-price {
  flex: 0 0 auto;

  color: var(--primary);

  font-size: 1.05rem;
  font-weight: 850;
}


@media (min-width: 700px) {

  .category-grid {
    grid-template-columns:
      repeat(2, 1fr);
  }

  .category-products {
    grid-template-columns:
      repeat(2, 1fr);
  }

}


/* PUNTO YA CR · identidad oficial */
.brand-logo-horizontal{display:block;width:min(360px,82%);height:auto;margin:0 auto 18px}
.brand-logo-horizontal.compact{width:min(240px,72%);margin-bottom:14px}
.brand-logo-vertical{display:block;width:min(190px,58%);height:auto;margin:0 auto 14px}
.brand-icon{width:42px;height:42px;border-radius:12px;object-fit:cover;flex:0 0 auto}
.brand-icon.small{width:34px;height:34px;border-radius:10px}
.brand-with-icon{display:flex;align-items:center;gap:11px;min-width:0}
.brand-with-icon>div{min-width:0}
.mpcr-powered{display:flex;align-items:center;justify-content:center;gap:7px;color:#536B79;font-size:10px}
.mpcr-powered img{width:62px;height:auto;display:block}

/* =========================
   ACCESO SIMPLE / TECLADO NUMÉRICO v7.17
========================= */
.pin-pad-card,
.employee-code-card {
  width: min(430px, 100%);
}

.pin-display,
.employee-code-display {
  min-height: 74px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 10px;
  padding: 14px 18px;
  border: 2px solid #152b38;
  border-radius: 18px;
  background: #fff;
  color: #152b38;
  font-size: 1.55rem;
  font-weight: 800;
  letter-spacing: 8px;
}

.employee-code-display span {
  letter-spacing: 1px;
  color: var(--green-dark, #065f5e);
}

.employee-code-display strong {
  min-width: 120px;
  text-align: left;
  letter-spacing: 8px;
}

.pin-keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 14px;
}

.pin-keypad button {
  min-height: 66px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: #f7f9f9;
  color: #152b38;
  font-size: 1.55rem;
  font-weight: 850;
  cursor: pointer;
}

.pin-keypad button:active {
  transform: scale(.98);
}

.pin-keypad .key-delete,
.pin-keypad .key-clear {
  color: #526773;
}

@media (max-width: 520px) {
  .lock-card {
    padding: 22px 16px;
  }

  .pin-keypad button {
    min-height: 62px;
    font-size: 1.4rem;
  }
}

.qr-box{display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #E1E7E5;border-radius:20px;padding:16px}
.qr-box img{width:190px;height:190px;display:block}
.catalog-public-group{margin-bottom:16px}.catalog-public-group h3{margin:0 0 8px;color:#162B38}

.public-catalog-head{text-align:center;background:#fff;border-radius:24px;padding:22px;margin-bottom:16px;border:1px solid #E1E7E5}.public-catalog-head img{max-width:230px;width:80%;height:auto}.public-catalog h1{margin:14px 0 6px}.public-catalog section{background:#fff;border:1px solid #E1E7E5;border-radius:20px;padding:16px;margin:14px 0}.public-catalog footer{text-align:center;color:#536B79;margin:24px 0 8px}

/* v7.22 · venta simple por tipo de negocio */

<div id="pycStartupSplash" role="status" aria-label="Abriendo PUNTO YA CR">
  <div class="pyc-splash-inner">
    <img class="pyc-splash-logo" src="./logo-horizontal.png" alt="PUNTO YA CR">

    <div class="pyc-splash-progress" aria-hidden="true"></div>

<div id="app"></div>
<script>
(() => {
  const started = performance.now();
  let finished = false;
  window.finishPycStartupSplash = function(){
    if (finished) return;
    finished = true;
    const splash = document.getElementById('pycStartupSplash');
    if (!splash) return;
    const minVisibleMs = 320;
    const wait = Math.max(0, minVisibleMs - (performance.now() - started));
    setTimeout(() => {
      splash.classList.add('is-hiding');
      setTimeout(() => splash.remove(), 240);
    }, wait);
  };
  setTimeout(() => window.finishPycStartupSplash?.(), 4500);
})();
</script>

<script>
/* ===== core.js ===== */
const DB_NAME = "mipuntocr";
const DB_VERSION = 6;
const STORES = ["products", "clients", "sales", "orders", "cashMoves", "cashSessions", "settings", "creditMoves", "tableAccounts", "expenses"];

let db;
let screen = "home";
let cart = [];
let locked = false;
let role = "owner"; // owner | admin | employee (se carga desde Supabase)
let activeClientId = "";
let quickCategory = "";
let authStep = "welcome";
let setupDraft = {};
let onboardingFormDirty = false;
let settingsFormDirty = false;
function blankSaleMeta() { return { clientId: "", orderType: "Mostrador", table: "", note: "", tableAccountId: "", expressFee: 0, documentType: "receipt", invoiceCustomer: null, invoiceLookupActivities: [], discountType: "", discountValue: 0, exchangeCredit: 0, exchangeSourceSaleId: "", exchangeSourceSaleNumber: "" }; }
let saleMeta = blankSaleMeta();

const AUTO_LOCK_MS = 5 * 60 * 1000;
let inactivityTimer = null;
let lastActivityAt = Date.now();

function autoLockEnabled() {
  if (!(state.settings.onboardingComplete && state.settings.sessionActive !== false) || locked) return false;
  if (role === "employee") return true;
  return !!(state.settings.pinEnabled && hasLocalPin());
}
function clearInactivityTimer() {
  if (inactivityTimer) clearTimeout(inactivityTimer);
  inactivityTimer = null;
}
function scheduleInactivityLock() {
  clearInactivityTimer();
  if (!autoLockEnabled()) return;
  const elapsed = Date.now() - lastActivityAt;
  const wait = Math.max(0, AUTO_LOCK_MS - elapsed);
  inactivityTimer = setTimeout(() => checkInactivityLock(), wait);
}
function registerUserActivity() {
  if (locked || state.settings.sessionActive === false) return;
  lastActivityAt = Date.now();
  scheduleInactivityLock();
}
function checkInactivityLock() {
  if (!autoLockEnabled()) { clearInactivityTimer(); return false; }
  if (Date.now() - lastActivityAt < AUTO_LOCK_MS) { scheduleInactivityLock(); return false; }
  window.closeModal?.();
  clearInactivityTimer();
  if (role === "employee" && typeof window.employeeSessionLock === "function") {
    window.employeeSessionLock();
    return true;
  }
  locked = true;
  screen = "home";
  render();
  return true;
}

function openDB() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = () => {
      for (const name of STORES) {
        if (!r.result.objectStoreNames.contains(name)) r.result.createObjectStore(name, { keyPath: "id" });
      }
    };
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
    r.onblocked = () => {
      const app = document.querySelector("#app");
      if (app && !app.innerHTML.trim()) {
        app.innerHTML = `<section class="onboarding"><div class="onboard-card">${brandHorizontal("brand-logo-horizontal compact")}<h2>Actualizando datos…</h2><p>Espera unos segundos. Si tienes PUNTO YA CR abierto en otra pestaña, ciérrala y vuelve aquí.</p></div></section>`;
      }
    };
  });
}
function store(name, mode = "readonly") { return db.transaction(name, mode).objectStore(name); }
function all(name) { return new Promise((res, rej) => { const r = store(name).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); }); }
function put(name, value) { return new Promise((res, rej) => { const r = store(name, "readwrite").put(value); r.onsuccess = () => res(value); r.onerror = () => rej(r.error); }); }

async function load() {
  for (const name of ["products", "clients", "sales", "orders", "cashMoves", "cashSessions", "creditMoves", "tableAccounts", "expenses"]) state[name] = await all(name);
  const saved = await all("settings");
  if (saved[0]) state.settings = { ...state.settings, ...saved[0] };
  await migrateLegacyPinIfNeeded();
  if (state.settings.businessType === "general") state.settings.businessType = "food";
  if (state.settings.businessType === "retail") state.settings.businessType = "products";
  if (typeof state.settings.sessionActive !== "boolean") state.settings.sessionActive = true;
  role = ["owner","admin","employee"].includes(state.settings.cloudRole) ? state.settings.cloudRole : "owner";

  // v7.9.2: corte limpio a cuentas reales de Supabase.
  // Las cuentas locales anteriores eran solo de prueba; al actualizar se exige
  // iniciar sesión o crear una cuenta real en la nube.
  if (!state.settings.cloudOnlyV792Migrated) {
    state.settings.cloudOnlyV792Migrated = true;
    if (!state.settings.cloudLinked) state.settings.sessionActive = false;
  }

  // Migración v7.6: el impuesto se suma al cobro por defecto.
  // Solo se aplica una vez; después el usuario puede cambiarlo en Configuración.
  if (!state.settings.taxV76Migrated) {
    if (state.settings.taxMode !== "exempt") state.settings.taxMode = "added";
    state.settings.taxV76Migrated = true;
  }

  // Migración v7.5: lo que existía antes queda asociado al tipo de negocio
  // que estaba activo. Desde aquí Restaurante, Artículos y Servicios ya no
  // comparten productos, inventario, ventas ni crédito.
  const legacyType = state.settings.businessType || "food";
  for (const p of state.products) {
    if (!p.businessType) { p.businessType = legacyType; await put("products", p); }
  }
  for (const sale of state.sales) {
    if (!sale.businessType) { sale.businessType = legacyType; await put("sales", sale); }
  }
  for (const move of state.creditMoves) {
    if (!move.businessType) { move.businessType = legacyType; await put("creditMoves", move); }
  }

  await put("settings", state.settings);
}

function cloudUuid() {
  if (crypto?.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    const v = c === "x" ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}
function cloudNorm(value) {
  return String(value || "").trim().toLocaleLowerCase("es");
}
function cloudCatalogConnected() {
  return !!(mpCloud && mpCloudUser && mpCloudBusiness?.id && state.settings.cloudLinked);
}
async function cloudCategoryRows() {
  if (!cloudCatalogConnected()) return [];
  const { data, error } = await mpCloud
    .from("categories")
    .select("id,business_id,name,business_type,sort_order,active")
    .eq("business_id", mpCloudBusiness.id)
    .eq("active", true)
    .order("sort_order", { ascending: true })
    .order("name", { ascending: true });
  if (error) throw error;
  return data || [];
}
async function cloudEnsureCategory(name, businessType, cachedRows = null) {
  const cleanName = String(name || "Otros").trim() || "Otros";
  const kind = ["food", "products", "services"].includes(businessType) ? businessType : "food";
  const rows = cachedRows || await cloudCategoryRows();
  const found = rows.find(row => row.business_type === kind && cloudNorm(row.name) === cloudNorm(cleanName));
  if (found) return found;

  const { data, error } = await mpCloud
    .from("categories")
    .insert({ business_id: mpCloudBusiness.id, name: cleanName, business_type: kind, active: true, sort_order: rows.length })
    .select("id,business_id,name,business_type,sort_order,active")
    .single();
  if (error) {
    // Puede ocurrir si dos dispositivos crean la misma categoría a la vez.
    const refreshed = await cloudCategoryRows();
    const retry = refreshed.find(row => row.business_type === kind && cloudNorm(row.name) === cloudNorm(cleanName));
    if (retry) return retry;
    throw error;
  }
  if (cachedRows) cachedRows.push(data);
  return data;
}
async function cloudUpsertProduct(localProduct, categoryRows = null) {

async function cloudPublishProduct(localProduct, categoryRows = null) {
  if (!cloudCatalogConnected() || !navigator.onLine || !localProduct) return null;
  const category = await cloudEnsureCategory(localProduct.category || "Otros", localProduct.businessType || type(), categoryRows);
  const hadRemoteId = !!localProduct.cloudId;
  const remoteId = localProduct.cloudId || (String(localProduct.id || "").match(/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i) ? localProduct.id : cloudUuid());
  const publicFields = {
    category_id: category.id, business_type: localProduct.businessType || type(), name: localProduct.name,
    description: localProduct.description || null, price: Number(localProduct.price || 0),
    sku: localProduct.sku || localProduct.barcode || null, variant: null,
    variants: Array.isArray(localProduct.variants) ? localProduct.variants : [], active: localProduct.active !== false,
    updated_at: new Date().toISOString()
  };
  let result;
  if (hadRemoteId) {
    result = await mpCloud.from("products").update(publicFields).eq("id", remoteId).eq("business_id", mpCloudBusiness.id).select("id").single();
  } else {
    result = await mpCloud.from("products").insert({ id:remoteId, business_id:mpCloudBusiness.id, ...publicFields, cost:null, stock:0 }).select("id").single();
  }
  if (result.error) throw result.error;
  localProduct.cloudId = result.data.id;
  localProduct.catalogPublishedAt = new Date().toISOString();
  if (!isProPlan()) { localProduct.catalogOnlyCloud = true; localProduct.cloudPending = true; }
  return result.data;
}

async function cloudLoadCatalogClientsRemote() {

async function cloudMergeRemoteCatalogClients(remote) {
  if (!remote) return;
  const categoryById = new Map(remote.categories.map(row => [row.id, row]));
  const localProductByCloud = new Map(state.products.filter(p => p.cloudId).map(p => [p.cloudId, p]));
  const localClientByCloud = new Map(state.clients.filter(c => c.cloudId).map(c => [c.cloudId, c]));

  const products = remote.products.map(row => {
    const existing = localProductByCloud.get(row.id);
    const category = categoryById.get(row.category_id)?.name || existing?.category || "Otros";
    return {
      ...(existing || {}),
      id: existing?.id || row.id,
      cloudId: row.id,
      cloudPending: false,
      businessType: row.business_type || existing?.businessType || state.settings.businessType || "food",
      name: row.name,
      description: row.description || "",
      price: Number(row.price || 0),
      cost: row.cost == null ? null : Number(row.cost),
      stock: Number(row.stock || 0),
      sku: row.sku || "",
      variants: Array.isArray(row.variants) ? row.variants : [],
      category,
      active: row.active !== false,
      cloudSyncedAt: row.updated_at || new Date().toISOString()
    };
  });
  const clients = remote.clients.map(row => {
    const existing = localClientByCloud.get(row.id);
    return {
      ...(existing || {}),
      id: existing?.id || row.id,
      cloudId: row.id,
      cloudPending: false,
      name: row.name,
      phone: row.phone || "",
      email: row.email || "",
      notes: row.notes || "",
      identificationType: row.identification_type || existing?.identificationType || "",
      identificationNumber: row.identification_number || existing?.identificationNumber || "",
      fiscalName: row.fiscal_name || existing?.fiscalName || row.name || "",
      economicActivityCode: row.economic_activity_code || existing?.economicActivityCode || "",
      economicActivityName: row.economic_activity_name || existing?.economicActivityName || "",
      fiscalEmail: row.fiscal_email || existing?.fiscalEmail || row.email || "",
      fiscalCheckedAt: row.fiscal_checked_at || existing?.fiscalCheckedAt || "",
      active: row.active !== false,
      balance: existing?.balance || 0,
      cloudSyncedAt: row.updated_at || new Date().toISOString()
    };
  });

  await clearStore("products");
  await clearStore("clients");
  for (const product of products) await put("products", product);
  for (const client of clients) await put("clients", client);
  state.products = products;
  state.clients = clients;
}
async function cloudSyncCatalogClients({ silent = false } = {}) {
  if (!isProPlan()) return false;
  if (!cloudCatalogConnected() || !navigator.onLine) return false;
  try {
    let remote = await cloudLoadCatalogClientsRemote();
    const categoryRows = remote.categories.slice();

    // Primera sincronización: lo que exista en el caché de ESTE negocio se sube
    // antes de descargar, para no perder pruebas hechas justo antes de v7.10.
    for (const product of state.products) {
      if (!product.cloudId && remote.products.length) {
        const catName = product.category || "Otros";
        const match = remote.products.find(row => {
          const cat = categoryRows.find(c => c.id === row.category_id);
          return row.business_type === (product.businessType || type()) && cloudNorm(row.name) === cloudNorm(product.name) && cloudNorm(cat?.name || "Otros") === cloudNorm(catName);
        });
        if (match) product.cloudId = match.id;
      }
      if (!product.cloudId || product.cloudPending) {
        await cloudUpsertProduct(product, categoryRows);
        await put("products", product);
      }
    }

    for (const client of state.clients) {
      if (!client.cloudId && remote.clients.length) {
        const match = remote.clients.find(row => cloudNorm(row.name) === cloudNorm(client.name) && cloudNorm(row.phone || "") === cloudNorm(client.phone || ""));
        if (match) client.cloudId = match.id;
      }
      if (!client.cloudId || client.cloudPending) {
        await cloudUpsertClient(client);
        await put("clients", client);
      }
    }

    remote = await cloudLoadCatalogClientsRemote();
    await cloudMergeRemoteCatalogClients(remote);
    state.settings.catalogCloudV710Ready = true;
    state.settings.catalogLastCloudSyncAt = new Date().toISOString();
    await put("settings", state.settings);
    if (!silent) toast("Catálogo y clientes sincronizados.");
    return true;
  } catch (error) {
    console.error("Supabase catálogo/clientes:", error);
    if (!silent) toast("No se pudo sincronizar con la nube. Los datos quedan pendientes.");
    return false;
  }
}

async function cloudPersistLocalIdentity(user, business, membership = null) {
  const meta = user?.user_metadata || {};
  const remoteSettings = business?.settings && typeof business.settings === "object" ? business.settings : {};
  const nextBusinessId = business?.id || "";
  const memberRole = membership?.role || (business?.owner_user_id === user?.id ? "owner" : "employee");
  const memberPermissions = membership?.permissions && typeof membership.permissions === "object" ? membership.permissions : {};

  // Cada cuenta/negocio usa su propio caché local.
  if (nextBusinessId && state.settings.localDataBusinessId !== nextBusinessId) {
    // Si venimos del modo sin cuenta, conservamos los datos locales para subirlos al nuevo negocio.
    if (!state.settings.guestMode) await resetLocalBusinessCache();
    state.settings.pinEnabled = false;
    state.settings.ownerPin = "";
    state.settings.ownerPinHash = "";
    state.settings.ownerPinSalt = "";
    state.settings.cashierPin = "";
  }

  state.settings = {
    ...state.settings,
    ...remoteSettings,
    ownerName: memberRole === "owner" ? (meta.full_name || state.settings.ownerName || "") : (state.settings.ownerName || ""),
    memberDisplayName: membership?.display_name || meta.full_name || user?.email || "",
    businessName: business?.name || meta.business_name || state.settings.businessName || "PUNTO YA CR",
    email: user?.email || state.settings.email || "",
    businessType: business?.business_type || meta.business_type || state.settings.businessType || "food",
    accountCreated: true,
    onboardingComplete: true,
    activated: !!user?.email_confirmed_at,
    activationUsed: !!user?.email_confirmed_at,
    pendingCloudConfirmation: false,
    cloudLinked: true,
    cloudUserId: user?.id || "",
    cloudBusinessId: business?.id || "",
    cloudRole: ["owner","admin","employee"].includes(memberRole) ? memberRole : "employee",
    cloudPermissions: memberPermissions,
    employeeId: membership?.employee_id || (memberRole === "employee" ? state.settings.employeeId || "" : ""),
    employeeCode: membership?.employee_code || (memberRole === "employee" ? state.settings.employeeCode || "" : ""),
    lastCloudBusinessId: nextBusinessId || state.settings.lastCloudBusinessId || "",
    guestMode: false,
    needsBusinessJoin: false,
    pendingInviteCode: "",
    localDataBusinessId: nextBusinessId,
    sessionActive: true
  };
  role = state.settings.cloudRole;

  if (!state.settings.businessId || String(state.settings.businessId).startsWith("00000000-")) {
    const short = String(business?.id || "").replace(/-/g, "").slice(0, 10).toUpperCase();
    state.settings.businessId = short ? `MPCR-${short}` : state.settings.businessId;
  }

  await put("settings", state.settings);
}

async function cloudEnsureBusiness(user) {
  if (!mpCloud || !user) return null;

  let membership = await cloudFindMembership(user.id);

  // Los empleados usan una sesión anónima vinculada por código. Nunca debe crear un negocio nuevo.
  if (user?.is_anonymous) {
    if (membership) {
      const business = await cloudFetchBusiness(membership.business_id);
      if (business) {
        mpCloudBusiness = business;
        mpCloudMembership = membership;
        await cloudPersistLocalIdentity(user, business, membership);
        return business;
      }
    }
    state.settings.sessionActive = false;
    state.settings.employeeId = "";
    state.settings.employeeCode = "";
    state.settings.memberDisplayName = "";
    await put("settings", state.settings);
    return null;
  }
  if (membership) {
    const business = await cloudFetchBusiness(membership.business_id);
    if (business) {
      mpCloudBusiness = business;
      mpCloudMembership = membership;
      await cloudPersistLocalIdentity(user, business, membership);
      return business;
    }
  }

  let business = await cloudFindOwnedBusiness(user.id);
  if (business) {
    membership = await cloudFindMembership(user.id);
    mpCloudBusiness = business;
    mpCloudMembership = membership || { business_id: business.id, user_id: user.id, role: "owner", permissions: {}, display_name: user?.user_metadata?.full_name || "", email: user?.email || "", active: true };
    await cloudPersistLocalIdentity(user, business, mpCloudMembership);
    return business;
  }

  if (user?.user_metadata?.account_kind === "member") {
    await cloudPersistNoBusiness(user);
    return null;
  }

  const oauthIntent = localStorage.getItem("mpcrOAuthIntent") || "";
  if (oauthIntent === "login") {
    state.settings.oauthNoBusiness = true;
    state.settings.onboardingComplete = false;
    state.settings.sessionActive = true;
    state.settings.cloudUserId = user.id;
    await put("settings", state.settings);
    localStorage.removeItem("mpcrOAuthIntent");
    return null;
  }

  business = await cloudCreateBusinessForUser(user);
  localStorage.removeItem("mpcrOAuthIntent");
  membership = await cloudFindMembership(user.id);
  mpCloudBusiness = business;
  mpCloudMembership = membership || { business_id: business.id, user_id: user.id, role: "owner", permissions: {}, display_name: user?.user_metadata?.full_name || "", email: user?.email || "", active: true };
  await cloudPersistLocalIdentity(user, business, mpCloudMembership);
  return business;
}

async function cloudHydrateSession(session) {
  mpCloudSession = session || null;
  mpCloudUser = session?.user || null;
  if (!mpCloudUser) return null;

  if (state.settings.pendingInviteCode) {
    try {
      await cloudAcceptBusinessInvite(state.settings.pendingInviteCode);
      state.settings.pendingInviteCode = "";
      await put("settings", state.settings);
    } catch (error) {
      console.warn("Invitación pendiente:", error?.message || error);
    }
  }

  const business = await cloudEnsureBusiness(mpCloudUser);
  if (!business) return { user: mpCloudUser, business: null };
  try { await cloudLoadPlanStatus(); } catch (error) { console.error("Plan Pro:", error); }
  if (isProPlan()) {
    try { await cloudSyncCatalogClients({ silent: true }); } catch (error) { console.error("Catálogo inicial:", error); }
    try { await cloudSyncOperations({ silent: true }); } catch (error) { console.error("Operación inicial:", error); }
  } else {
    try { await cloudPublishCatalog({ silent: true }); } catch (error) { console.error("Publicación de catálogo:", error); }
  }
  return { user: mpCloudUser, business };
}

async function initCloudAuth() {
  if (!initCloudClient()) return false;

  try {
    await setupNativeOAuthListener();
    const { data, error } = await mpCloud.auth.getSession();
    if (error) throw error;

    if (data?.session) {
      await cloudHydrateSession(data.session);
    } else if (navigator.onLine && state.settings.cloudLinked) {
      state.settings.sessionActive = false;
      await put("settings", state.settings);
    }

    if (!mpCloudAuthSubscription) {
      const { data: listener } = mpCloud.auth.onAuthStateChange(async (event, session) => {
        mpCloudSession = session || null;
        mpCloudUser = session?.user || null;

        if (event === "PASSWORD_RECOVERY" && session?.user) {
          mpPasswordRecovery = true;
          state.settings.email = session.user.email || state.settings.email || "";
          state.settings.sessionActive = true;
          try { await put("settings", state.settings); } catch (error) { console.warn("No se pudo guardar el estado de recuperación:", error); }
          if (db && !document.querySelector("#modalRoot")) render();
          return;
        }

        if (session?.user && ["SIGNED_IN", "TOKEN_REFRESHED", "USER_UPDATED", "INITIAL_SESSION"].includes(event)) {
          if (mpEmployeeLoginInProgress && session.user?.is_anonymous) return;
          try {
            await cloudHydrateSession(session);
            if (db && !document.querySelector("#modalRoot")) render();
          } catch (error) {
            console.error("Supabase hydrate:", error);
          }
        }

        if (event === "SIGNED_OUT") {
          mpCloudBusiness = null;
          mpPasswordRecovery = false;
        }
      });
      mpCloudAuthSubscription = listener?.subscription || true;
    }

    return true;
  } catch (error) {
    console.error("Supabase init:", error);
    return false;
  }
}

function cloudInviteCode() {

  crypto.getRandomValues(bytes);
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  for (const b of bytes) out += chars[b % chars.length];
  return `MP-${out.slice(0,3)}-${out.slice(3)}`;
}

}

function cloudSafeJson(value) {

function cloudQueueAuditEvent(entity, action, entityType, oldData = null, newData = null) {

    oldData: cloudSafeJson(oldData),

async function cloudAssignOfficialReceiptNumber(sale) {
  if (!cloudOperationsConnected() || !navigator.onLine || !sale) return null;
  if (Number(sale.cloudReceiptNumber || 0) > 0) return Number(sale.cloudReceiptNumber);
  const { data, error } = await mpCloud.rpc('next_receipt_number', { p_business_id: mpCloudBusiness.id });
  if (error) throw error;
  const number = Number(data || 0);
  if (!number) throw new Error('No se pudo obtener el número de comprobante.');
  sale.cloudReceiptNumber = number;
  sale.number = number;
  if (Array.isArray(sale.cloudAuditQueue)) {
    for (const event of sale.cloudAuditQueue) {
      if (event.entityType === 'sale' && event.action === 'create' && event.newData) event.newData.number = number;
    }
  }
  await put('sales', sale);
  return number;
}

async function cloudEnsureRestaurantTable(tableNumber) {
  if (!cloudOperationsConnected() || !tableNumber) return null;

  const { data: found, error: findError } = await mpCloud
    .from("restaurant_tables")
    .select("id,table_number")
    .eq("business_id", mpCloudBusiness.id)
    .eq("table_number", number)
    .limit(1);

  const { data, error } = await mpCloud
    .from("restaurant_tables")
    .insert({ business_id: mpCloudBusiness.id, table_number: number, name: `Mesa ${number}`, active: true })

async function cloudSaveOrder(order) {
  if (!cloudOperationsConnected() || !navigator.onLine || !order) return null;

  const kind = orderKind(order);
  let table = null;
  let account = null;
  if (kind === "table") {
    table = await cloudEnsureRestaurantTable(order.tableNumber);
    account = order.tableAccountId ? state.tableAccounts.find(x => x.id === order.tableAccountId) : null;
    if (account) { await cloudSaveTableAccount(account, { skipPaidSale: true }); await put("tableAccounts", account); }
  } else {
    // La tabla virtual mantiene compatibilidad con esquemas de Supabase donde orders.table_id es obligatorio.
    // Nunca se muestra como mesa real porque el tipo/origen se guarda dentro de notes.
    table = await cloudEnsureRestaurantTable(CLOUD_WHATSAPP_TABLE_NUMBER);
  }

  const id = cloudEnsureId(order);
  const payload = {
    id,
    business_id: mpCloudBusiness.id,
    table_id: table?.id || null,
    table_account_id: kind === "table" ? cloudTableAccountRemoteId(order.tableAccountId) : null,
    local_number: Number(order.number || 0) || null,
    status: cloudOrderStatusToRemote(order.status),
    status_history: Array.isArray(order.statusHistory) ? order.statusHistory : [],
    notes: cloudOrderNotesPayload(order),
    preparing_at: order.preparingAt || null,
    ready_at: order.readyAt || null,
    delivered_at: order.deliveredAt || null,
    created_by: mpCloudUser.id,
    created_at: order.createdAt || new Date().toISOString(),
    updated_at: order.updatedAt || order.createdAt || new Date().toISOString()
  };
  const { error } = await mpCloud.from("orders").upsert(payload, { onConflict: "id" });
  if (error) throw error;

  for (const item of order.items || []) {
    if (!item.cloudItemId) item.cloudItemId = cloudUuid();
    const { error: itemError } = await mpCloud.from("order_items").upsert({
      id: item.cloudItemId,
      business_id: mpCloudBusiness.id,
      order_id: id,
      product_id: cloudProductRemoteId(item.id),
      product_name: item.name || "Producto",
      quantity: Number(item.qty || 0),
      unit_price: Number(item.price || 0),
      notes: item.variant || null,
      created_at: order.createdAt || new Date().toISOString()
    }, { onConflict: "id" });
    if (itemError) throw itemError;
  }

  order.cloudPending = false;
  order.cloudSyncedAt = new Date().toISOString();
  await put("orders", order);
  if (account) {
    if (!account.orderIds) account.orderIds = [];
    if (!account.orderIds.includes(order.id)) account.orderIds.push(order.id);

  }
  return id;

  const oldCredits = state.creditMoves.slice();
  const credits = remote.creditMoves.filter(row => row.movement_type === "payment").map(row => {
    const existing = cloudLocalByCloud(oldCredits, row.id);
    const payment = paymentMap.get(row.payment_id);
    return {
      ...(existing || {}), id: existing?.id || row.id, cloudId: row.id, cloudPaymentId: row.payment_id || "", cloudPending: false,
      type: "payment", clientId: clientLocalId(row.client_id), amount: Number(row.amount || 0), method: cloudMethodToLocal(payment?.method),
      note: row.notes || "", createdAt: row.created_at, shiftId: shiftLocalId(payment?.cash_shift_id), businessType: state.settings.businessType || "food",
      cloudSyncedAt: row.created_at
    };
  });

  const oldCashMoves = state.cashMoves.slice();
  const cashMoves = remote.cashMoves.map(row => {
    const existing = cloudLocalByCloud(oldCashMoves, row.id);
    return {
      ...(existing || {}), id: existing?.id || row.id, cloudId: row.id, cloudPending: false,
      type: row.movement_type === "credit_payment" ? "creditPayment" : row.movement_type,
      clientId: clientLocalId(row.client_id), amount: Number(row.amount || 0), method: row.payment_method ? cloudMethodToLocal(row.payment_method) : "Efectivo",
      note: row.notes || "", createdAt: row.created_at, shiftId: shiftLocalId(row.cash_shift_id), cloudSyncedAt: row.created_at
    };
  });

  const tableNumberMap = new Map(remote.tables.map(row => [row.id, Number(row.table_number || 0)]));
  const itemsByOrder = new Map();
  for (const item of remote.orderItems) {
    if (!itemsByOrder.has(item.order_id)) itemsByOrder.set(item.order_id, []);
    itemsByOrder.get(item.order_id).push(item);
  }
  const oldOrders = state.orders.slice();
  const orders = remote.orders.map(row => {
    const existing = cloudLocalByCloud(oldOrders, row.id);
    const parsedOrderNotes = cloudParseOrderNotes(row.notes);
    const remoteOrderMeta = parsedOrderNotes.meta || {};
    const remoteTableNumber = tableNumberMap.get(row.table_id) || existing?.tableNumber || 0;
    const remoteKind = remoteOrderMeta.kind || (Number(remoteTableNumber) === CLOUD_WHATSAPP_TABLE_NUMBER ? "whatsapp" : "table");
    return {
      ...(existing || {}), id: existing?.id || row.id, cloudId: row.id, cloudPending: false,
      number: Number(row.local_number || 0), kind: remoteKind, tableNumber: remoteKind === "table" ? remoteTableNumber : 0,
      tableAccountId: remoteKind === "table" ? accountLocalId(row.table_account_id) : "",
      customer: remoteOrderMeta.customer || existing?.customer || "",
      phone: remoteOrderMeta.phone || existing?.phone || "",
      address: remoteOrderMeta.address || existing?.address || "",
      fulfillment: remoteOrderMeta.fulfillment || existing?.fulfillment || (remoteKind === "table" ? "Mesa" : "Recoger"),
      orderType: remoteOrderMeta.orderType || existing?.orderType || (remoteKind === "whatsapp" ? "WhatsApp" : "Mesa"),
      expressFee: Number(remoteOrderMeta.expressFee || existing?.expressFee || 0),
      paymentStatus: remoteOrderMeta.paymentStatus || existing?.paymentStatus || "Pendiente",
      paidAt: remoteOrderMeta.paidAt || existing?.paidAt || "",
      linkedSaleCloudId: remoteOrderMeta.linkedSaleCloudId || existing?.linkedSaleCloudId || "",
      linkedSaleNumber: remoteOrderMeta.linkedSaleNumber || existing?.linkedSaleNumber || "",
      items: (itemsByOrder.get(row.id) || []).map(item => ({
        id: productLocalId(item.product_id), cloudItemId: item.id, name: item.product_name, variant: item.notes || "",
        price: Number(item.unit_price || 0), qty: Number(item.quantity || 0)
      })),
      notes: parsedOrderNotes.note || "", status: cloudOrderStatusToLocal(row.status), createdAt: row.created_at, updatedAt: row.updated_at || row.created_at,
      statusHistory: Array.isArray(row.status_history) ? row.status_history : [], preparingAt: row.preparing_at || "", readyAt: row.ready_at || "", deliveredAt: row.delivered_at || "",
      cloudSyncedAt: row.updated_at || row.created_at
    };
  });
  const localOnlyWhatsappOrders = oldOrders.filter(order => order.kind === "whatsapp" && !order.cloudId);
  for (const order of localOnlyWhatsappOrders) {
    if (!orders.some(current => current.id === order.id)) orders.push(order);
  }
  const orderLocalId = remoteId => cloudLocalByCloud(orders, remoteId)?.id || "";
  for (const order of orders) {
    if (order.linkedSaleCloudId) order.linkedSaleId = saleLocalId(order.linkedSaleCloudId);
    if (order.linkedSaleId) order.paymentStatus = "Pagado";
  }
  for (const sale of sales) {
    if (sale.sourceOrderCloudId) sale.sourceOrderId = orderLocalId(sale.sourceOrderCloudId);
  }
  for (const acc of accounts) acc.orderIds = (acc.remoteOrderIds || []).map(orderLocalId).filter(Boolean);

  for (const [storeName, values] of [["cashSessions", shifts], ["tableAccounts", accounts], ["sales", sales], ["creditMoves", credits], ["cashMoves", cashMoves], ["orders", orders]]) {
    await clearStore(storeName);
    for (const value of values) await put(storeName, value);
    state[storeName] = values;
  }
}

async function cloudSyncOperations({ silent = false } = {}) {
  if (!isProPlan()) return false;
  if (!cloudOperationsConnected() || !navigator.onLine) return false;
  try {
    // Primero subimos cualquier operación local pendiente para no perder trabajo offline.
    for (const shift of state.cashSessions) {
      if (!shift.cloudId || shift.cloudPending) { await cloudSaveCashSession(shift); await put("cashSessions", shift); }
    }
    for (const account of state.tableAccounts) {
      if (!account.cloudId || account.cloudPending) { await cloudSaveTableAccount(account, { skipPaidSale: true }); await put("tableAccounts", account); }
    }
    // Pedidos primero: así una venta originada en un pedido puede conservar el vínculo en la nube.
    for (const order of state.orders) {
      if (!order.cloudId || order.cloudPending) await cloudSaveOrder(order);
    }
    for (const sale of state.sales) {
      if (!sale.cloudId || sale.cloudPending) await cloudSaveSale(sale);
    }
    for (const move of state.creditMoves) {
      if (move.type === "payment" && (!move.cloudId || move.cloudPending)) { await cloudSaveCreditMove(move); await put("creditMoves", move); }
    }
    for (const move of state.cashMoves) {
      if (!move.cloudId || move.cloudPending) { await cloudSaveCashMove(move); await put("cashMoves", move); }
    }
    // Segunda pasada de pedidos: después de subir ventas ya podemos guardar el vínculo pedido ↔ comprobante.
    for (const order of state.orders) {
      if (order.linkedSaleId || order.cloudPending) await cloudSaveOrder(order);
    }
    // Segunda pasada de cuentas para enlazar venta pagada / pedidos remotos.
    for (const account of state.tableAccounts) { await cloudSaveTableAccount(account); await put("tableAccounts", account); }

    const remote = await cloudLoadOperationsRemote();
    await cloudMergeOperationsRemote(remote);
    state.settings.operationsCloudV711Ready = true;
    state.settings.operationsLastCloudSyncAt = new Date().toISOString();
    await put("settings", state.settings);
    if (!silent) toast("Operación sincronizada con la nube.");
    return true;
  } catch (error) {
    console.error("Supabase operación:", error);
    if (!silent) toast("No se pudo sincronizar toda la operación. Los cambios quedan pendientes.");
    return false;
  }
}

function totals(subtotal) {
  const rate = Number(state.settings.taxRate || 0), mode = state.settings.taxMode;
  if (mode === "added") return { subtotal, tax: subtotal * rate / 100, total: subtotal * (1 + rate / 100) };
  if (mode === "included" && rate > 0) return { subtotal, tax: subtotal - subtotal / (1 + rate / 100), total: subtotal };
  return { subtotal, tax: 0, total: subtotal };
}
function itemGross(item) { return Math.max(0, Number(item?.price||0) * Number(item?.qty||0)); }
function itemDiscountAmount(item) {
  const gross=itemGross(item), value=Math.max(0,Number(item?.discountValue||0));
  if (!gross || !item?.discountType || !value) return 0;
  if (item.discountType === "percent") return Math.min(gross, gross * Math.min(100,value) / 100);
  return Math.min(gross, value);
}
function saleBreakdownFor(items=cart, meta=saleMeta) {
  const gross=(items||[]).reduce((sum,item)=>sum+itemGross(item),0);
  const itemDiscount=(items||[]).reduce((sum,item)=>sum+itemDiscountAmount(item),0);
  const afterItems=Math.max(0,gross-itemDiscount);
  const value=Math.max(0,Number(meta?.discountValue||0));
  let saleDiscount=0;
  if (meta?.discountType === "percent") saleDiscount=Math.min(afterItems,afterItems*Math.min(100,value)/100);
  else if (meta?.discountType === "amount") saleDiscount=Math.min(afterItems,value);
  const merchandise=Math.max(0,afterItems-saleDiscount);
  const express=!isServices() && meta?.orderType === "Express" ? Math.max(0,Number(meta?.expressFee||0)) : 0;
  return {gross,itemDiscount,afterItems,saleDiscount,discountTotal:itemDiscount+saleDiscount,merchandise,express,subtotal:merchandise+express};
}
function saleSubtotal() { return saleBreakdownFor().subtotal; }
function fiscalLineAmounts(item, netAmount, pricesIncludeTax = state.settings.fiscalPricesIncludeTax !== false) {
  const net=Math.max(0,Number(netAmount||0));
  const rate=Math.max(0,Number(item?.fiscalTaxRate ?? state.settings.fiscalDefaultTaxRate ?? 0));
  if (!rate) return { rate:0, base:net, tax:0, total:net };
  if (pricesIncludeTax) {
    const base=net/(1+rate/100);
    return { rate, base, tax:Math.max(0,net-base), total:net };
  }
  const tax=net*rate/100;
  return { rate, base:net, tax, total:net+tax };
}
function fiscalSaleTaxTotals(items=cart, meta=saleMeta) {
  const b=saleBreakdownFor(items,meta);
  const afterItems=Math.max(0,Number(b.afterItems||0));
  const included=state.settings.fiscalPricesIncludeTax !== false;
  let baseTotal=0,tax=0,finalTotal=0;
  for (const item of items||[]) {
    const gross=itemGross(item), itemDisc=itemDiscountAmount(item), afterItem=Math.max(0,gross-itemDisc);
    const saleDiscShare=afterItems>0?Number(b.saleDiscount||0)*(afterItem/afterItems):0;
    const net=Math.max(0,afterItem-saleDiscShare);
    const line=fiscalLineAmounts(item,net,included);
    baseTotal+=line.base; tax+=line.tax; finalTotal+=line.total;
  }
  // Express se conserva sin impuesto hasta que el negocio configure su tratamiento fiscal específico.
  const express=Math.max(0,Number(b.express||0));
  baseTotal+=express; finalTotal+=express;
  return {...b, subtotal:baseTotal, tax, total:finalTotal, fiscalPricesIncludeTax:included};
}
function currentSaleTotals(items=cart, meta=saleMeta) {
  const fiscal=!!(state.settings.fiscalUsesEInvoice && isProPlan());
  const b=fiscal?fiscalSaleTaxTotals(items,meta):saleBreakdownFor(items,meta);
  const taxTotals=fiscal?{subtotal:Number(b.subtotal||0),tax:Number(b.tax||0),total:Number(b.total||0)}:totals(b.subtotal);
  const exchangeCredit=Math.max(0,Number(meta?.exchangeCredit||0));
  const exchangeCreditApplied=Math.min(exchangeCredit,Math.max(0,Number(taxTotals.total||0)));
  return {...b,...taxTotals,beforeExchangeTotal:Number(taxTotals.total||0),exchangeCredit,exchangeCreditApplied,total:Math.max(0,Number(taxTotals.total||0)-exchangeCreditApplied)};
}
function saleItemNetTotal(item) { return Math.max(0, Number(item?.netTotal ?? (itemGross(item)-itemDiscountAmount(item)))); }

  if(!("BarcodeDetector" in window)){
    modal(`<h3>Escanear código</h3><p class="muted">La cámara para códigos no está disponible en este navegador. Puedes usar un lector USB o escribir el código.</p>${manual}`);
    focusBarcodeInput();
    return;
  }
  modal(`<h3>Escanear código</h3><p class="muted">Apunta la cámara al código de barras o usa un lector USB.</p><video id="scannerVideo" class="scanner-video" autoplay playsinline></video>${manual}`);
  focusBarcodeInput();
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
    window._scannerStream=stream;
    const video=$("#scannerVideo");
    if(!video)return;
    video.srcObject=stream;
    const detector=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39","qr_code"]});
    const tick=async()=>{if(!window._scannerStream||!document.body.contains(video))return;try{const codes=await detector.detect(video);if(codes[0]?.rawValue){stopBarcodeScanner();findBarcodeProduct(codes[0].rawValue);return;}}catch(e){}requestAnimationFrame(tick);};
    tick();
  }catch(e){toast("No se pudo abrir la cámara. Puedes escribir el código o usar un lector USB.");focusBarcodeInput();}
};

const FISCAL_ID_LABELS = { "01":"Cédula física", "02":"Cédula jurídica", "03":"DIMEX", "04":"NITE" };
function normalizeFiscalId(value) { return String(value || "").replace(/\D+/g, ""); }
function fiscalIdLabel(code) { return FISCAL_ID_LABELS[String(code || "")] || "Identificación"; }
function clientByFiscalId(value) {

function clientFiscalActivities(client) {
  if (!client) return [];
  const rows = Array.isArray(client.fiscalActivities) ? client.fiscalActivities : [];

  if (client.economicActivityCode || client.economicActivityName) return [{ code: client.economicActivityCode || "", description: client.economicActivityName || "" }];

}
function normalizeTaxpayerPayload(raw, identification = "") {
  const src = raw?.result || raw?.data || raw || {};
  const activitiesRaw = Array.isArray(src.activities) ? src.activities : (Array.isArray(src.actividades) ? src.actividades : []);
  const activities = activitiesRaw.map(a => ({
    code: String(a?.code ?? a?.codigo ?? a?.codigoActividad ?? "").trim(),
    description: String(a?.description ?? a?.descripcion ?? a?.nombre ?? "").trim()
  })).filter(a => a.code || a.description);
  return {
    identification: normalizeFiscalId(src.identification || src.identificacion || identification),
    name: String(src.name || src.nombre || "").trim(),
    idType: String(src.idType || src.tipoIdentificacion || "").trim(),
    regime: src.regime || src.regimen || null,
    situation: src.situation || src.situacion || null,
    activities,
    source: src.source || raw?.source || "hacienda",
    fetchedAt: src.fetched_at || src.fetchedAt || raw?.fetched_at || new Date().toISOString()
  };
}
function invoiceActivityOptions(activities, selectedCode = "") {
  const rows = Array.isArray(activities) ? activities : [];
  if (!rows.length) return `<option value="">Sin actividad disponible / no aplica</option>`;
  return `<option value="">Selecciona la actividad</option>${rows.map(a => `<option value="${esc(a.code)}" ${String(a.code)===String(selectedCode)?"selected":""}>${esc(a.code ? `${a.code} · ${a.description}` : a.description)}</option>`).join("")}`;

function applyInvoiceCustomerData(data, client = null) {

async function lookupInvoiceTaxpayer() {
  const input = $("#invoiceCustomerId");
  const id = normalizeFiscalId(input?.value || "");
  if (input) input.value = id;
  if (id.length < 9 || id.length > 12) return setInvoiceLookupStatus("Escribe una identificación de 9 a 12 dígitos.", "error");
  const local = clientByFiscalId(id);
  if (local && (local.fiscalName || local.identificationType || clientFiscalActivities(local).length)) {
    applyInvoiceCustomerData({ identification:id, name:local.fiscalName || local.name, idType:local.identificationType, activities:clientFiscalActivities(local), source:"saved" }, local);
    return;
  }
  if (!navigator.onLine) {
    if (local) { applyInvoiceCustomerData({ identification:id, name:local.name, idType:local.identificationType, activities:clientFiscalActivities(local), source:"saved" }, local); return; }
    setInvoiceLookupStatus("Sin Internet. Puedes ingresar los datos manualmente.", "error");
    return;
  }
  setInvoiceLookupStatus("Consultando Hacienda…");
  let payload = null;
  try {
    if (mpCloud?.functions && state.settings.cloudBusinessId) {
      const { data, error } = await mpCloud.functions.invoke("hacienda-taxpayer-lookup", { body: { business_id: state.settings.cloudBusinessId, identificacion: id } });
      if (error) throw error;
      payload = data;
    } else {
      throw new Error("Sesión de nube no disponible");
    }
  } catch (edgeError) {
    console.warn("Consulta Hacienda por Edge Function no disponible; intentando API pública.", edgeError);
    try {
      const response = await fetch(`https://api.hacienda.go.cr/fe/ae?identificacion=${encodeURIComponent(id)}`, { cache:"no-store" });
      if (response.status === 404) throw new Error("Identificación no encontrada");
      if (response.status === 429) throw new Error("Hacienda limitó temporalmente las consultas");
      if (!response.ok) throw new Error(`Hacienda respondió ${response.status}`);
      payload = await response.json();
    } catch (directError) {
      console.error(directError);
      if (local) { applyInvoiceCustomerData({ identification:id, name:local.name, idType:local.identificationType, activities:clientFiscalActivities(local), source:"saved" }, local); return; }
      setInvoiceLookupStatus("No se pudo consultar Hacienda. Ingresa los datos manualmente.", "error");
      return;
    }
  }
  const data = normalizeTaxpayerPayload(payload, id);
  if (!data.name) { setInvoiceLookupStatus("Hacienda no devolvió datos para esta identificación. Puedes ingresarlos manualmente.", "error"); return; }
  applyInvoiceCustomerData(data, local);
}

async function persistInvoiceCustomerClient(invoice) {

  client.phone = invoice.phone || client.phone || "";
  client.email = invoice.email || client.email || "";

  client.fiscalName = invoice.name || client.fiscalName || client.name;
  client.economicActivityCode = invoice.activityCode || "";

  client.fiscalEmail = invoice.email || client.fiscalEmail || "";
  client.fiscalCheckedAt = invoice.lookedUpAt || new Date().toISOString();
  client.cloudPending = true;
  await put("clients", client);
  cloudQueueAuditEvent(client, created ? "create" : "update", "client", null, { name:client.name, identificationNumber:client.identificationNumber });
  try { await cloudSaveClientFromApp(client); await put("clients", client); } catch (error) { console.error(error); client.cloudPending = true; await put("clients", client); }
  return client;
}

async function saveSale(method, reference = "", clientId = "", received = null) {

    fiscalPricesIncludeTax: state.settings.fiscalPricesIncludeTax!==false,

  await put("sales", sale);

  }

  resetSaleMeta();
  closeModal();
  showReceipt(sale);
}

function loadExternalScript(src, id) {
  return new Promise((resolve, reject) => {
    const old = document.getElementById(id);
    if (old) {
      if (old.dataset.loaded === "true") return resolve();
      old.addEventListener("load", resolve, { once: true }); old.addEventListener("error", reject, { once: true }); return;
    }
    const script = document.createElement("script"); script.id = id; script.src = src; script.async = true;
    script.onload = () => { script.dataset.loaded = "true"; resolve(); }; script.onerror = reject; document.head.appendChild(script);
  });
}

async function createReceiptPdf(sale) {
  await ensurePdfLibraries();
  const receipt = buildReceiptElement(sale);

    await waitForElementImages(receipt);
    const canvas = await window.html2canvas(receipt, { scale: 3, backgroundColor: "#ffffff", useCORS: true, logging: false });
    const image = canvas.toDataURL("image/png");
    const pdfWidth = 80;
    const pdfHeight = Math.max(90, pdfWidth * canvas.height / canvas.width);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: [pdfWidth, pdfHeight] });
    pdf.addImage(image, "PNG", 0, 0, pdfWidth, pdfHeight, undefined, "FAST");
    return pdf.output("blob");
  } finally { receipt.remove(); }
}
async function createElectronicInvoicePdf(sale) {
  await ensurePdfLibraries();
  const el = buildElectronicInvoiceElement(sale, { width:794 });
  try {
    await waitForElementImages(el);
    const canvas = await window.html2canvas(el, { scale:2, backgroundColor:"#ffffff", useCORS:true, logging:false });
    const img = canvas.toDataURL("image/png");
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation:"portrait", unit:"mm", format:"a4" });
    const pageW=190, pageH=277, imgH=pageW*canvas.height/canvas.width;
    let offset=0, page=0;

    return pdf.output("blob");
  } finally { el.remove(); }
}

function saleOriginLabel(sale) {
  if (sale.sourceOrderNumber || sale.sourceOrderId) {
    const order = sale.sourceOrderId ? state.orders.find(o => o.id === sale.sourceOrderId) : null;
    const number = Number(sale.sourceOrderNumber || order?.number || 0);
    const kind = sale.sourceOrderKind || (order ? orderKind(order) : "whatsapp");
    if (kind === "whatsapp") {
      const delivery = (sale.orderType === "Express" || order?.fulfillment === "Express") ? "Express" : "Para llevar";
      return `Pedido WhatsApp${number ? ` #W-${String(number).padStart(3,"0")}` : ""} · ${delivery}`;
    }
  }
  if (sale.orderType === "Mesa" || sale.table) return `Mesa ${sale.table || "-"}`;
  return sale.orderType || "Mostrador";
}

function groupedSalesHtml(items) {
  if (!items.length) return `<div class="empty">No hay ventas en este período.</div>`;
  const groups = {};
  for (const sale of items) (groups[localDayKey(sale.createdAt)] ||= []).push(sale);
  return Object.keys(groups).sort().reverse().map(key => {
    const daySales = groups[key].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
    const activeTotal = daySales.filter(s=>!s.voided).reduce((a,b)=>a+saleNetTotal(b),0);
    const voidedTotal = daySales.filter(s=>s.voided).reduce((a,b)=>a+Number(b.total||0),0);
    const voidedCount = daySales.filter(s=>s.voided).length;
    return `<section class="sales-day"><div class="sales-day-head"><div><h3>${esc(salesGroupLabel(key))}</h3><span>${daySales.length} ${daySales.length===1?"venta":"ventas"}${voidedCount ? ` · ${voidedCount} anulada${voidedCount===1?"":"s"}` : ""}</span></div><div style="text-align:right"><strong>${money(activeTotal)}</strong>${voidedTotal ? `<div class="muted" style="font-size:12px;margin-top:3px">Anulado ${money(voidedTotal)}</div>` : ""}</div></div><div class="sales-day-list">${daySales.map(s => `<button class="row-card" style="width:100%;text-align:left;${s.voided?"opacity:.72;border-style:dashed":""}" onclick="openSale('${s.id}')"><div class="row-head"><div><strong>Comprobante #${s.number}${s.electronicInvoiceRequested||s.documentType==="electronic_invoice"?" · FACTURA SOLICITADA":""}${s.voided?" · ANULADO":""}</strong><div class="muted">${new Date(s.createdAt).toLocaleTimeString("es-CR",{hour:"2-digit",minute:"2-digit"})}</div></div><strong>${money(s.voided?Number(s.total||0):saleNetTotal(s))}</strong></div><div class="muted" style="margin-top:7px">${esc(s.method)}${saleRefundTotal(s)>0?` · Devuelto ${money(saleRefundTotal(s))}`:""}${saleReturnEntries(s).some(r=>r.kind==="exchange")?" · Cambio registrado":""} · ${esc(saleOriginLabel(s))}${s.clientId ? ` · ${esc(clientName(s.clientId))}` : (s.customerName ? ` · ${esc(s.customerName)}` : "")}</div></button>`).join("")}</div></section>`;
  }).join("");
}
let salesDateMode = "all";
let salesStatusMode = "active";
function filteredSalesForView() {
  const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate()), yesterday = new Date(today), week = new Date(today);
  yesterday.setDate(yesterday.getDate()-1); const d=week.getDay()||7; week.setDate(week.getDate()-d+1);
  let list=[...visibleCurrentSales()];
  if(salesDateMode==="today") list=list.filter(s=>new Date(s.createdAt)>=today);
  if(salesDateMode==="yesterday") list=list.filter(s=>{const x=new Date(s.createdAt);return x>=yesterday&&x<today;});
  if(salesDateMode==="week") list=list.filter(s=>new Date(s.createdAt)>=week);
  if(salesStatusMode==="active") list=list.filter(s=>!s.voided);
  if(salesStatusMode==="voided") list=list.filter(s=>s.voided);
  list.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  return list;
}
function refreshSalesList() {

function buildShiftSnapshot(shift) {
  const r=shiftReportData(shift);
  return {
    count:r.count,gross:r.gross,tax:r.tax,cash:r.cash,sinpe:r.sinpe,card:r.card,credit:r.credit,
    creditCash:r.creditCash,creditPayments:r.creditPayments,ins:r.ins,outs:r.outs,expected:r.expected,
    products:r.products,orderCounts:r.orderCounts,saleIds:r.sales.map(s=>s.id),
    voidedSaleIds:state.sales.filter(s=>s.shiftId===shift.id&&s.voided).map(s=>s.id)
  };
}
async function refreshShiftAfterVoid(sale) {
  if(!sale.shiftId) return;
  const shift=state.cashSessions.find(x=>x.id===sale.shiftId);
  if(!shift) return;
  const snap=buildShiftSnapshot(shift);
  shift.report=snap;
  if(shift.status==="closed") {
    shift.expected=snap.expected;
    shift.difference=Number(shift.counted||0)-Number(shift.expected||0);
  }
  await put("cashSessions",shift);
}
async function restoreSaleStock(sale) {
  if(sale.stockRestoredAt || sale.businessType === "services") return;
  for(const [index,item] of (sale.items||[]).entries()) {
    const p=state.products.find(x=>x.id===item.id && x.businessType===sale.businessType);
    if(!p) continue;
    const qtyToRestore=Math.max(0,Number(item.qty||0)-returnedQtyForSaleItem(sale,index));
    if(!qtyToRestore) continue;
    const beforeStock=Number(p.stock||0);
    const afterStock=beforeStock+qtyToRestore;
    p.stock=afterStock;
    cloudQueueInventoryEvent(sale,{productLocalId:p.id,movementType:"void",quantity:qtyToRestore,previousStock:beforeStock,newStock:afterStock,linkedSale:true,notes:`Anulación comprobante #${sale.number}`,createdAt:new Date().toISOString()});
    try { await cloudSaveProductFromApp(p); } catch (error) { console.error(error); p.cloudPending = true; }
    await put("products",p);
  }
  sale.stockRestoredAt=new Date().toISOString();
}
window.askVoidSale = id => {
  if (!requirePermission("void_sales", "No tienes permiso para anular ventas.")) return;
  const sale=state.sales.find(x=>x.id===id);
  if(!sale || sale.voided) return;
  if(saleReturnEntries(sale).length) return toast("Esta venta ya tiene un cambio o devolución. Conserva el historial en lugar de anularla.");
  modal(`<h3>Anular comprobante #${sale.number}</h3><p>La venta dejará de contar en los totales activos, Caja, reportes y Crédito.</p><p class="muted">El comprobante quedará guardado como ANULADO para mantener el historial.</p><div class="field"><label>Motivo opcional</label><input id="voidReason" placeholder="Ej. venta ingresada por error"></div><div class="toolbar"><button class="btn danger" onclick="voidSale('${id}')">Anular comprobante</button><button class="btn" onclick="closeModal()">Cancelar</button></div>`);
};
window.voidSale = async id => {
  if (!requirePermission("void_sales", "No tienes permiso para anular ventas.")) return;
  const sale=state.sales.find(x=>x.id===id);
  if(!sale || sale.voided) return;
  if(saleReturnEntries(sale).length) return toast("Esta venta ya tiene un cambio o devolución y no puede anularse.");
  const reason=$("#voidReason")?.value?.trim()||"";
  const beforeVoid={status:"active",hiddenFromSales:!!sale.hiddenFromSales,total:Number(sale.total||0)};
  sale.voided=true;
  sale.voidedAt=new Date().toISOString();
  sale.voidReason=reason;
  cloudQueueAuditEvent(sale,"void","sale",beforeVoid,{status:"voided",reason,total:Number(sale.total||0)});
  await restoreSaleStock(sale);
  await put("sales",sale);
  if(sale.businessType==="food" && sale.tableAccountId) {
    const acc=state.tableAccounts.find(a=>a.id===sale.tableAccountId);
    if(acc && acc.status==="paid" && acc.paidSaleId===sale.id) {
      acc.status="open";
      acc.paidSaleId="";
      acc.paidAt="";
      acc.updatedAt=new Date().toISOString();
      await put("tableAccounts",acc);
      try { await cloudSaveTableAccountFromApp(acc); } catch (error) { console.error(error); acc.cloudPending = true; await put("tableAccounts",acc); }
    }
  }
  if (sale.sourceOrderId) {
    const order = state.orders.find(o => o.id === sale.sourceOrderId);
    if (order && order.linkedSaleId === sale.id) {
      const now = new Date().toISOString();
      order.linkedSaleId = "";
      order.linkedSaleCloudId = "";
      order.linkedSaleNumber = "";
      order.paymentStatus = "Pendiente";
      order.paidAt = "";
      if (normalizeOrderStatus(order.status) === "Entregado") { order.status = isFood() ? "Listo" : "Recibido"; order.deliveredAt = ""; }
      order.updatedAt = now;
      order.statusHistory = [...(order.statusHistory || []), { status: "Pago anulado", at: now, saleId: sale.id }];
      await put("orders", order);
      try { await cloudSaveOrderFromApp(order); } catch (error) { console.error(error); order.cloudPending = true; await put("orders", order); }
    }
  }
  await refreshShiftAfterVoid(sale);
  try { await cloudSaveSaleFromApp(sale); } catch (error) { console.error(error); sale.cloudPending = true; await put("sales",sale); }
  if (sale.shiftId) { const sh=state.cashSessions.find(x=>x.id===sale.shiftId); if(sh){ try{await cloudSaveCashSessionFromApp(sh);}catch(error){console.error(error);sh.cloudPending=true;await put("cashSessions",sh);} } }
  closeModal();
  salesStatusMode="voided";
  screen="sales";
  renderSales();
  toast(`Comprobante #${sale.number} anulado.`);
};
window.askHideSale = id => {
  if (!requirePermission("void_sales", "No tienes permiso para eliminar comprobantes anulados de la vista.")) return;
  const sale=state.sales.find(x=>x.id===id);
  if(!sale || !sale.voided) return;
  modal(`<h3>Eliminar de Mis ventas</h3><p>¿Quieres quitar el comprobante #${sale.number} de la pantalla Mis ventas?</p><p class="muted">El registro interno de la anulación se conservará. No cambia Caja, Crédito ni reportes.</p><div class="toolbar"><button class="btn danger" onclick="hideSaleFromHistory('${id}')">Eliminar de Mis ventas</button><button class="btn" onclick="closeModal()">Cancelar</button></div>`);
};
window.hideSaleFromHistory = async id => {
  if (!requirePermission("void_sales", "No tienes permiso para eliminar comprobantes anulados de la vista.")) return;
  const sale=state.sales.find(x=>x.id===id);

  toast("Comprobante eliminado de Mis ventas.");

function productCategories() { return [...new Set(currentProducts().map(p => p.category?.trim() || "Otros"))].sort((a,b)=>a.localeCompare(b,"es")); }
function retailInventoryStats(products=currentProducts()) {
  const rows=(products||[]).filter(Boolean);
  return rows.reduce((out,p)=>{
    const stock=Math.max(0,Number(p.stock||0));
    const cost=Math.max(0,Number(p.cost||0));
    const price=Math.max(0,Number(p.price||0));
    out.units+=stock;
    out.invested+=cost*stock;
    out.saleValue+=price*stock;
    if(stock>0&&cost<=0)out.missingCostProducts+=1;
    return out;
  },{units:0,invested:0,saleValue:0,projectedProfit:0,missingCostProducts:0});
}
function finishRetailInventoryStats(stats){stats.projectedProfit=Number(stats.saleValue||0)-Number(stats.invested||0);return stats;}
function retailInventorySummaryHtml(stats=finishRetailInventoryStats(retailInventoryStats()), title="Inventario actual") {
  const warning=stats.missingCostProducts>0?`<div class="inventory-summary-note">⚠️ ${stats.missingCostProducts} ${stats.missingCostProducts===1?"artículo tiene":"artículos tienen"} stock sin costo registrado; la ganancia proyectada puede variar.</div>`:`<div class="inventory-summary-note">Ganancia proyectada = vender todo el stock al precio actual. No es ganancia real.</div>`;
  return `<div class="panel" style="margin-top:14px"><div class="row-head"><div><strong>${esc(title)}</strong><div class="muted">${Number(stats.units||0)} unidades en existencia</div></div></div><div class="inventory-summary-grid"><div class="inventory-summary-card"><span>Dinero en mercadería</span><strong>${money(stats.invested)}</strong></div><div class="inventory-summary-card"><span>Valor potencial de venta</span><strong>${money(stats.saleValue)}</strong></div><div class="inventory-summary-card"><span>Ganancia proyectada</span><strong>${money(stats.projectedProfit)}</strong></div></div>${warning}</div>`;
}
window.updateProductFinancialPreview=id=>{
  if(!isProducts())return;
  const box=$("#pFinancialPreview");if(!box)return;
  const stock=Math.max(0,Number($("#pStock")?.value||0));
  const cost=Math.max(0,Number($("#pCost")?.value||0));
  const price=Math.max(0,Number($("#pPrice")?.value||0));
  const item={invested:cost*stock,saleValue:price*stock,projectedProfit:(price-cost)*stock};
  const base=finishRetailInventoryStats(retailInventoryStats(currentProducts().filter(p=>!id||p.id!==id)));
  const after={...base,units:Number(base.units||0)+stock,invested:Number(base.invested||0)+item.invested,saleValue:Number(base.saleValue||0)+item.saleValue,missingCostProducts:Number(base.missingCostProducts||0)+(stock>0&&cost<=0?1:0)};
  finishRetailInventoryStats(after);
  box.innerHTML=`<h4>Resumen de este artículo</h4><div class="inventory-summary-grid"><div class="inventory-summary-card"><span>Mercadería</span><strong>${money(item.invested)}</strong></div><div class="inventory-summary-card"><span>Venta potencial</span><strong>${money(item.saleValue)}</strong></div><div class="inventory-summary-card"><span>Ganancia proyectada</span><strong>${money(item.projectedProfit)}</strong></div></div><div class="inventory-summary-note">Al guardar, todo tu inventario quedaría en <strong>${money(after.invested)}</strong> de mercadería, <strong>${money(after.saleValue)}</strong> de venta potencial y <strong>${money(after.projectedProfit)}</strong> de ganancia proyectada.</div>${stock>0&&cost<=0?`<div class="inventory-summary-note">⚠️ Agrega el costo de compra para que la proyección sea más precisa.</div>`:""}`;
};
