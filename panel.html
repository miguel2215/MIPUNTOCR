<body>
<div id="root"></div>
<script>
const SUPABASE_URL='https://uspycwpztzkenwsevvrp.supabase.co';
const SUPABASE_KEY='sb_publishable_gRxzhxgEe3WnqSfA-fn6_w_nOtQ7sDy';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});
let user=null,business=null,membership=null,data={sales:[],saleItems:[],payments:[],credits:[],products:[],clients:[],orders:[],members:[],employees:[]};
let view='home';
const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=n=>new Intl.NumberFormat('es-CR',{style:'currency',currency:'CRC',maximumFractionDigits:0}).format(Number(n||0));
const dt=v=>v?new Date(v).toLocaleString('es-CR',{dateStyle:'short',timeStyle:'short'}):'—';
const dayKey=v=>{const d=new Date(v);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const settings=()=>business?.settings&&typeof business.settings==='object'?business.settings:{};
function planLabel(){return String(settings().planTier||'free').toLowerCase()==='pro'?'PRO':'FREE'}
function activeSales(){return data.sales.filter(s=>s.status!=='voided'&&!s.hidden_from_sales)}
function salesSince(days){const t=Date.now()-days*86400000;return activeSales().filter(s=>new Date(s.created_at).getTime()>=t)}
function creditBalance(clientId){return data.credits.filter(m=>m.client_id===clientId).reduce((n,m)=>{const a=Number(m.amount||0);if(m.movement_type==='credit_sale')return n+a;if(m.movement_type==='payment'||m.movement_type==='void')return n-a;return n},0)}
function totalReceivable(){return data.clients.reduce((n,c)=>n+Math.max(0,creditBalance(c.id)),0)}
function todaySales(){const k=dayKey(new Date());return activeSales().filter(s=>dayKey(s.created_at)===k)}
function productNameById(id){return data.products.find(p=>p.id===id)?.name||''}
function navButton(id,label){return `<button data-nav="${id}" class="${view===id?'active':''}">${label}</button>`}
function shell(content){const logo=settings().businessLogoDataUrl||'logo-horizontal.png';const pro=planLabel()==='PRO';return `<div class="app"><header class="top"><div class="topin"><div class="brand"><img src="${esc(logo)}" alt="Logo"><div><div class="brand-name-line"><strong>${esc(business?.name||'PUNTO YA CR')}</strong>${pro?'<span class="brand-pro-badge">★ PRO</span>':''}</div><small>Panel del Emprendedor</small></div></div><div class="actions"><span class="pill ${pro?'pro':''}">${pro?'★ PRO':'FREE'}</span><button class="btn ghost" id="goApp">Abrir app</button><button class="btn danger" id="logout">Salir</button></div></div></header><div class="layout"><aside class="nav">${navButton('business','Mi negocio')}${navButton('home','Hoy')}${navButton('sales','Ventas')}${navButton('inventory','Inventario')}${navButton('clients','Clientes')}${navButton('money','Dinero')}${navButton('goals','Metas')}${navButton('week','Mi semana')}${navButton('opportunities','Oportunidades')}${navButton('growth','Haz crecer')}${navButton('ask','Pregúntale a PUNTO YA')}${navButton('team','Equipo')}${navButton('pro','PRO')}${navButton('settings','Configuración')}</aside><main class="main">${content}</main></div></div>`}
function kpi(label,value,sub=''){return `<div class="card metric"><span>${esc(label)}</span><strong>${value}</strong>${sub?`<small class="muted">${esc(sub)}</small>`:''}</div>`}
function renderHome(){const ts=todaySales(),s30=salesSince(30),grossToday=ts.reduce((n,s)=>n+Number(s.total||0),0),gross30=s30.reduce((n,s)=>n+Number(s.total||0),0),avg=s30.length?gross30/s30.length:0,low=data.products.filter(p=>Number(p.stock||0)>0&&Number(p.min_stock||0)>0&&Number(p.stock||0)<=Number(p.min_stock||0)).length,out=data.products.filter(p=>Number(p.stock||0)<=0).length,recent=activeSales().slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,8);return shell(`<div class="hero"><div><h1>Así va tu negocio hoy</h1><p>${new Date().toLocaleDateString('es-CR',{weekday:'long',day:'numeric',month:'long'})}</p></div><span class="pill">${business?.business_type==='products'?'Retail':'Restaurante'}</span></div><div class="grid4">${kpi('Ventas hoy',money(grossToday),`${ts.length} ventas`)}${kpi('Últimos 30 días',money(gross30),`${s30.length} ventas`)}${kpi('Ticket promedio',money(avg))}${kpi('Por cobrar',money(totalReceivable()))}</div><div class="grid3 section">${kpi('Productos',String(data.products.length))}${kpi('Stock bajo',String(low))}${kpi('Agotados',String(out))}</div><section class="section"><h2>Ventas recientes</h2><div class="list">${recent.length?recent.map(s=>`<div class="row"><div><strong>#${esc(s.receipt_number||s.local_number||'—')}</strong><small>${dt(s.created_at)} · ${esc(s.payment_method||'')}</small></div><strong>${money(s.total)}</strong></div>`).join(''):`<div class="card empty">Todavía no hay ventas sincronizadas.</div>`}</div></section>`)}
function renderSales(){const rows=activeSales().slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));const s30=salesSince(30),gross=s30.reduce((n,s)=>n+Number(s.total||0),0);return shell(`<div class="hero"><div><h1>Ventas</h1><p>Historial y comportamiento comercial.</p></div></div><div class="grid3">${kpi('30 días',money(gross))}${kpi('Transacciones',String(s30.length))}${kpi('Ticket promedio',money(s30.length?gross/s30.length:0))}</div><section class="section"><div class="tablewrap"><table class="table"><thead><tr><th>Fecha</th><th>Comprobante</th><th>Pago</th><th>Origen</th><th style="text-align:right">Total</th></tr></thead><tbody>${rows.slice(0,200).map(s=>`<tr><td>${dt(s.created_at)}</td><td>#${esc(s.receipt_number||s.local_number||'—')}</td><td>${esc(s.payment_method||'—')}</td><td>${esc(s.order_type||s.sale_type||'—')}</td><td class="num">${money(s.total)}</td></tr>`).join('')||`<tr><td colspan="5" class="empty">Sin ventas.</td></tr>`}</tbody></table></div></section>`)}
function renderInventory(){const inv=data.products.filter(p=>p.active!==false),invested=inv.reduce((n,p)=>n+Number(p.cost||0)*Math.max(0,Number(p.stock||0)),0),potential=inv.reduce((n,p)=>n+Number(p.price||0)*Math.max(0,Number(p.stock||0)),0);return shell(`<div class="hero"><div><h1>Inventario</h1><p>Existencias, costo y alertas.</p></div></div><div class="grid3">${kpi('Mercadería',money(invested))}${kpi('Venta potencial',money(potential))}${kpi('Ganancia proyectada',money(Math.max(0,potential-invested)))}</div><section class="section"><div class="tablewrap"><table class="table"><thead><tr><th>Producto</th><th>Stock</th><th>Costo</th><th>Precio</th><th style="text-align:right">Valor</th></tr></thead><tbody>${inv.map(p=>`<tr><td><strong>${esc(p.name)}</strong><br><small class="muted">${esc(p.barcode||p.sku||'')}</small></td><td>${Number(p.stock||0)}${Number(p.min_stock||0)>0&&Number(p.stock||0)<=Number(p.min_stock||0)?' ⚠️':''}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td class="num">${money(Number(p.cost||0)*Math.max(0,Number(p.stock||0)))}</td></tr>`).join('')||`<tr><td colspan="5" class="empty">Sin productos sincronizados.</td></tr>`}</tbody></table></div></section>`)}
function renderClients(){const rows=data.clients.map(c=>({c,b:Math.max(0,creditBalance(c.id))})).sort((a,b)=>b.b-a.b);return shell(`<div class="hero"><div><h1>Clientes</h1><p>Cuentas por cobrar y saldos.</p></div></div><div class="grid3">${kpi('Clientes',String(data.clients.length))}${kpi('Por cobrar',money(totalReceivable()))}${kpi('Con saldo',String(rows.filter(x=>x.b>0).length))}</div><section class="section"><div class="list">${rows.map(({c,b})=>`<div class="row"><div><strong>${esc(c.name||'Cliente')}</strong><small>${esc(c.phone||'Sin teléfono')}</small></div><div style="text-align:right"><strong>${money(b)}</strong><small>${b>0?'Pendiente':'Al día'}</small></div></div>`).join('')||`<div class="card empty">Sin clientes sincronizados.</div>`}</div></section>`)}
function renderMoney(){const p30=data.payments.filter(p=>new Date(p.created_at).getTime()>=Date.now()-30*86400000),by={};p30.forEach(p=>{const k=p.method||'Otro';by[k]=(by[k]||0)+Number(p.amount||0)});const supplierOrders=Array.isArray(settings().retailSupplierOrders)?settings().retailSupplierOrders:[],payables=Array.isArray(settings().retailPayables)?settings().retailPayables:[],pending=payables.filter(x=>!['paid','Pagado'].includes(x.status)).reduce((n,x)=>n+Number(x.balance??x.amount??0),0);return shell(`<div class="hero"><div><h1>Dinero</h1><p>Cómo entra y qué queda pendiente.</p></div></div><div class="grid3">${Object.entries(by).slice(0,3).map(([k,v])=>kpi(k,money(v),'Últimos 30 días')).join('')||kpi('Ventas cobradas',money(0))}</div><section class="section"><h2>Cuentas por pagar</h2><div class="grid3">${kpi('Pendiente proveedores',money(pending))}${kpi('Pedidos proveedor',String(supplierOrders.length))}${kpi('Por cobrar clientes',money(totalReceivable()))}</div></section><div class="notice section">Para contabilidad formal y conciliación bancaria seguimos manteniendo el alcance fuera de la beta. Este panel resume la operación del negocio.</div>`)}
function weekly(){const arr=[];for(let i=6;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const k=dayKey(d),total=activeSales().filter(s=>dayKey(s.created_at)===k).reduce((n,s)=>n+Number(s.total||0),0);arr.push({d,total,label:d.toLocaleDateString('es-CR',{weekday:'short'})})}return arr}
function renderWeek(){const w=weekly(),max=Math.max(1,...w.map(x=>x.total)),sum=w.reduce((n,x)=>n+x.total,0);return shell(`<div class="hero"><div><h1>Mi semana</h1><p>Una vista simple de los últimos 7 días.</p></div></div><div class="card">${w.map(x=>`<div class="barrow"><strong>${esc(x.label)}</strong><div class="bar"><i style="width:${Math.max(2,x.total/max*100)}%"></i></div><strong style="text-align:right">${money(x.total)}</strong></div>`).join('')}</div><div class="grid3 section">${kpi('Total semana',money(sum))}${kpi('Promedio diario',money(sum/7))}${kpi('Mejor día',money(Math.max(...w.map(x=>x.total))))}</div>`)}
function opportunities(){const out=[];const w=weekly(),best=w.slice().sort((a,b)=>b.total-a.total)[0];if(best?.total>0)out.push(`Tu mejor día de los últimos 7 días fue ${best.label} con ${money(best.total)}.`);const low=data.products.filter(p=>Number(p.min_stock||0)>0&&Number(p.stock||0)<=Number(p.min_stock||0));if(low.length)out.push(`Tienes ${low.length} producto${low.length===1?'':'s'} con stock bajo o agotado.`);const receivable=totalReceivable();if(receivable>0)out.push(`Hay ${money(receivable)} pendientes de clientes a crédito. Puedes dar seguimiento desde la app.`);const orders=Array.isArray(settings().retailSupplierOrders)?settings().retailSupplierOrders.filter(o=>o.status!=='received'):[];if(orders.length)out.push(`Tienes ${orders.length} pedido${orders.length===1?'':'s'} a proveedor todavía pendiente${orders.length===1?'':'s'} de recibir.`);if(!out.length)out.push('No detectamos alertas importantes con los datos sincronizados actuales.');return out}
function renderOpportunities(){return shell(`<div class="hero"><div><h1>Oportunidades</h1><p>Recomendaciones basadas en tus datos reales.</p></div></div><div class="list">${opportunities().map((x,i)=>`<div class="opp"><strong>${i===0?'Oportunidad de hoy':'También revisa esto'}</strong><p>${esc(x)}</p></div>`).join('')}</div><div class="notice section">PUNTO YA CR prepara recomendaciones; el dueño decide qué acción tomar. No se publican promociones automáticamente.</div>`)}

function renderPro(){return shell(`<div class="hero"><div><h1>PUNTO YA CR PRO</h1><p>Protege, administra y haz crecer tu negocio.</p></div><span class="pill pro">${planLabel()}</span></div><div class="grid3"><div class="card"><strong>☁️ Nube y seguridad</strong><p class="muted">Respaldo, sincronización, recuperación, varios dispositivos y equipo.</p></div><div class="card"><strong>🧾 Facturación electrónica</strong><p class="muted">Función fiscal opcional que puedes activar después de PRO. Usa Hacienda 4.4, CAByS, impuestos y comprobantes.</p></div><div class="card"><strong>📈 Crecimiento</strong><p class="muted">Metas, semana, oportunidades, clientes, inventario y recomendaciones basadas en datos.</p></div></div><section class="section"><div class="card"><h2 style="margin-top:0">Funciones actuales de PRO</h2><p class="muted">Panel del Emprendedor, nube/sincronización, empleados y permisos, análisis de ventas, crecimiento, reportes y respaldo. Facturación Electrónica se activa aparte cuando el negocio la necesite.</p><div class="notice">El cobro automático de PRO todavía no está conectado actualmente. Ningún botón de este panel realiza un cargo.</div></div></section>`)}

function panelPaymentLabelV12(v){const k=String(v||'').toLowerCase();if(k.includes('cash')||k.includes('efect'))return'Efectivo';if(k.includes('credit'))return'Crédito';if(k.includes('card')||k.includes('tarj'))return'Tarjeta';if(k.includes('sinpe'))return'SINPE';return v||'Otro'}
function panelStockStateV12(p){const stock=Number(p.stock||0),min=Number(p.min_stock||0);if(stock<=0)return['Agotado','danger'];if(min>0&&stock<=min)return['Stock bajo','warn'];return['Disponible','ok']}
function renderSales(){const rows=activeSales().slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));const s30=salesSince(30),gross=s30.reduce((n,s)=>n+Number(s.total||0),0),today=todaySales(),todayGross=today.reduce((n,s)=>n+Number(s.total||0),0);return shell(`<div class="hero"><div><h1>Ventas</h1><p>Lo importante primero: cuánto vendiste y cómo se está moviendo el negocio.</p></div></div><div class="grid3">${kpi('Ventas hoy',money(todayGross),`${today.length} transacciones`)}${kpi('Últimos 30 días',money(gross),`${s30.length} ventas`)}${kpi('Ticket promedio',money(s30.length?gross/s30.length:0),'Últimos 30 días')}</div><section class="section"><h2>Ventas recientes</h2><div class="panel-mobile-list panel-mobile-only">${rows.slice(0,40).map(s=>`<div class="panel-mobile-card"><div class="panel-mobile-card-head"><strong>Comprobante #${esc(s.receipt_number||s.local_number||'—')}</strong><b>${money(s.total)}</b></div><p>${dt(s.created_at)}</p><div class="meta"><span class="panel-mini-pill">${esc(panelPaymentLabelV12(s.payment_method))}</span><span class="panel-mini-pill">${esc(s.order_type||s.sale_type||'Venta')}</span></div></div>`).join('')||'<div class="card empty">Sin ventas todavía.</div>'}</div><div class="tablewrap desktop-table"><table class="table"><thead><tr><th>Fecha</th><th>Comprobante</th><th>Pago</th><th>Origen</th><th style="text-align:right">Total</th></tr></thead><tbody>${rows.slice(0,200).map(s=>`<tr><td>${dt(s.created_at)}</td><td>#${esc(s.receipt_number||s.local_number||'—')}</td><td>${esc(panelPaymentLabelV12(s.payment_method))}</td><td>${esc(s.order_type||s.sale_type||'—')}</td><td class="num">${money(s.total)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Sin ventas.</td></tr>'}</tbody></table></div></section>`)}

    sb.from('cash_shifts').select('*').eq('business_id',b).order('opened_at',{ascending:false}).limit(250),

function pyV2Norm(v){return String(v||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/0/g,'o').replace(/1/g,'i').replace(/3/g,'e').replace(/4/g,'a').replace(/5/g,'s').replace(/7/g,'t').replace(/[^a-z0-9ñ\s._-]/g,' ').replace(/\s+/g,' ').trim()}

function pyV2Redact(text){let s=String(text||'');const patterns=[/sb_secret_[A-Za-z0-9_-]+/g,/sk-[A-Za-z0-9_-]{12,}/g,/postgres(?:ql)?:\/\/\S+/gi,/Bearer\s+[A-Za-z0-9._-]{8,}/gi,/-----BEGIN [A-Z ]*PRIVATE KEY-----[\s\S]*?-----END [A-Z ]*PRIVATE KEY-----/g,/SUPABASE_[A-Z0-9_]*KEY\s*[:=]\s*\S+/gi];for(const p of patterns)s=s.replace(p,'[DATO PROTEGIDO]');return s}

function pyV2SalesAnswer(q){const today=todaySales(),yesterday=pyV2SalesWindow(1,1),week=pyV2SalesWindow(7),prev=pyV2SalesWindow(7,7),month=pyV2MonthSalesRows();if(/ayer/.test(q))return `Ayer registraste ${yesterday.length} venta${yesterday.length===1?'':'s'} por ${money(pyV2Gross(yesterday))}.`;if(/mes/.test(q))return `Este mes llevas ${money(pyV2Gross(month))} en ${month.length} venta${month.length===1?'':'s'}.`;if(/semana|7 dias|compar/.test(q)){const a=pyV2Gross(week),b=pyV2Gross(prev),c=pyV2Compare(a,b);return `En los últimos 7 días vendiste ${money(a)} en ${week.length} ventas. ${c.text}. Tu ticket promedio fue ${money(week.length?a/week.length:0)}.`}return `Hoy llevas ${money(pyV2Gross(today))} en ${today.length} venta${today.length===1?'':'s'}. En los últimos 7 días acumulas ${money(pyV2Gross(week))}.`}

e tienes ${money(totalReceivable())} por cobrar entre ${data.clients.filter(c=>creditBalance(c.id)>0).length} cliente${data.clients.filter(c=>creditBalance(c.id)>0).length===1?'':'s'}.`;if(/meta|cuanto.*falta/.test(q)){const g=pyV2GoalStats();return g.target?`Llevas ${money(g.actual)} de una meta de ${money(g.target)} (${g.pct.toFixed(0)}%). Faltan ${money(g.remaining)}. Con ${g.daysLeft} días restantes, necesitas promediar cerca de ${money(g.needed)} por día.`:'Todavía no has definido una meta mensual. Puedes hacerlo desde Metas.'}if(/metodo.*pago|como pagan|forma.*pago/.test(q)){const m=pyV2PaymentSummary(30);return m.length?`En los últimos 30 días:\n${m.slice(0,5).map(([k,v])=>`• ${k==='Crédito'?'Ventas a crédito':k}: ${money(v)}`).join('\n')}`:'Todavía no hay suficientes pagos sincronizados para comparar.'}if(/como.*caja|caja.*hoy|efectivo esperado|ultimo cierre|diferencia.*caja/.test(q)){const sh=pyV2CurrentCash()||pyV2LastClosedCash(),s=pyV2CashSnapshot(sh);if(!s)return'Todavía no hay información de caja sincronizada.';return sh.status==='open'?`La caja está abierta. Fondo inicial ${money(s.opening)}, retiros ${money(s.outs)} y efectivo esperado ${money(s.expected)}.`:`La última caja está cerrada. Fondo inicial ${money(s.opening)}, efectivo contado ${money(s.counted||0)} y diferencia ${money(s.difference||0)}.`}if(/fondo fijo|fondo inicial/.test(q))return'El fondo fijo es el efectivo base con el que inicia la caja. Al abrir un nuevo día, la App muestra el fondo del día anterior para que puedas continuar con ese monto o cambiarlo antes de abrir.';if(/retiro.*caja|sacar.*efectivo|salida.*efectivo/.test(q))return'En la App abre Caja y usa “Registrar retiro”. Indica el monto y el motivo. Ese movimiento se descuenta del efectivo esperado del cierre.';if(/cerrar.*caja|cierre.*caja/.test(q))return'En la App entra a Caja y toca “Cerrar caja”. PUNTO YA muestra el efectivo esperado; escribe el efectivo contado y confirma. El cierre guarda la diferencia entre contado y e let v744FiscalLookupActivities=[];
function cleanFiscalIdentificationV744(value){return String(value||'').replace(/\D+/g,'')}
function fiscalIdTypeCodeV744(value){
  const raw=String(value||'').trim();
  if(['01','02','03','04'].includes(raw))return raw;
  const t=raw.toLowerCase();
  if(t.includes('fís')||t.includes('fisica')||t.includes('física'))return'01';
  if(t.includes('jur'))return'02';
  if(t.includes('dimex'))return'03';
  if(t.includes('nite'))return'04';

}
function normalizeFiscalActivitiesV744(value){
  if(!Array.isArray(value))return[];

    description:String(a?.description??a?.descripcion??a?.nombre??'').trim()

}
function fiscalBusinessActivityOptionsV744(rows,selected=''){

async function lookupFiscalBusinessV744(){
  const input=$('#fiscalIdP');
  const id=cleanFiscalIdentificationV744(input?.value||'');
  if(input)input.value=id;
  if(id.length<9||id.length>12){
    setFiscalLookupStatusV744('Escribe una identificación de 9 a 12 dígitos.','error');
    return;
  }
  if(!business?.id){
    setFiscalLookupStatusV744('No se encontró el negocio vinculado a la sesión.','error');
    return;
  }
  setFiscalLookupStatusV744('Consultando Hacienda…');
  try{
    const {data,error}=await sb.functions.invoke('hacienda-taxpayer-lookup',{body:{business_id:business.id,identificacion:id}});
    if(error)throw error;
    if(data?.error)throw new Error(data.error);
    const name=String(data?.name||data?.nombre||'').trim();
    if(!name)throw new Error('Hacienda no devolvió el nombre fiscal.');
    const idType=fiscalIdTypeCodeV744(data?.idType||data?.tipoIdentificacion||'');
    const activities=normalizeFiscalActivitiesV744(data?.activities||data?.actividades||[]);
    v744FiscalLookupActivities=activities;
    if($('#fiscalLegalNameP'))$('#fiscalLegalNameP').value=name;
    if($('#fiscalIdTypeP'))$('#fiscalIdTypeP').value=idType;
    const select=$('#fiscalActivitySelectP');
    const current=$('#fiscalActivityCodeP')?.value||'';
    if(select)select.innerHTML=fiscalBusinessActivityOptionsV744(activities,current);
    if(activities.length===1){
      if(select)select.value=activities[0].code;
      selectFiscalBusinessActivityV744(activities[0].code);
      setFiscalLookupStatusV744(`✓ ${name} · actividad económica cargada automáticamente.`,'ok');
    }else if(activities.length>1){
      setFiscalLookupStatusV744(`✓ ${name} · Hacienda reportó ${activities.length} actividades. Selecciona la que corresponde al negocio.`,'ok');
    }else{
      setFiscalLookupStatusV744(`✓ ${name} encontrado. Hacienda no devolvió actividades; puedes ingresarla manualmente.`,'ok');
    }
  }catch(e){
    console.error(e);
    setFiscalLookupStatusV744(e?.message||'No se pudo consultar Hacienda. Puedes completar los datos manualmente.','error');
  }
}

  try{box.className='status';box.textContent='Guardando…';const province=$('#fiscalProvinceP')?.value||'',canton=String($('#fiscalCantonP')?.value||'').padStart(2,'0'),district=String($('#fiscalDistrictP')?.value||'').padStart(2,'0'),otherSigns=$('#fiscalOtherSignsP')?.value.trim()||'';if(!province||!$('#fiscalCantonP')?.value||!$('#fiscalDistrictP')?.value||!otherSigns)throw new Error('Selecciona Provincia, Cantón y Distrito, y completa Otras señas.');const provinceName=$('#fiscalProvinceP')?.selectedOptions?.[0]?.textContent?.trim()||'',cantonName=$('#fiscalCantonP')?.selectedOptions?.[0]?.textContent?.trim()||'',districtName=$('#fiscalDistrictP')?.selectedOptions?.[0]?.textContent?.trim()||'';const profileWillBeComplete=!!($('#fiscalLegalNameP')?.value.trim()&&$('#fiscalIdP')?.value.trim()&&$('#fiscalActivityCodeP')?.value.trim()&&$('#fiscalEmailP')?.value.trim());const next={...settings(),fiscalOnboardingAsked:true,fiscalActivationStarted:true,fiscalUsesEInvoice:!!(profileWillBeComplete&&v743FiscalSecureStatus.connected),fiscalLegalName:$('#fiscalLegalNameP')?.value.trim()||'',fiscalIdType:$('#fiscalIdTypeP')?.value||'01',fiscalId:$('#fiscalIdP')?.value.trim()||'',fiscalEmail:$('#fiscalEmailP')?.value.trim()||'',fiscalEconomicActivityCode:$('#fiscalActivityCodeP')?.value.trim()||'',fiscalEconomicActivityName:$('#fiscalActivityNameP')?.value.trim()||'',fiscalBranchCode:digits($('#fiscalBranchP')?.value,3).padStart(3,'0'),fiscalTerminalCode:digits($('#fiscalTerminalP')?.value,5).padStart(5,'0'),fiscalProvince:province,fiscalProvinceName:provinceName,fiscalCanton:canton,fiscalCantonName:cantonName,fiscalDistrict:district,fiscalDistrictName:districtName,fiscalOtherSigns:otherSigns,fiscalPricesIncludeTax:$('#fiscalPricesIncludeTaxP')?.value!=='added',fiscalSetupUpdatedAt:new Date().toISOString()};await updateBusinessV742({settings:next});box.className='status ok';box.textContent='Datos fiscales y ubicación guardados.';setTimeout(render,500)}catch(e){console.error(e);box.className='status error';box.textContent=e?.message||'No se pudieron guardar los datos fiscales.'}
}
function fileToBase64V743(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||'').split(',').pop()||'');r.onerror=()=>reject(r.error||new Error('No se pudo leer la llave.'));r.readAsDataURL(file)})}
async function saveHaciendaCredentialsV743(){
  const box=$('#haciendaStatus');if(!isOwnerPanel()||!box)return;const file=$('#haciendaP12')?.files?.[0],username=$('#haciendaUser')?.value.trim()||'',password=$('#haciendaPass')?.value||'',pin=$('#haciendaPin')?.value||'';
  if(!username||!password||!pin||!file){box.className='status error';box.textContent='Completa usuario, contraseña, PIN y selecciona la llave .p12.';return}

  if(file.size>1500000){box.className='status error';box.textContent='La llave .p12 es demasiado grande para este flujo.';return}
  try{box.className='status';box.textContent='Protegiendo credenciales…';const p12_base64=await fileToBase64V743(file);const {data:r,error}=await sb.functions.invoke('hacienda-credentials',{body:{business_id:business.id,environment:'sandbox',username,password,pin,p12_base64}});if(error)throw error;['haciendaUser','haciendaPass','haciendaPin'].forEach(id=>{const el=$('#'+id);if(el)el.value=''});if($('#haciendaP12'))$('#haciendaP12').value='';box.className='status ok';box.textContent=r?.message||'Credenciales protegidas.';await loadV743FiscalSecureStatus();if(fiscalProfileCompletionV743()===100&&v743FiscalSecureStatus.connected&&!settings().fiscalUsesEInvoice){try{await updateBusinessV742({settings:{...settings(),fiscalOnboardingAsked:true,fiscalActivationStarted:true,fiscalUsesEInvoice:true,fiscalSetupUpdatedAt:new Date().toISOString()}})}catch(e){console.error(e)}}setTimeout(render,700)}catch(e){console.error(e);box.className='status error';box.textContent='No se pudo guardar en el backend fiscal. Verifica que las funciones v7.44 estén desplegadas en Supabase.'}
}
async function testHaciendaConnectionV743(){const box=$('#haciendaStatus');if(!box)return;try{box.className='status';box.textContent='Probando OAuth con Hacienda…';const {data:r,error}=await sb.functions.invoke('hacienda-test-connection',{body:{business_id:business.id,environment:'sandbox'}});if(error)throw error;box.className='status ok';box.textContent=r?.ok?'✓ Conexión de pruebas correcta.':'Hacienda respondió, pero la conexión no quedó validada.'}catch(e){console.error(e);box.className='status error';box.textContent=e?.message||'No se pudo validar la conexión de pruebas.'}}
async function refreshHaciendaStatusV743(){const box=$('#haciendaStatus');if(box){box.className='status';box.textContent='Actualizando…'}await loadV743FiscalSecureStatus();render()}

function bind(){

  document.querySelectorAll('[data-settings]').forEach(b=>b.addEventListener('click',()=>{const key=b.dataset.settings||'';if(key==='pro'){view='pro';settingsSection='pro'}else{view='settings';settingsSection=key}render()}));
  $('#goApp')?.addEventListener('click',()=>location.href='index.html');
  $('#homeGoApp')?.addEventListener('click',()=>location.href='index.html');
  const signout=async()=>{await sb.auth.signOut();location.href='index.html'};
  $('#logout')?.addEventListener('click',signout);$('#logoutAccount')?.addEventListener('click',signout);
  $('#saveProfile')?.addEventListener('click',saveBusinessProfile);
  $('#saveBusinessType')?.addEventListener('click',saveBusinessTypeV742);
  $('#chooseLogo')?.addEventListener('click',()=>$('#logoFile')?.click());

  $('#logoFile')?.addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{pendingLogo=await resizeLogo(f);$('#logoPreview').innerHTML=`<img src="${esc(pendingLogo)}" alt="Logo negocio">`;await saveBusinessLogo()}catch(err){alert(err.message||'No se pudo procesar el logo')}});
  $('#findPrinter')?.addEventListener('click',findPrinterV742);$('#printTest')?.addEventListener('click',printPrinterTestV742);$('#printerOk')?.addEventListener('click',()=>printerCalibrationV742(true));$('#printerNo')?.addEventListener('click',()=>printerCalibrationV742(false));
  $('#activateProCode')?.addEventListener('click',()=>redeemProCodeV742('full'));
  $('#activateProCodeQuick')?.addEventListener('click',()=>redeemProCodeV742('quick'));
  $('#lookupFiscalBusinessP')?.addEventListener('click',lookupFiscalBusinessV744);$('#saveFiscalProfile')?.addEventListener('click',saveFiscalProfileV743);$('#saveHaciendaCredentials')?.addEventListener('click',saveHaciendaCredentialsV743);$('#testHacienda')?.addEventListener('click',testHaciendaConnectionV743);$('#refreshHaciendaStatus')?.addEventListener('click',refreshHaciendaStatusV743);
  $('#saveGoal')?.addEventListener('click',saveGoal);document.querySelectorAll('[data-ask]').forEach(b=>b.addEventListener('click',()=>{const box=$('#askAnswer');if(box)box.textContent=askPointYaAnswer(b.dataset.ask)}));
}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){return showAuth()}user=session.user;let m=null;const mr=await sb.from('business_members').select('*').eq('user_id',user.id).eq('active',true).order('created_at',{ascending:true}).limit(1);if(!mr.error)m=mr.data?.[0]||null;let b=null;if(m){const br=await sb.from('businesses').select('*').eq('id',m.business_id).maybeSingle();if(!br.error)b=br.data}else{const br=await sb.from('businesses').select('*').eq('owner_user_id',user.id).order('created_at',{ascending:true}).limit(1);if(!br.error)b=br.data?.[0]||null}if(!b)return showMessage('No encontramos un negocio vinculado a esta cuenta.','Abre PUNTO YA CR y termina la configuración del negocio.');membership=m||{role:'owner'};if(!['owner','admin'].includes(membership.role||'owner'))return showMessage('Acceso restringido','El Panel del Emprendedor está reservado para el Dueño o administración autorizada.');business=b;await Promise.all([loadAll(),loadV742PlanStatus(),loadV743FiscalSecureStatus()]);render()}

init().catch(e=>{console.error(e);showMessage('No se pudo abrir el panel','Revisa la conexión y los permisos de Supabase.')});
</script>
<script id="pycr-no-zoom-script">
(() => {
  const stop = (e) => e.preventDefault();
  document.addEventListener('gesturestart', stop, { passive: false });
  document.addEventListener('gesturechange', stop, { passive: false });
  document.addEventListener('gestureend', stop, { passive: false });
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
})();
</script>
