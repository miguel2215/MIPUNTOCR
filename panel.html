<style>
:root{--bg:#f5f7f5;--card:#fff;--text:#162B38;--muted:#60737d;--line:#e0e7e4;--primary:#11A680;--primary-dark:#065F5E;--soft:#e8f7f3;--danger:#b42318;--warn:#9a5b00;--shadow:0 8px 28px rgba(22,43,56,.06)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{position:sticky;top:0;z-index:30;background:rgba(245,247,245,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.topin{max-width:1280px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand img{width:44px;height:44px;object-fit:contain;border-radius:12px}.brand strong{display:block;font-size:18px}.brand small{display:block;color:var(--muted);margin-top:2px}.actions{display:flex;gap:8px;align-items:center}.btn{border:0;border-radius:14px;padding:11px 14px;font-weight:800;background:#e9eeec;color:var(--text)}.btn.primary{background:var(--primary);color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line)}.btn.danger{background:#fee9e7;color:var(--danger)}.layout{max-width:1280px;margin:auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;padding:18px 16px 40px}.nav{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:10px;height:max-content;position:sticky;top:86px;box-shadow:var(--shadow)}.nav button{width:100%;border:0;background:transparent;text-align:left;padding:12px 13px;border-radius:13px;font-weight:800;color:#425864}.nav button.active{background:var(--soft);color:var(--primary-dark)}.main{min-width:0}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}.hero h1{margin:0;font-size:34px;letter-spacing:-.8px}.hero p{margin:5px 0 0;color:var(--muted)}.pill{display:inline-flex;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:900;background:#e9eeec}.pill.pro{background:#daf6e7;color:#20663e}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:var(--shadow)}.metric span{display:block;color:var(--muted);font-size:12px;font-weight:700}.metric strong{display:block;margin-top:8px;font-size:26px;letter-spacing:-.5px}.section{margin-top:18px}.section h2{margin:0 0 10px;font-size:22px}.muted{color:var(--muted)}.list{display:grid;gap:10px}.row{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.row strong{display:block}.row small{display:block;color:var(--muted);margin-top:3px}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.table td.num{text-align:right;font-weight:800}.barrow{display:grid;grid-template-columns:50px 1fr 90px;gap:10px;align-items:center;margin:9px 0}.bar{height:12px;background:#edf1ef;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--primary);border-radius:999px}.notice{border:1px dashed #b8cbc7;background:#fbfdfc;border-radius:16px;padding:13px;color:var(--muted)}.opp{border:1px solid #cfe9e1;background:#f5fcfa;border-radius:17px;padding:14px}.opp strong{display:block}.opp p{margin:6px 0 0;color:#4f6570}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field label{font-weight:800;color:var(--muted);font-size:12px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 13px;background:#fff}.logo-preview{width:140px;height:90px;border:1px dashed #b8cbc7;border-radius:16px;background:#fff;display:grid;place-items:center;overflow:hidden}.logo-preview img{max-width:100%;max-height:100%;object-fit:contain}.auth{max-width:480px;margin:70px auto;padding:0 18px}.auth .card{padding:24px}.auth h1{margin:0 0 6px}.auth p{color:var(--muted)}.status{padding:10px 12px;border-radius:13px;background:#eef2f1;color:#425864;margin-top:12px}.error{background:#fee9e7;color:#8d2c24}.empty{padding:24px;text-align:center;color:var(--muted)}.hidden{display:none!important}@media(max-width:900px){.layout{grid-template-columns:1fr}.nav{position:static;display:flex;overflow:auto;gap:6px}.nav button{width:auto;white-space:nowrap}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:1fr 1fr}.hero h1{font-size:28px}}@media(max-width:560px){.topin{align-items:flex-start}.actions{flex-wrap:wrap;justify-content:flex-end}.grid4,.grid3,.form{grid-template-columns:1fr}.layout{padding:12px 10px 28px}.hero{display:block}.hero .pill{margin-top:8px}.barrow{grid-template-columns:42px 1fr 78px}}
</style>

<div id="root"></div>
<script>
const SUPABASE_URL='https://uspycwpztzkenwsevvrp.supabase.co';
const SUPABASE_KEY='sb_publishable_gRxzhxgEe3WnqSfA-fn6_w_nOtQ7sDy';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});
let user=null,business=null,membership=null,data={sales:[],saleItems:[],payments:[],credits:[],products:[],clients:[],orders:[],members:[],employees:[]};
let view='home';
const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=n=>new Intl.NumberFormat('es-CR',{style:'currency',currency:'CRC',maximumFractionDigits:0}).format(Number(n||0));
const dt=v=>v?new Date(v).toLocaleString('es-CR',{dateStyle:'short',timeStyle:'short'}):'—';
const dayKey=v=>{const d=new Date(v);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const settings=()=>business?.settings&&typeof business.settings==='object'?business.settings:{};
function planLabel(){return String(settings().planTier||'free').toLowerCase()==='pro'?'PRO':'FREE'}
function activeSales(){return data.sales.filter(s=>s.status!=='voided'&&!s.hidden_from_sales)}
function salesSince(days){const t=Date.now()-days*86400000;return activeSales().filter(s=>new Date(s.created_at).getTime()>=t)}
function creditBalance(clientId){return data.credits.filter(m=>m.client_id===clientId).reduce((n,m)=>{const a=Number(m.amount||0);if(m.movement_type==='credit_sale')return n+a;if(m.movement_type==='payment'||m.movement_type==='void')return n-a;return n},0)}
function totalReceivable(){return data.clients.reduce((n,c)=>n+Math.max(0,creditBalance(c.id)),0)}
function todaySales(){const k=dayKey(new Date());return activeSales().filter(s=>dayKey(s.created_at)===k)}
function productNameById(id){return data.products.find(p=>p.id===id)?.name||''}
function navButton(id,label){return `<button data-nav="${id}" class="${view===id?'active':''}">${label}</button>`}
function shell(content){const logo=settings().businessLogoDataUrl||'logo-horizontal.png';return `<div class="app"><header class="top"><div class="topin"><div class="brand"><img src="${esc(logo)}" alt="Logo"><div><strong>${esc(business?.name||'PUNTO YA CR')}</strong><small>Panel del Emprendedor</small></div></div><div class="actions"><span class="pill ${planLabel()==='PRO'?'pro':''}">${planLabel()}</span><button class="btn ghost" id="goApp">Abrir app</button><button class="btn danger" id="logout">Salir</button></div></div></header><div class="layout"><aside class="nav">${navButton('business','Mi negocio')}${navButton('home','Hoy')}${navButton('sales','Ventas')}${navButton('inventory','Inventario')}${navButton('clients','Clientes')}${navButton('money','Dinero')}${navButton('goals','Metas')}${navButton('week','Mi semana')}${navButton('opportunities','Oportunidades')}${navButton('growth','Haz crecer')}${navButton('ask','Pregúntale a PUNTO YA')}${navButton('team','Equipo')}${navButton('pro','PRO')}${navButton('settings','Configuración')}</aside><main class="main">${content}</main></div></div>`}
function kpi(label,value,sub=''){return `<div class="card metric"><span>${esc(label)}</span><strong>${value}</strong>${sub?`<small class="muted">${esc(sub)}</small>`:''}</div>`}
function renderHome(){const ts=todaySales(),s30=salesSince(30),grossToday=ts.reduce((n,s)=>n+Number(s.total||0),0),gross30=s30.reduce((n,s)=>n+Number(s.total||0),0),avg=s30.length?gross30/s30.length:0,low=data.products.filter(p=>Number(p.stock||0)>0&&Number(p.min_stock||0)>0&&Number(p.stock||0)<=Number(p.min_stock||0)).length,out=data.products.filter(p=>Number(p.stock||0)<=0).length,recent=activeSales().slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,8);return shell(`<div class="hero"><div><h1>Así va tu negocio hoy</h1><p>${new Date().toLocaleDateString('es-CR',{weekday:'long',day:'numeric',month:'long'})}</p></div><span class="pill">${business?.business_type==='products'?'Retail':'Restaurante'}</span></div><div class="grid4">${kpi('Ventas hoy',money(grossToday),`${ts.length} ventas`)}${kpi('Últimos 30 días',money(gross30),`${s30.length} ventas`)}${kpi('Ticket promedio',money(avg))}${kpi('Por cobrar',money(totalReceivable()))}</div><div class="grid3 section">${kpi('Productos',String(data.products.length))}${kpi('Stock bajo',String(low))}${kpi('Agotados',String(out))}</div><section class="section"><h2>Ventas recientes</h2><div class="list">${recent.length?recent.map(s=>`<div class="row"><div><strong>#${esc(s.receipt_number||s.local_number||'—')}</strong><small>${dt(s.created_at)} · ${esc(s.payment_method||'')}</small></div><strong>${money(s.total)}</strong></div>`).join(''):`<div class="card empty">Todavía no hay ventas sincronizadas.</div>`}</div></section>`)}
function renderSales(){const rows=activeSales().slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));const s30=salesSince(30),gross=s30.reduce((n,s)=>n+Number(s.total||0),0);return shell(`<div class="hero"><div><h1>Ventas</h1><p>Historial y comportamiento comercial.</p></div></div><div class="grid3">${kpi('30 días',money(gross))}${kpi('Transacciones',String(s30.length))}${kpi('Ticket promedio',money(s30.length?gross/s30.length:0))}</div><section class="section"><div class="tablewrap"><table class="table"><thead><tr><th>Fecha</th><th>Comprobante</th><th>Pago</th><th>Origen</th><th style="text-align:right">Total</th></tr></thead><tbody>${rows.slice(0,200).map(s=>`<tr><td>${dt(s.created_at)}</td><td>#${esc(s.receipt_number||s.local_number||'—')}</td><td>${esc(s.payment_method||'—')}</td><td>${esc(s.order_type||s.sale_type||'—')}</td><td class="num">${money(s.total)}</td></tr>`).join('')||`<tr><td colspan="5" class="empty">Sin ventas.</td></tr>`}</tbody></table></div></section>`)}
function renderInventory(){const inv=data.products.filter(p=>p.active!==false),invested=inv.reduce((n,p)=>n+Number(p.cost||0)*Math.max(0,Number(p.stock||0)),0),potential=inv.reduce((n,p)=>n+Number(p.price||0)*Math.max(0,Number(p.stock||0)),0);return shell(`<div class="hero"><div><h1>Inventario</h1><p>Existencias, costo y alertas.</p></div></div><div class="grid3">${kpi('Mercadería',money(invested))}${kpi('Venta potencial',money(potential))}${kpi('Ganancia proyectada',money(Math.max(0,potential-invested)))}</div><section class="section"><div class="tablewrap"><table class="table"><thead><tr><th>Producto</th><th>Stock</th><th>Costo</th><th>Precio</th><th style="text-align:right">Valor</th></tr></thead><tbody>${inv.map(p=>`<tr><td><strong>${esc(p.name)}</strong><br><small class="muted">${esc(p.barcode||p.sku||'')}</small></td><td>${Number(p.stock||0)}${Number(p.min_stock||0)>0&&Number(p.stock||0)<=Number(p.min_stock||0)?' ⚠️':''}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td class="num">${money(Number(p.cost||0)*Math.max(0,Number(p.stock||0)))}</td></tr>`).join('')||`<tr><td colspan="5" class="empty">Sin productos sincronizados.</td></tr>`}</tbody></table></div></section>`)}
function renderClients(){const rows=data.clients.map(c=>({c,b:Math.max(0,creditBalance(c.id))})).sort((a,b)=>b.b-a.b);return shell(`<div class="hero"><div><h1>Clientes</h1><p>Cuentas por cobrar y saldos.</p></div></div><div class="grid3">${kpi('Clientes',String(data.clients.length))}${kpi('Por cobrar',money(totalReceivable()))}${kpi('Con saldo',String(rows.filter(x=>x.b>0).length))}</div><section class="section"><div class="list">${rows.map(({c,b})=>`<div class="row"><div><strong>${esc(c.name||'Cliente')}</strong><small>${esc(c.phone||'Sin teléfono')}</small></div><div style="text-align:right"><strong>${money(b)}</strong><small>${b>0?'Pendiente':'Al día'}</small></div></div>`).join('')||`<div class="card empty">Sin clientes sincronizados.</div>`}</div></section>`)}
function renderMoney(){const p30=data.payments.filter(p=>new Date(p.created_at).getTime()>=Date.now()-30*86400000),by={};p30.forEach(p=>{const k=p.method||'Otro';by[k]=(by[k]||0)+Number(p.amount||0)});const supplierOrders=Array.isArray(settings().retailSupplierOrders)?settings().retailSupplierOrders:[],payables=Array.isArray(settings().retailPayables)?settings().retailPayables:[],pending=payables.filter(x=>!['paid','Pagado'].includes(x.status)).reduce((n,x)=>n+Number(x.balance??x.amount??0),0);return shell(`<div class="hero"><div><h1>Dinero</h1><p>Cómo entra y qué queda pendiente.</p></div></div><div class="grid3">${Object.entries(by).slice(0,3).map(([k,v])=>kpi(k,money(v),'Últimos 30 días')).join('')||kpi('Ventas cobradas',money(0))}</div><section class="section"><h2>Cuentas por pagar</h2><div class="grid3">${kpi('Pendiente proveedores',money(pending))}${kpi('Pedidos proveedor',String(supplierOrders.length))}${kpi('Por cobrar clientes',money(totalReceivable()))}</div></section><div class="notice section">Para contabilidad formal y conciliación bancaria seguimos manteniendo el alcance fuera de la beta. Este panel resume la operación del negocio.</div>`)}
function weekly(){const arr=[];for(let i=6;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const k=dayKey(d),total=activeSales().filter(s=>dayKey(s.created_at)===k).reduce((n,s)=>n+Number(s.total||0),0);arr.push({d,total,label:d.toLocaleDateString('es-CR',{weekday:'short'})})}return arr}
function renderWeek(){const w=weekly(),max=Math.max(1,...w.map(x=>x.total)),sum=w.reduce((n,x)=>n+x.total,0);return shell(`<div class="hero"><div><h1>Mi semana</h1><p>Una vista simple de los últimos 7 días.</p></div></div><div class="card">${w.map(x=>`<div class="barrow"><strong>${esc(x.label)}</strong><div class="bar"><i style="width:${Math.max(2,x.total/max*100)}%"></i></div><strong style="text-align:right">${money(x.total)}</strong></div>`).join('')}</div><div class="grid3 section">${kpi('Total semana',money(sum))}${kpi('Promedio diario',money(sum/7))}${kpi('Mejor día',money(Math.max(...w.map(x=>x.total))))}</div>`)}
function opportunities(){const out=[];const w=weekly(),best=w.slice().sort((a,b)=>b.total-a.total)[0];if(best?.total>0)out.push(`Tu mejor día de los últimos 7 días fue ${best.label} con ${money(best.total)}.`);const low=data.products.filter(p=>Number(p.min_stock||0)>0&&Number(p.stock||0)<=Number(p.min_stock||0));if(low.length)out.push(`Tienes ${low.length} producto${low.length===1?'':'s'} con stock bajo o agotado.`);const receivable=totalReceivable();if(receivable>0)out.push(`Hay ${money(receivable)} pendientes de clientes a crédito. Puedes dar seguimiento desde la app.`);const orders=Array.isArray(settings().retailSupplierOrders)?settings().retailSupplierOrders.filter(o=>o.status!=='received'):[];if(orders.length)out.push(`Tienes ${orders.length} pedido${orders.length===1?'':'s'} a proveedor todavía pendiente${orders.length===1?'':'s'} de recibir.`);if(!out.length)out.push('No detectamos alertas importantes con los datos sincronizados actuales.');return out}
function renderOpportunities(){return shell(`<div class="hero"><div><h1>Oportunidades</h1><p>Recomendaciones basadas en tus datos reales.</p></div></div><div class="list">${opportunities().map((x,i)=>`<div class="opp"><strong>${i===0?'Oportunidad de hoy':'También revisa esto'}</strong><p>${esc(x)}</p></div>`).join('')}</div><div class="notice section">PUNTO YA CR prepara recomendaciones; el dueño decide qué acción tomar. No se publican promociones automáticamente.</div>`)}
function renderTeam(){const rows=[...data.members,...data.employees].map(x=>({name:x.display_name||x.email||'Colaborador',role:x.role||'employee',code:x.employee_code||x.code_number||''}));return shell(`<div class="hero"><div><h1>Equipo</h1><p>Personas vinculadas al negocio.</p></div></div><div class="list">${rows.length?rows.map(r=>`<div class="row"><div><strong>${esc(r.name)}</strong><small>${esc(r.role)}</small></div><strong>${r.code?`CR${esc(r.code)}`:''}</strong></div>`).join(''):`<div class="card empty">No hay colaboradores sincronizados.</div>`}</div><div class="notice section">La administración completa de permisos seguirá protegida por las reglas de Supabase. El panel nunca usa una clave service_role.</div>`)}
function renderPro(){return shell(`<div class="hero"><div><h1>PUNTO YA CR PRO</h1><p>Protege, administra y haz crecer tu negocio.</p></div><span class="pill pro">${planLabel()}</span></div><div class="grid3"><div class="card"><strong>☁️ Nube y seguridad</strong><p class="muted">Respaldo, sincronización, recuperación, varios dispositivos y equipo.</p></div><div class="card"><strong>🧾 Facturación electrónica</strong><p class="muted">Preparación para Hacienda 4.4, CAByS, impuestos y comprobantes. La transmisión oficial todavía está pendiente.</p></div><div class="card"><strong>📈 Crecimiento</strong><p class="muted">Metas, semana, oportunidades, clientes, inventario y recomendaciones basadas en datos.</p></div></div><section class="section"><div class="card"><h2 style="margin-top:0">Funciones actuales de PRO</h2><p class="muted">Panel del Emprendedor, nube/sincronización, empleados y permisos, análisis de ventas, crecimiento, configuración fiscal avanzada, reportes y respaldo.</p><div class="notice">El cobro automático de PRO todavía no está conectado en esta beta. Ningún botón de este panel realiza un cargo.</div></div></section>`)}
function renderSettings(){const s=settings(),logo=s.businessLogoDataUrl||'';return shell(`<div class="hero"><div><h1>Configuración</h1><p>Administración del negocio desde el Panel.</p></div></div><div class="card"><h2 style="margin-top:0">Identidad del negocio</h2><div class="form"><div class="field"><label>Nombre del negocio</label><input id="bizName" value="${esc(business?.name||'')}"></div><div class="field"><label>WhatsApp</label><input id="bizWa" value="${esc(s.whatsapp||'')}"></div><div class="field"><label>Teléfono</label><input id="bizPhone" value="${esc(s.phone||'')}"></div><div class="field"><label>Impresora térmica</label><select id="printerWidth"><option value="80" ${String(s.printerWidth||'80')==='80'?'selected':''}>80 mm</option><option value="58" ${String(s.printerWidth||'80')==='58'?'selected':''}>58 mm</option></select></div></div><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:16px"><div class="logo-preview" id="logoPreview">${logo?`<img src="${esc(logo)}" alt="Logo negocio">`:'Sin logo'}</div><div><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp"><p class="muted" style="font-size:12px;max-width:480px">Se reduce automáticamente para usarlo en comprobantes, PDFs y documentos sin hacer pesada la app.</p></div></div><div class="actions" style="margin-top:18px;justify-content:flex-start"><button class="btn primary" id="saveSettings">Guardar cambios</button><button class="btn ghost" id="removeLogo">Quitar logo</button></div><div id="saveStatus" class="status hidden"></div></div><section class="section"><div class="card"><h2 style="margin-top:0">Factura electrónica</h2><p class="muted">Estado actual: ${s.fiscalUsesEInvoice?'Activada para preparación':'No activada'}. La integración oficial con Hacienda 4.4 sigue pendiente de credenciales y firma.</p><div class="notice">Las credenciales, llave criptográfica y PIN de Hacienda nunca deben guardarse en este archivo, el navegador ni el APK.</div></div></section>`)}
function renderBusiness(){const s=settings(),orders=Array.isArray(s.retailSupplierOrders)?s.retailSupplierOrders:[],payables=Array.isArray(s.retailPayables)?s.retailPayables:[];return shell(`<div class="hero"><div><h1>Mi negocio</h1><p>Identidad y estado general de PUNTO YA CR.</p></div><span class="pill ${planLabel()==='PRO'?'pro':''}">${planLabel()}</span></div><div class="grid3">${kpi('Tipo',business?.business_type==='products'?'Retail':'Restaurante')}${kpi('Productos',String(data.products.length))}${kpi('Clientes',String(data.clients.length))}</div><section class="section"><div class="card"><h2 style="margin-top:0">${esc(business?.name||'PUNTO YA CR')}</h2><p class="muted">${esc(s.phone||'Sin teléfono')} ${s.whatsapp?`· WhatsApp ${esc(s.whatsapp)}`:''}</p><p class="muted">Impresora térmica: ${esc(String(s.printerWidth||'80'))} mm</p><div class="grid3 section">${kpi('Pedidos proveedor',String(orders.length))}${kpi('Por pagar',money(payables.filter(x=>!['paid','Pagado'].includes(x.status)).reduce((n,x)=>n+Number(x.balance??x.amount??0),0)))}${kpi('Por cobrar',money(totalReceivable()))}</div></div></section>`)}
function monthSales(){const d=new Date(),start=new Date(d.getFullYear(),d.getMonth(),1).getTime();return activeSales().filter(s=>new Date(s.created_at).getTime()>=start).reduce((n,s)=>n+Number(s.total||0),0)}
function renderGoals(){const target=Math.max(0,Number(settings().panelMonthlySalesGoal||0)),actual=monthSales(),pct=target>0?Math.min(999,actual/target*100):0;return shell(`<div class="hero"><div><h1>Metas</h1><p>Una meta sencilla para saber si el negocio avanza como esperas.</p></div></div><div class="grid3">${kpi('Ventas del mes',money(actual))}${kpi('Meta mensual',target?money(target):'Sin definir')}${kpi('Cumplimiento',target?`${pct.toFixed(0)}%`:'—')}</div><section class="section"><div class="card"><h2 style="margin-top:0">Meta mensual de ventas</h2><div class="field"><label>Monto</label><input id="monthlyGoal" type="number" min="0" value="${target}" inputmode="decimal"></div><button class="btn primary" id="saveGoal" style="margin-top:12px">Guardar meta</button><div id="goalStatus" class="status hidden"></div></div></section>`)}
async function saveGoal(){const box=$('#goalStatus');try{box.className='status';box.textContent='Guardando…';const next={...settings(),panelMonthlySalesGoal:Math.max(0,Number($('#monthlyGoal').value||0))};const {data:r,error}=await sb.from('businesses').update({settings:next,updated_at:new Date().toISOString()}).eq('id',business.id).select('*').single();if(error)throw error;business=r;box.textContent='Meta guardada.';setTimeout(render,450)}catch(e){console.error(e);box.className='status error';box.textContent='No se pudo guardar la meta.'}}
function renderGrowth(){const op=opportunities(),actual=monthSales(),target=Math.max(0,Number(settings().panelMonthlySalesGoal||0)),gap=Math.max(0,target-actual);return shell(`<div class="hero"><div><h1>Haz crecer tu negocio</h1><p>Datos convertidos en acciones sencillas. Tú decides qué aplicar.</p></div><span class="pill pro">PRO</span></div><div class="grid3">${kpi('Ventas del mes',money(actual))}${kpi('Faltante a meta',target?money(gap):'Define una meta')}${kpi('Oportunidades',String(op.length))}</div><section class="section"><h2>Qué revisar ahora</h2><div class="list">${op.map((x,i)=>`<div class="opp"><strong>${i===0?'Prioridad':'Oportunidad'}</strong><p>${esc(x)}</p></div>`).join('')}</div></section><div class="notice section">PUNTO YA CR no publica promociones ni toma decisiones automáticamente. El dueño confirma cada acción.</div>`)}
function askPointYaAnswer(kind){const s30=salesSince(30),gross=s30.reduce((n,s)=>n+Number(s.total||0),0),low=data.products.filter(p=>Number(p.min_stock||0)>0&&Number(p.stock||0)<=Number(p.min_stock||0));if(kind==='sales')return `En los últimos 30 días registraste ${s30.length} ventas por ${money(gross)}. Tu ticket promedio fue ${money(s30.length?gross/s30.length:0)}.`;if(kind==='stock')return low.length?`Tienes ${low.length} producto${low.length===1?'':'s'} que necesitan reposición. Revisa primero: ${low.slice(0,5).map(p=>p.name).join(', ')}.`:'No detecto productos por debajo del stock mínimo configurado.';if(kind==='credit')return `Actualmente tienes ${money(totalReceivable())} por cobrar a clientes.`;if(kind==='week'){const w=weekly(),best=w.slice().sort((a,b)=>b.total-a.total)[0];return best?.total?`Tu mejor día de los últimos 7 días fue ${best.label} con ${money(best.total)}.`:'Todavía no hay suficientes ventas esta semana para comparar.';}return 'Elige una pregunta rápida para analizar tus datos.'}
function renderAsk(){return shell(`<div class="hero"><div><h1>Pregúntale a PUNTO YA</h1><p>Asistente de datos para entender tu negocio sin reportes complicados.</p></div><span class="pill">BETA</span></div><div class="card"><div class="actions" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn ghost" data-ask="sales">¿Cómo voy en ventas?</button><button class="btn ghost" data-ask="stock">¿Qué debo reponer?</button><button class="btn ghost" data-ask="credit">¿Cuánto me deben?</button><button class="btn ghost" data-ask="week">¿Cuál fue mi mejor día?</button></div><div id="askAnswer" class="notice section">Elige una pregunta. Esta beta responde usando únicamente los datos de tu negocio.</div></div>`)}
function render(){const map={business:renderBusiness,home:renderHome,sales:renderSales,inventory:renderInventory,clients:renderClients,money:renderMoney,goals:renderGoals,week:renderWeek,opportunities:renderOpportunities,growth:renderGrowth,ask:renderAsk,team:renderTeam,pro:renderPro,settings:renderSettings};$('#root').innerHTML=(map[view]||renderHome)();bind();}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.nav;render()}));$('#goApp')?.addEventListener('click',()=>location.href='index.html');$('#logout')?.addEventListener('click',async()=>{await sb.auth.signOut();location.href='index.html'});$('#saveSettings')?.addEventListener('click',saveBusinessSettings);$('#removeLogo')?.addEventListener('click',()=>{pendingLogo='';const p=$('#logoPreview');if(p)p.textContent='Sin logo'});$('#logoFile')?.addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{pendingLogo=await resizeLogo(f);$('#logoPreview').innerHTML=`<img src="${esc(pendingLogo)}" alt="Logo negocio">`}catch(err){alert(err.message||'No se pudo procesar el logo')}});$('#saveGoal')?.addEventListener('click',saveGoal);document.querySelectorAll('[data-ask]').forEach(b=>b.addEventListener('click',()=>{const box=$('#askAnswer');if(box)box.textContent=askPointYaAnswer(b.dataset.ask)}))}
let pendingLogo=null;
async function resizeLogo(file){if(!file.type.startsWith('image/'))throw new Error('Selecciona una imagen.');if(file.size>5*1024*1024)throw new Error('El logo debe pesar menos de 5 MB.');const src=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});const maxW=520,maxH=240,scale=Math.min(1,maxW/img.width,maxH/img.height),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/png',.9)}
async function saveBusinessSettings(){const box=$('#saveStatus');try{box.className='status';box.textContent='Guardando…';const old=settings(),next={...old,whatsapp:$('#bizWa').value.trim(),phone:$('#bizPhone').value.trim(),printerWidth:$('#printerWidth').value,businessLogoDataUrl:pendingLogo===null?(old.businessLogoDataUrl||''):pendingLogo};const name=$('#bizName').value.trim()||'PUNTO YA CR';const {data:r,error}=await sb.from('businesses').update({name,settings:next,updated_at:new Date().toISOString()}).eq('id',business.id).select('*').single();if(error)throw error;business=r;pendingLogo=null;box.textContent='Configuración guardada.';setTimeout(render,500)}catch(e){console.error(e);box.className='status error';box.textContent='No se pudo guardar. Revisa los permisos del negocio.'}}
async function loadAll(){const b=business.id;const q=[sb.from('sales').select('*').eq('business_id',b).order('created_at',{ascending:false}).limit(1000),sb.from('sale_items').select('*').eq('business_id',b).limit(5000),sb.from('payments').select('*').eq('business_id',b).order('created_at',{ascending:false}).limit(2000),sb.from('credit_movements').select('*').eq('business_id',b).order('created_at',{ascending:false}).limit(2000),sb.from('products').select('*').eq('business_id',b).eq('active',true).order('name',{ascending:true}),sb.from('clients').select('*').eq('business_id',b).eq('active',true).order('name',{ascending:true}),sb.from('orders').select('*').eq('business_id',b).order('created_at',{ascending:false}).limit(500),sb.from('business_members').select('business_id,user_id,role,display_name,email,active,employee_code').eq('business_id',b).eq('active',true),sb.from('business_employees').select('id,business_id,code_number,display_name,permissions').eq('business_id',b)];const r=await Promise.all(q);for(const x of r){if(x.error)console.warn(x.error)}[data.sales,data.saleItems,data.payments,data.credits,data.products,data.clients,data.orders,data.members,data.employees]=r.map(x=>x.data||[])}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){return showAuth()}user=session.user;let m=null;const mr=await sb.from('business_members').select('*').eq('user_id',user.id).eq('active',true).order('created_at',{ascending:true}).limit(1);if(!mr.error)m=mr.data?.[0]||null;let b=null;if(m){const br=await sb.from('businesses').select('*').eq('id',m.business_id).maybeSingle();if(!br.error)b=br.data}else{const br=await sb.from('businesses').select('*').eq('owner_user_id',user.id).order('created_at',{ascending:true}).limit(1);if(!br.error)b=br.data?.[0]||null}if(!b)return showMessage('No encontramos un negocio vinculado a esta cuenta.','Abre PUNTO YA CR y termina la configuración del negocio.');membership=m||{role:'owner'};if(!['owner','admin'].includes(membership.role||'owner'))return showMessage('Acceso restringido','El Panel del Emprendedor está reservado para el Dueño o administración autorizada.');business=b;await loadAll();render()}
function showMessage(title,msg){$('#root').innerHTML=`<div class="auth"><div class="card"><img src="logo-horizontal.png" alt="PUNTO YA CR" style="max-width:220px"><h1>${esc(title)}</h1><p>${esc(msg)}</p><button class="btn primary" onclick="location.href='index.html'">Volver a la app</button></div></div>`}
function showAuth(){$('#root').innerHTML=`<div class="auth"><div class="card"><img src="logo-horizontal.png" alt="PUNTO YA CR" style="max-width:220px"><h1>Panel del Emprendedor</h1><p>Usa la misma cuenta de PUNTO YA CR.</p><button class="btn primary" id="googleLogin" style="width:100%">Continuar con Google</button><div style="text-align:center;color:var(--muted);margin:14px 0">o</div><div class="field"><label>Correo</label><input id="email" type="email"></div><div class="field" style="margin-top:10px"><label>Contraseña</label><input id="pass" type="password"></div><button class="btn ghost" id="emailLogin" style="width:100%;margin-top:12px">Entrar con correo</button><div id="authStatus" class="status hidden"></div><button class="btn" style="width:100%;margin-top:10px" onclick="location.href='index.html'">Volver a PUNTO YA CR</button></div></div>`;$('#googleLogin').onclick=async()=>{const redirect=new URL('panel.html',location.href).href;await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:redirect}})};$('#emailLogin').onclick=async()=>{const st=$('#authStatus');st.className='status';st.textContent='Entrando…';const {error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#pass').value});if(error){st.className='status error';st.textContent=error.message;return}location.reload()}}
init().catch(e=>{console.error(e);showMessage('No se pudo abrir el panel','Revisa la conexión y los permisos de Supabase.')});
</script>
</body>
</html>
