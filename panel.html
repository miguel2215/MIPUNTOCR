.fiscal-steps{display:grid;gap:10px}.fiscal-step{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--line);border-radius:15px;background:#fff}.fiscal-step b{display:block}.fiscal-step small{display:block;color:var(--muted);margin-top:3px;line-height:1.35}.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#e9eeec;font-weight:900;flex:0 0 auto}.dot.ok{background:#daf6e7;color:#20663e}.dot.warn{background:#fff3d6;color:#8a5a00}.secure-box{border:1px solid #cfe9e1;background:#f7fcfa;border-radius:18px;padding:16px}.secure-box h3{margin:0 0 6px}.secure-row{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid #deebe7}.secure-row:last-child{border-bottom:0}.secure-row span{color:var(--muted)}.status.ok{background:#e8f8ef;color:#23653d}.status.warn{background:#fff7df;color:#785700}.fiscal-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.secret-note{font-size:12px;color:var(--muted);line-height:1.45}.danger-note{border:1px solid #f0d5d1;background:#fff8f7;border-radius:15px;padding:12px;color:#7d3b34}.version-chip{font-size:10px;color:var(--muted);font-weight:800}

<body>
<div id="root"></div>
<script>
const SUPABASE_URL='https://uspycwpztzkenwsevvrp.supabase.co';
const SUPABASE_KEY='sb_publishable_gRxzhxgEe3WnqSfA-fn6_w_nOtQ7sDy';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});
let user=null,business=null,membership=null,data={sales:[],saleItems:[],payments:[],credits:[],products:[],clients:[],orders:[],members:[],employees:[]};
let view='home';
const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=n=>new Intl.NumberFormat('es-CR',{style:'currency',currency:'CRC',maximumFractionDigits:0}).format(Number(n||0));
const dt=v=>v?new Date(v).toLocaleString('es-CR',{dateStyle:'short',timeStyle:'short'}):'—';
const dayKey=v=>{const d=new Date(v);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const settings=()=>business?.settings&&typeof business.settings==='object'?business.settings:{};
function planLabel(){return String(settings().planTier||'free').toLowerCase()==='pro'?'PRO':'FREE'}
function activeSales(){return data.sales.filter(s=>s.status!=='voided'&&!s.hidden_from_sales)}
function salesSince(days){const t=Date.now()-days*86400000;return activeSales().filter(s=>new Date(s.created_at).getTime()>=t)}
function creditBalance(clientId){return data.credits.filter(m=>m.client_id===clientId).reduce((n,m)=>{const a=Number(m.amount||0);if(m.movement_type==='credit_sale')return n+a;if(m.movement_type==='payment'||m.movement_type==='void')return n-a;return n},0)}
function totalReceivable(){return data.clients.reduce((n,c)=>n+Math.max(0,creditBalance(c.id)),0)}
function todaySales(){const k=dayKey(new Date());return activeSales().filter(s=>dayKey(s.created_at)===k)}
function productNameById(id){return data.products.find(p=>p.id===id)?.name||''}
function navButton(id,label){return `<button data-nav="${id}" class="${view===id?'active':''}">${label}</button>`}
function shell(content){const logo=settings().businessLogoDataUrl||'logo-horizontal.png';const pro=planLabel()==='PRO';return `<div class="app"><header class="top"><div class="topin"><div class="brand"><img src="${esc(logo)}" alt="Logo"><div><div class="brand-name-line"><strong>${esc(business?.name||'PUNTO YA CR')}</strong>${pro?'<span class="brand-pro-badge">★ PRO</span>':''}</div><small>Panel del Emprendedor</small></div></div><div class="actions"><span class="pill ${pro?'pro':''}">${pro?'★ PRO':'FREE'}</span><button class="btn ghost" id="goApp">Abrir app</button><button class="btn danger" id="logout">Salir</button></div></div></header><div class="layout"><aside class="nav">${navButton('business','Mi negocio')}${navButton('home','Hoy')}${navButton('sales','Ventas')}${navButton('inventory','Inventario')}${navButton('clients','Clientes')}${navButton('money','Dinero')}${navButton('goals','Metas')}${navButton('week','Mi semana')}${navButton('opportunities','Oportunidades')}${navButton('growth','Haz crecer')}${navButton('ask','Pregúntale a PUNTO YA')}${navButton('team','Equipo')}${navButton('pro','PRO')}${navButton('settings','Configuración')}</aside><main class="main">${content}</main></div></div>`}
function kpi(label,value,sub=''){return `<div class="card metric"><span>${esc(label)}</span><strong>${value}</strong>${sub?`<small class="muted">${esc(sub)}</small>`:''}</div>`}
function renderHome(){const ts=todaySales(),s30=salesSince(30),grossToday=ts.reduce((n,s)=>n+Number(s.total||0),0),gross30=s30.reduce((n,s)=>n+Number(s.total||0),0),avg=s30.length?gross30/s30.length:0,low=data.products.filter(p=>Number(p.stock||0)>0&&Number(p.min_stock||0)>0&&Number(p.stock||0)<=Number(p.min_stock||0)).length,out=data.products.filter(p=>Number(p.stock||0)<=0).length,recent=activeSales().slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,8);return shell(`<div class="hero"><div><h1>Así va tu negocio hoy</h1><p>${new Date().toLocaleDateString('es-CR',{weekday:'long',day:'numeric',month:'long'})}</p></div><span class="pill">${business?.business_type==='products'?'Retail':'Restaurante'}</span></div><div class="grid4">${kpi('Ventas hoy',money(grossToday),`${ts.length} ventas`)}${kpi('Últimos 30 días',money(gross30),`${s30.length} ventas`)}${kpi('Ticket promedio',money(avg))}${kpi('Por cobrar',money(totalReceivable()))}</div><div class="grid3 section">${kpi('Productos',String(data.products.length))}${kpi('Stock bajo',String(low))}${kpi('Agotados',String(out))}</div><section class="section"><h2>Ventas recientes</h2><div class="list">${recent.length?recent.map(s=>`<div class="row"><div><strong>#${esc(s.receipt_number||s.local_number||'—')}</strong><small>${dt(s.created_at)} · ${esc(s.payment_method||'')}</small></div><strong>${money(s.total)}</strong></div>`).join(''):`<div class="card empty">Todavía no hay ventas sincronizadas.</div>`}</div></section>`)}
function renderSales(){const rows=activeSales().slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));const s30=salesSince(30),gross=s30.reduce((n,s)=>n+Number(s.total||0),0);return shell(`<div class="hero"><div><h1>Ventas</h1><p>Historial y comportamiento comercial.</p></div></div><div class="grid3">${kpi('30 días',money(gross))}${kpi('Transacciones',String(s30.length))}${kpi('Ticket promedio',money(s30.length?gross/s30.length:0))}</div><section class="section"><div class="tablewrap"><table class="table"><thead><tr><th>Fecha</th><th>Comprobante</th><th>Pago</th><th>Origen</th><th style="text-align:right">Total</th></tr></thead><tbody>${rows.slice(0,200).map(s=>`<tr><td>${dt(s.created_at)}</td><td>#${esc(s.receipt_number||s.local_number||'—')}</td><td>${esc(s.payment_method||'—')}</td><td>${esc(s.order_type||s.sale_type||'—')}</td><td class="num">${money(s.total)}</td></tr>`).join('')||`<tr><td colspan="5" class="empty">Sin ventas.</td></tr>`}</tbody></table></div></section>`)}
function renderInventory(){const inv=data.products.filter(p=>p.active!==false),invested=inv.reduce((n,p)=>n+Number(p.cost||0)*Math.max(0,Number(p.stock||0)),0),potential=inv.reduce((n,p)=>n+Number(p.price||0)*Math.max(0,Number(p.stock||0)),0);return shell(`<div class="hero"><div><h1>Inventario</h1><p>Existencias, costo y alertas.</p></div></div><div class="grid3">${kpi('Mercadería',money(invested))}${kpi('Venta potencial',money(potential))}${kpi('Ganancia proyectada',money(Math.max(0,potential-invested)))}</div><section class="section"><div class="tablewrap"><table class="table"><thead><tr><th>Producto</th><th>Stock</th><th>Costo</th><th>Precio</th><th style="text-align:right">Valor</th></tr></thead><tbody>${inv.map(p=>`<tr><td><strong>${esc(p.name)}</strong><br><small class="muted">${esc(p.barcode||p.sku||'')}</small></td><td>${Number(p.stock||0)}${Number(p.min_stock||0)>0&&Number(p.stock||0)<=Number(p.min_stock||0)?' ⚠️':''}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td class="num">${money(Number(p.cost||0)*Math.max(0,Number(p.stock||0)))}</td></tr>`).join('')||`<tr><td colspan="5" class="empty">Sin productos sincronizados.</td></tr>`}</tbody></table></div></section>`)}
function renderClients(){const rows=data.clients.map(c=>({c,b:Math.max(0,creditBalance(c.id))})).sort((a,b)=>b.b-a.b);return shell(`<div class="hero"><div><h1>Clientes</h1><p>Cuentas por cobrar y saldos.</p></div></div><div class="grid3">${kpi('Clientes',String(data.clients.length))}${kpi('Por cobrar',money(totalReceivable()))}${kpi('Con saldo',String(rows.filter(x=>x.b>0).length))}</div><section class="section"><div class="list">${rows.map(({c,b})=>`<div class="row"><div><strong>${esc(c.name||'Cliente')}</strong><small>${esc(c.phone||'Sin teléfono')}</small></div><div style="text-align:right"><strong>${money(b)}</strong><small>${b>0?'Pendiente':'Al día'}</small></div></div>`).join('')||`<div class="card empty">Sin clientes sincronizados.</div>`}</div></section>`)}
function renderMoney(){const p30=data.payments.filter(p=>new Date(p.created_at).getTime()>=Date.now()-30*86400000),by={};p30.forEach(p=>{const k=p.method||'Otro';by[k]=(by[k]||0)+Number(p.amount||0)});const supplierOrders=Array.isArray(settings().retailSupplierOrders)?settings().retailSupplierOrders:[],payables=Array.isArray(settings().retailPayables)?settings().retailPayables:[],pending=payables.filter(x=>!['paid','Pagado'].includes(x.status)).reduce((n,x)=>n+Number(x.balance??x.amount??0),0);return shell(`<div class="hero"><div><h1>Dinero</h1><p>Cómo entra y qué queda pendiente.</p></div></div><div class="grid3">${Object.entries(by).slice(0,3).map(([k,v])=>kpi(k,money(v),'Últimos 30 días')).join('')||kpi('Ventas cobradas',money(0))}</div><section class="section"><h2>Cuentas por pagar</h2><div class="grid3">${kpi('Pendiente proveedores',money(pending))}${kpi('Pedidos proveedor',String(supplierOrders.length))}${kpi('Por cobrar clientes',money(totalReceivable()))}</div></section><div class="notice section">Para contabilidad formal y conciliación bancaria seguimos manteniendo el alcance fuera de la beta. Este panel resume la operación del negocio.</div>`)}
function weekly(){const arr=[];for(let i=6;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const k=dayKey(d),total=activeSales().filter(s=>dayKey(s.created_at)===k).reduce((n,s)=>n+Number(s.total||0),0);arr.push({d,total,label:d.toLocaleDateString('es-CR',{weekday:'short'})})}return arr}
function renderWeek(){const w=weekly(),max=Math.max(1,...w.map(x=>x.total)),sum=w.reduce((n,x)=>n+x.total,0);return shell(`<div class="hero"><div><h1>Mi semana</h1><p>Una vista simple de los últimos 7 días.</p></div></div><div class="card">${w.map(x=>`<div class="barrow"><strong>${esc(x.label)}</strong><div class="bar"><i style="width:${Math.max(2,x.total/max*100)}%"></i></div><strong style="text-align:right">${money(x.total)}</strong></div>`).join('')}</div><div class="grid3 section">${kpi('Total semana',money(sum))}${kpi('Promedio diario',money(sum/7))}${kpi('Mejor día',money(Math.max(...w.map(x=>x.total))))}</div>`)}

async function resizeLogo(file){if(!file.type.startsWith('image/'))throw new Error('Selecciona una imagen.');if(file.size>5*1024*1024)throw new Error('El logo debe pesar menos de 5 MB.');const src=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});const maxW=520,maxH=240,scale=Math.min(1,maxW/img.width,maxH/img.height),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/png',.9)}

function isOwnerPanel(){return String(membership?.role||'owner').toLowerCase()==='owner'}

function planLabel(){

  const active=tier==='pro'&&(!exp||Number.isNaN(exp.getTime())||exp.getTime()>Date.now());

}

      <div class="field"><label>Tipo de identificación</label><select id="fiscalIdTypeP"><option value="01" ${s.fiscalIdType==='01'?'selected':''}>Cédula física</option><option value="02" ${s.fiscalIdType==='02'?'selected':''}>Cédula jurídica</option><option value="03" ${s.fiscalIdType==='03'?'selected':''}>DIMEX</option><option value="04" ${s.fiscalIdType==='04'?'selected':''}>NITE</option></select></div>
      <div class="field"><label>Número de identificación</label><input id="fiscalIdP" inputmode="numeric" value="${esc(s.fiscalId||'')}"></div>
      <div class="field"><label>Correo para comprobantes</label><input id="fiscalEmailP" type="email" value="${esc(s.fiscalEmail||user?.email||'')}"></div>
      <div class="field"><label>Código de actividad económica</label><input id="fiscalActivityCodeP" inputmode="numeric" value="${esc(s.fiscalEconomicActivityCode||'')}"></div>
      <div class="field"><label>Descripción de actividad</label><input id="fiscalActivityNameP" value="${esc(s.fiscalEconomicActivityName||'')}"></div>
      <div class="field"><label>Sucursal</label><input id="fiscalBranchP" maxlength="3" inputmode="numeric" value="${esc(s.fiscalBranchCode||'001')}"><small class="muted">Casa matriz normalmente inicia en 001.</small></div>
      <div class="field"><label>Punto de venta / caja</label><input id="fiscalTerminalP" maxlength="5" inputmode="numeric" value="${esc(s.fiscalTerminalCode||'00001')}"><small class="muted">Con una sola terminal normalmente inicia en 00001.</small></div>
    </div>
    <button class="btn primary" id="saveFiscalProfile" style="margin-top:14px" ${owner?'':'disabled'}>Guardar datos fiscales</button><div id="fiscalProfileStatus" class="status hidden"></div>
  </section>
  <section class="section secure-box"><h3>🔐 Conexión segura con Hacienda</h3><p class="muted">Las credenciales y la llave de cada negocio se envían directamente al backend seguro. No se guardan en localStorage, IndexedDB ni dentro del APK.</p>
    <div class="secure-row"><span>Ambiente PRE-BETA</span><strong>Pruebas / sandbox</strong></div><div class="secure-row"><span>Estado</span><strong>${esc(conn)}</strong></div>
    ${connected?`<div class="status ok" style="margin-top:12px">✓ Este negocio ya tiene credenciales fiscales protegidas. Puedes probar OAuth sin mostrar los secretos.</div><div class="actions left wrap"><button class="btn primary" id="testHacienda">Probar conexión</button><button class="btn ghost" id="refreshHaciendaStatus">Actualizar estado</button></div>`:
    `<div class="fiscal-grid2 section">
      <div class="field"><label>Usuario de pruebas de Hacienda</label><input id="haciendaUser" autocomplete="off" ${owner?'':'disabled'}></div>
      <div class="field"><label>Contraseña de pruebas</label><input id="haciendaPass" type="password" autocomplete="new-password" ${owner?'':'disabled'}></div>
      <div class="field"><label>PIN de la llave</label><input id="haciendaPin" type="password" inputmode="numeric" maxlength="12" autocomplete="new-password" ${owner?'':'disabled'}></div>
      <div class="field"><label>Llave criptográfica .p12</label><input id="haciendaP12" type="file" accept=".p12,application/x-pkcs12" ${owner?'':'disabled'}></div>
    </div><div class="actions left wrap"><button class="btn primary" id="saveHaciendaCredentials" ${owner?'':'disabled'}>Guardar de forma segura</button><button class="btn ghost" id="refreshHaciendaStatus">Actualizar estado</button></div>`}
    ${!owner?'<p class="muted">Solo el Dueño puede conectar las credenciales fiscales.</p>':''}<div id="haciendaStatus" class="status hidden"></div><p class="secret-note">PUNTO YA CR nunca debe reutilizar sus propias credenciales para facturas de un cliente. Cada emisor conserva su identidad, consecutivos y llave.</p>
  </section>
  <section class="section card"><h2 style="margin-top:0">Flujo 4.4</h2><div class="fiscal-steps">
    <div class="fiscal-step"><span class="dot ${percent===100?'ok':'warn'}">${percent===100?'✓':'1'}</span><div><b>Datos fiscales y CAByS</b><small>Razón social, identificación, actividad, sucursal/caja y códigos por producto.</small></div></div>
    <div class="fiscal-step"><span class="dot ${connected?'ok':'warn'}">${connected?'✓':'2'}</span><div><b>Credenciales y llave por negocio</b><small>Guardadas únicamente en backend cifrado.</small></div></div>
    <div class="fiscal-step"><span class="dot warn">3</span><div><b>XML 4.4 + firma XAdES-EPES</b><small>Se valida en sandbox antes de habilitar producción.</small></div></div>
    <div class="fiscal-step"><span class="dot warn">4</span><div><b>Envío, estado, XML de respuesta y PDF</b><small>Factura, tiquete, notas y REP cuando corresponda.</small></div></div>
  </div><div class="danger-note section"><strong>Producción permanece bloqueada en PRE-BETA.</strong> Primero debemos aprobar las pruebas con Hacienda y QA.</div></section>`);
}
renderSettings=function(){if(settingsSection==='fiscal')return fiscalSettingsV743();return v742RenderSettingsBase();};
async function saveFiscalProfileV743(){
  const box=$('#fiscalProfileStatus');if(!isOwnerPanel()||!box)return;
  const digits=(v,max)=>String(v||'').replace(/\D/g,'').slice(0,max);
  try{box.className='status';box.textContent='Guardando…';const next={...settings(),fiscalOnboardingAsked:true,fiscalUsesEInvoice:true,fiscalLegalName:$('#fiscalLegalNameP')?.value.trim()||'',fiscalIdType:$('#fiscalIdTypeP')?.value||'01',fiscalId:$('#fiscalIdP')?.value.trim()||'',fiscalEmail:$('#fiscalEmailP')?.value.trim()||'',fiscalEconomicActivityCode:$('#fiscalActivityCodeP')?.value.trim()||'',fiscalEconomicActivityName:$('#fiscalActivityNameP')?.value.trim()||'',fiscalBranchCode:digits($('#fiscalBranchP')?.value,3).padStart(3,'0'),fiscalTerminalCode:digits($('#fiscalTerminalP')?.value,5).padStart(5,'0'),fiscalSetupUpdatedAt:new Date().toISOString()};await updateBusinessV742({settings:next});box.className='status ok';box.textContent='Datos fiscales guardados.';setTimeout(render,500)}catch(e){console.error(e);box.className='status error';box.textContent=e?.message||'No se pudieron guardar los datos fiscales.'}
}
function fileToBase64V743(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||'').split(',').pop()||'');r.onerror=()=>reject(r.error||new Error('No se pudo leer la llave.'));r.readAsDataURL(file)})}
async function saveHaciendaCredentialsV743(){
  const box=$('#haciendaStatus');if(!isOwnerPanel()||!box)return;const file=$('#haciendaP12')?.files?.[0],username=$('#haciendaUser')?.value.trim()||'',password=$('#haciendaPass')?.value||'',pin=$('#haciendaPin')?.value||'';
  if(!username||!password||!pin||!file){box.className='status error';box.textContent='Completa usuario, contraseña, PIN y selecciona la llave .p12.';return}
  if(!/\.p12$/i.test(file.name)){box.className='status error';box.textContent='Selecciona el archivo de llave .p12 de Hacienda.';return}
  if(file.size>1500000){box.className='status error';box.textContent='La llave .p12 es demasiado grande para este flujo.';return}
  try{box.className='status';box.textContent='Protegiendo credenciales…';const p12_base64=await fileToBase64V743(file);const {data:r,error}=await sb.functions.invoke('hacienda-credentials',{body:{business_id:business.id,environment:'sandbox',username,password,pin,p12_base64}});if(error)throw error;['haciendaUser','haciendaPass','haciendaPin'].forEach(id=>{const el=$('#'+id);if(el)el.value=''});if($('#haciendaP12'))$('#haciendaP12').value='';box.className='status ok';box.textContent=r?.message||'Credenciales protegidas. Ahora puedes probar la conexión.';await loadV743FiscalSecureStatus();setTimeout(render,700)}catch(e){console.error(e);box.className='status error';box.textContent='No se pudo guardar en el backend fiscal. Verifica que las funciones v7.43 estén desplegadas en Supabase.'}
}
async function testHaciendaConnectionV743(){const box=$('#haciendaStatus');if(!box)return;try{box.className='status';box.textContent='Probando OAuth con Hacienda…';const {data:r,error}=await sb.functions.invoke('hacienda-test-connection',{body:{business_id:business.id,environment:'sandbox'}});if(error)throw error;box.className='status ok';box.textContent=r?.ok?'✓ Conexión de pruebas correcta.':'Hacienda respondió, pero la conexión no quedó validada.'}catch(e){console.error(e);box.className='status error';box.textContent=e?.message||'No se pudo validar la conexión de pruebas.'}}
async function refreshHaciendaStatusV743(){const box=$('#haciendaStatus');if(box){box.className='status';box.textContent='Actualizando…'}await loadV743FiscalSecureStatus();render()}

function bind(){
  document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.nav;if(view==='settings')settingsSection='';render()}));
  document.querySelectorAll('[data-settings]').forEach(b=>b.addEventListener('click',()=>{const key=b.dataset.settings||'';if(key==='pro'){view='pro';settingsSection='pro'}else{view='settings';settingsSection=key}render()}));
  document.querySelectorAll('[data-pro-buy]').forEach(b=>b.addEventListener('click',()=>beginProPurchaseV742(b.dataset.proBuy)));
  $('#goApp')?.addEventListener('click',()=>location.href='index.html');
  const signout=async()=>{await sb.auth.signOut();location.href='index.html'};
  $('#logout')?.addEventListener('click',signout);$('#logoutAccount')?.addEventListener('click',signout);
  $('#saveProfile')?.addEventListener('click',saveBusinessProfile);
  $('#saveBusinessType')?.addEventListener('click',saveBusinessTypeV742);
  $('#chooseLogo')?.addEventListener('click',()=>$('#logoFile')?.click());
  $('#removeLogo')?.addEventListener('click',async()=>{pendingLogo='';const p=$('#logoPreview');if(p)p.innerHTML='<span>Sin logo</span>';await saveBusinessLogo()});
  $('#logoFile')?.addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{pendingLogo=await resizeLogo(f);$('#logoPreview').innerHTML=`<img src="${esc(pendingLogo)}" alt="Logo negocio">`;await saveBusinessLogo()}catch(err){alert(err.message||'No se pudo procesar el logo')}});
  $('#findPrinter')?.addEventListener('click',findPrinterV742);$('#printTest')?.addEventListener('click',printPrinterTestV742);$('#printerOk')?.addEventListener('click',()=>printerCalibrationV742(true));$('#printerNo')?.addEventListener('click',()=>printerCalibrationV742(false));
  $('#activateProCode')?.addEventListener('click',()=>redeemProCodeV742('full'));
  $('#activateProCodeQuick')?.addEventListener('click',()=>redeemProCodeV742('quick'));
  $('#saveFiscalProfile')?.addEventListener('click',saveFiscalProfileV743);$('#saveHaciendaCredentials')?.addEventListener('click',saveHaciendaCredentialsV743);$('#testHacienda')?.addEventListener('click',testHaciendaConnectionV743);$('#refreshHaciendaStatus')?.addEventListener('click',refreshHaciendaStatusV743);
  $('#saveGoal')?.addEventListener('click',saveGoal);document.querySelectorAll('[data-ask]').forEach(b=>b.addEventListener('click',()=>{const box=$('#askAnswer');if(box)box.textContent=askPointYaAnswer(b.dataset.ask)}));
}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){return showAuth()}user=session.user;let m=null;const mr=await sb.from('business_members').select('*').eq('user_id',user.id).eq('active',true).order('created_at',{ascending:true}).limit(1);if(!mr.error)m=mr.data?.[0]||null;let b=null;if(m){const br=await sb.from('businesses').select('*').eq('id',m.business_id).maybeSingle();if(!br.error)b=br.data}else{const br=await sb.from('businesses').select('*').eq('owner_user_id',user.id).order('created_at',{ascending:true}).limit(1);if(!br.error)b=br.data?.[0]||null}if(!b)return showMessage('No encontramos un negocio vinculado a esta cuenta.','Abre PUNTO YA CR y termina la configuración del negocio.');membership=m||{role:'owner'};if(!['owner','admin'].includes(membership.role||'owner'))return showMessage('Acceso restringido','El Panel del Emprendedor está reservado para el Dueño o administración autorizada.');business=b;await Promise.all([loadAll(),loadV742PlanStatus(),loadV743FiscalSecureStatus()]);render()}

init().catch(e=>{console.error(e);showMessage('No se pudo abrir el panel','Revisa la conexión y los permisos de Supabase.')});
</script>

</html>
