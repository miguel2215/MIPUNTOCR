<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#065F5E">
<title>Mi Punto CR</title>
<link rel="manifest" href="manifest.webmanifest">

<style>
:root {
  --bg: #f7f7f3;
  --surface: #ffffff;
  --text: #162B38;
  --muted: #536B79;
  --primary: #11A680;
  --primary-dark: #065F5E;
  --primary-soft: #E8F7F3;
  --line: #e8e9e7;
  --danger: #b42318;
  --danger-soft: #fee4e2;
  --warning: #a15c00;
  --warning-soft: #fff3d6;
  --blue-soft: #eaf2ff;
  --shadow: 0 7px 22px rgba(25, 35, 45, 0.055);
  --radius: 22px;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  overscroll-behavior-y: none;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

#app {
  min-height: 100vh;
}

.shell {
  max-width: 1080px;
  margin: auto;
  padding: 14px 16px 110px;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;

  padding: 9px 0 13px;

  background: rgba(247, 247, 243, 0.95);
  backdrop-filter: blur(12px);
}

.brand h1 {
  margin: 0;
  font-size: 1.42rem;
  line-height: 1.1;
  font-weight: 850;
}

.brand p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 0.92rem;
}

.status-row {
  display: flex;
  gap: 7px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;

  padding: 8px 11px;

  border-radius: 999px;

  font-size: 0.79rem;
  font-weight: 750;

  background: #eceeed;
  color: #525866;
}

.badge.online {
  background: #ddf8e7;
  color: #286638;
}

.badge.offline {
  background: #fee4e2;
  color: #9b261f;
}

.screen-title {
  margin: 14px 0 17px;
}

.screen-title h2 {
  margin: 0;
  font-size: 1.5rem;
}

.screen-title p {
  margin: 5px 0 0;
  color: var(--muted);
  line-height: 1.4;
}

.home-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

.big-card {
  width: 100%;
  min-height: 84px;

  border: 1px solid var(--line);
  border-radius: 21px;

  background: var(--surface);

  padding: 18px 20px;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;

  text-align: left;

  box-shadow: var(--shadow);

  transition:
    transform 0.1s ease,
    background 0.1s ease;
}

.big-card:active {
  transform: scale(0.985);
}

.big-card strong {
  display: block;

  color: var(--text);

  font-size: 1.07rem;
  font-weight: 820;
}

.big-card small {
  display: block;

  margin-top: 5px;

  color: var(--muted);

  font-size: 0.9rem;
  line-height: 1.3;
}

.big-card.primary {
  min-height: 96px;

  background: var(--primary);
  border-color: var(--primary);
}

.big-card.primary strong {
  color: white;
  font-size: 1.16rem;
}

.big-card.primary small {
  color: #daf3ee;
}

.card-arrow {
  flex: 0 0 auto;

  color: #a4a8af;

  font-size: 1.75rem;
  font-weight: 400;
}

.big-card.primary .card-arrow {
  color: rgba(255, 255, 255, 0.82);
}

.panel {
  background: var(--surface);

  border: 1px solid var(--line);
  border-radius: var(--radius);

  padding: 16px;

  box-shadow: var(--shadow);
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;

  margin-bottom: 14px;
}

.btn {
  min-height: 45px;

  border: 0;
  border-radius: 14px;

  padding: 11px 15px;

  background: #eceeed;
  color: var(--text);

  font-weight: 760;
}

.btn.primary {
  background: var(--primary);
  color: white;
}

.btn.primary:active {
  background: var(--primary-dark);
}

.btn.ghost {
  background: white;
  border: 1px solid var(--line);
}

.btn.danger {
  background: var(--danger-soft);
  color: var(--danger);
}

.btn.full {
  width: 100%;
}

.search {
  width: 100%;

  border: 1px solid var(--line);
  border-radius: 15px;

  padding: 14px;

  margin-bottom: 12px;

  background: white;

  outline: none;
}

.search:focus,
.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: #78aaa3;
  box-shadow: 0 0 0 3px rgba(54, 127, 118, 0.09);
}

.sale-layout {
  display: grid;
  gap: 14px;
}

.grid-products {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.product-card {
  min-height: 105px;

  border: 1px solid var(--line);
  border-radius: 18px;

  background: white;

  padding: 14px;

  display: flex;
  flex-direction: column;
  justify-content: space-between;

  box-shadow: 0 4px 13px rgba(0, 0, 0, 0.035);
}

.product-card:active {
  background: #f7fbfa;
}

.product-card button {
  width: 100%;
  height: 100%;

  border: 0;
  padding: 0;

  background: transparent;

  text-align: left;
}

.product-card strong {
  font-size: 1rem;
}

.price {
  margin-top: 8px;

  color: var(--primary);

  font-size: 1.08rem;
  font-weight: 850;
}

.muted {
  color: var(--muted);
}

.cart-list {
  display: grid;
  gap: 5px;
}

.cart-item {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;

  padding: 11px 0;

  border-bottom: 1px solid var(--line);
}

.qty {
  display: flex;
  align-items: center;
  gap: 7px;
}

.qty button {
  width: 35px;
  height: 35px;

  border: 1px solid var(--line);
  border-radius: 11px;

  background: white;

  font-size: 1.05rem;
  font-weight: 850;
}

.total-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;

  margin-top: 14px;

  font-size: 1.23rem;
  font-weight: 850;
}

.payment-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 9px;

  margin-top: 15px;
}

.pay-btn {
  min-height: 57px;

  border: 0;
  border-radius: 17px;

  padding: 15px;

  font-weight: 820;
}

.pay-cash {
  background: #def7e7;
  color: #216b39;
}

.pay-sinpe {
  background: #e6f0ff;
  color: #2764b3;
}

.pay-card {
  background: #efebff;
  color: #6244a6;
}

.pay-credit {
  background: var(--warning-soft);
  color: var(--warning);
}

.list {
  display: grid;
  gap: 10px;
}

.row-card {
  padding: 15px;

  background: white;

  border: 1px solid var(--line);
  border-radius: 18px;
}

.row-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}

.form-grid {
  display: grid;
  gap: 11px;
}

.field {
  display: grid;
  gap: 6px;
}

.field label {
  color: var(--muted);

  font-size: 0.84rem;
  font-weight: 720;
}

.field input,
.field select,
.field textarea {
  width: 100%;

  border: 1px solid var(--line);
  border-radius: 14px;

  padding: 12px 13px;

  background: white;

}

.kpi-grid {

  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
}

.kpi {

  padding: 14px;

  border-radius: 17px;
}

.kpi strong {
  display: block;

  margin-top: 5px;

}

.bottom-nav {

  left: 12px;
  right: 12px;
  bottom: max(8px, env(safe-area-inset-bottom));

  z-index: 40;

  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 5px;

.bottom-nav button {

  border: 0;
  border-radius: 16px;

  background: transparent;

  font-size: 0.8rem;

}

.bottom-nav button.active {

.modal-backdrop {

  inset: 0;

    -apple-system,

.ticket-business {

}

.ticket-business h3 {

}

.ticket-line {

  justify-content: space-between;

.ticket-total {

  font-weight: 850;

.order-builder-products {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;

}

.order-builder-products button {

  border: 1px solid var(--line);
  border-radius: 13px;

  padding: 10px;

  background: white;

  text-align: left;
}

.lock-screen {

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background: var(--bg);
}

.lock-card {
  width: min(420px, 100%);

  padding: 28px 20px;

  background: white;

  border: 1px solid var(--line);
  border-radius: 26px;

  box-shadow: var(--shadow);
}

.lock-card h1 {
  margin: 0;
}

.lock-card p {
  color: var(--muted);
}

.pin-input {
  width: 100%;

  padding: 15px;

  border: 1px solid var(--line);
  border-radius: 15px;

  font-size: 1.2rem;
  text-align: center;
  letter-spacing: 6px;
}

.catalog-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;

  padding: 14px 0;

  border-bottom: 1px solid var(--line);
}

.catalog-card:last-child {
  border-bottom: 0;
}

.offline-note {
  margin-bottom: 13px;

  padding: 11px 13px;

  border-radius: 14px;

  background: #fff2f0;
  color: #922b21;

  font-size: 0.86rem;
}

@media (min-width: 700px) {
  .shell {
    padding-bottom: 105px;
  }

  .home-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .grid-products {
    grid-template-columns: repeat(3, 1fr);
  }

  .sale-layout {
    grid-template-columns: 1.35fr 0.9fr;
  }

  .payment-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .kpi-grid {
    grid-template-columns: repeat(4, 1fr);
  }

  .bottom-nav {
    left: 50%;
    right: auto;

    width: min(680px, calc(100% - 24px));

    transform: translateX(-50%);
  }
}

@media (min-width: 1000px) {

    grid-template-columns: repeat(4, 1fr);
  }
}

<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== core.js ===== */
const DB_NAME = "mipuntocr";
const DB_VERSION = 5;
const STORES = ["products", "clients", "sales", "orders", "cashMoves", "cashSessions", "settings", "creditMoves", "tableAccounts"];

let db;
let screen = "home";
let cart = [];
let locked = false;
let role = "owner"; // owner | admin | employee (se carga desde Supabase)
let activeClientId = "";
let quickCategory = "";
let authStep = "welcome";
let setupDraft = {};
let settingsFormDirty = false;
let saleMeta = { clientId: "", orderType: "Mostrador", table: "", note: "", tableAccountId: "" };

const AUTO_LOCK_MS = 5 * 60 * 1000;
let inactivityTimer = null;
let lastActivityAt = Date.now();

function autoLockEnabled() {
  if (!(state.settings.onboardingComplete && state.settings.sessionActive !== false) || locked) return false;
  if (role === "employee") return true;
  return !!(state.settings.pinEnabled && state.settings.ownerPin);
}
function clearInactivityTimer() {
  if (inactivityTimer) clearTimeout(inactivityTimer);
  inactivityTimer = null;
}
function scheduleInactivityLock() {
  clearInactivityTimer();
  if (!autoLockEnabled()) return;
  const elapsed = Date.now() - lastActivityAt;
  const wait = Math.max(0, AUTO_LOCK_MS - elapsed);
  inactivityTimer = setTimeout(() => checkInactivityLock(), wait);
}
function registerUserActivity() {
  if (locked || state.settings.sessionActive === false) return;
  lastActivityAt = Date.now();
  scheduleInactivityLock();
}
function checkInactivityLock() {
  if (!autoLockEnabled()) { clearInactivityTimer(); return false; }
  if (Date.now() - lastActivityAt < AUTO_LOCK_MS) { scheduleInactivityLock(); return false; }
  window.closeModal?.();
  clearInactivityTimer();
  if (role === "employee" && typeof window.employeeSessionLock === "function") {
    window.employeeSessionLock();
    return true;
  }
  locked = true;
  screen = "home";
  render();
  return true;
}

function isProPlan() {
  const tier = String(state.settings.planTier || "free").toLowerCase();
  if (tier !== "pro") return false;
  const expires = state.settings.planExpiresAt ? new Date(state.settings.planExpiresAt) : null;
  return !expires || Number.isNaN(expires.getTime()) || expires.getTime() > Date.now();
}

function securityLockButton(extraClass = "") {
  return `<button class="lock-top-btn ${extraClass}" onclick="lockApp()" title="Bloquear Mi Punto CR">🔒 <span>Bloquear</span></button>`;
}

const state = {
  products: [],
  clients: [],
  sales: [],
  orders: [],
  cashMoves: [],
  cashSessions: [],
  creditMoves: [],
  tableAccounts: [],
  settings: {
    id: "main",
    businessName: "Mi Punto CR",

function openDB() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = () => {
      for (const name of STORES) {
        if (!r.result.objectStoreNames.contains(name)) r.result.createObjectStore(name, { keyPath: "id" });
      }
    };
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
    r.onblocked = () => {
      const app = document.querySelector("#app");
      if (app && !app.innerHTML.trim()) {
        app.innerHTML = `<section class="onboarding"><div class="onboard-card">${brandHorizontal("brand-logo-horizontal compact")}<h2>Actualizando datos…</h2><p>Espera unos segundos. Si tienes Mi Punto CR abierto en otra pestaña, ciérrala y vuelve aquí.</p></div></section>`;
      }
    };
  });
}
function store(name, mode = "readonly") { return db.transaction(name, mode).objectStore(name); }
function all(name) { return new Promise((res, rej) => { const r = store(name).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); }); }
function put(name, value) { return new Promise((res, rej) => { const r = store(name, "readwrite").put(value); r.onsuccess = () => res(value); r.onerror = () => rej(r.error); }); }
function del(name, id) { return new Promise((res, rej) => { const r = store(name, "readwrite").delete(id); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }
function clearStore(name) { return new Promise((res, rej) => { const r = store(name, "readwrite").clear(); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }
async function resetLocalBusinessCache() {
  for (const name of ["products", "clients", "sales", "orders", "cashMoves", "cashSessions", "creditMoves", "tableAccounts"]) await clearStore(name);
  state.products = [];
  state.clients = [];
  state.sales = [];

  state.cashSessions = [];
  state.creditMoves = [];
  state.tableAccounts = [];
  cart = [];
  activeClientId = "";

  saleMeta = { clientId: "", orderType: "Mostrador", table: "", note: "", tableAccountId: "" };

async function load() {
  for (const name of ["products", "clients", "sales", "orders", "cashMoves", "cashSessions", "creditMoves", "tableAccounts"]) state[name] = await all(name);
  const saved = await all("settings");
  if (saved[0]) state.settings = { ...state.settings, ...saved[0] };
  if (state.settings.businessType === "general") state.settings.businessType = "food";
  if (state.settings.businessType === "retail") state.settings.businessType = "products";
  if (typeof state.settings.sessionActive !== "boolean") state.settings.sessionActive = true;
  role = ["owner","admin","employee"].includes(state.settings.cloudRole) ? state.settings.cloudRole : "owner";

  // v7.9.2: corte limpio a cuentas reales de Supabase.
  // Las cuentas locales anteriores eran solo de prueba; al actualizar se exige
  // iniciar sesión o crear una cuenta real en la nube.
  if (!state.settings.cloudOnlyV792Migrated) {
    state.settings.cloudOnlyV792Migrated = true;
    if (!state.settings.cloudLinked) state.settings.sessionActive = false;
  }

  // Migración v7.6: el impuesto se suma al cobro por defecto.
  // Solo se aplica una vez; después el usuario puede cambiarlo en Configuración.
  if (!state.settings.taxV76Migrated) {
    if (state.settings.taxMode !== "exempt") state.settings.taxMode = "added";
    state.settings.taxV76Migrated = true;
  }

  // Migración v7.5: lo que existía antes queda asociado al tipo de negocio
  // que estaba activo. Desde aquí Restaurante, Artículos y Servicios ya no
  // comparten productos, inventario, ventas ni crédito.
  const legacyType = state.settings.businessType || "food";
  for (const p of state.products) {
    if (!p.businessType) { p.businessType = legacyType; await put("products", p); }
  }
  for (const sale of state.sales) {
    if (!sale.businessType) { sale.businessType = legacyType; await put("sales", sale); }
  }
  for (const move of state.creditMoves) {
    if (!move.businessType) { move.businessType = legacyType; await put("creditMoves", move); }
  }

  await put("settings", state.settings);
}

function badge() { return navigator.onLine ? `<span class="badge online">● En línea</span>` : `<span class="badge offline">● Sin conexión</span>`; }
function navBtn(target, label, active) { return `<button class="${active === target ? "active" : ""}" onclick="go('${target}')">${label}</button>`; }
function desktopNavItems() {
  const items = [["home", "Inicio"], ["sale", isServices() ? "Nuevo servicio" : "Vender"]];
  if (isFood()) items.push(["orders", "Pedidos"], ["tables", "Mesas"], ["products", "Productos"], ["clients", "Clientes / Crédito"], ["cash", "Caja"], ["sales", "Mis ventas"], ["catalog", "Menú QR"]);
  if (isProducts()) items.push(["products", "Productos"], ["clients", "Clientes / Crédito"], ["sales", "Mis ventas"], ["catalog", "Catálogo QR"]);
  if (isServices()) items.push(["products", "Servicios"], ["clients", "Clientes"], ["sales", "Mis ventas"], ["catalog", "Catálogo QR"]);
  if (role === "owner") { if (state.settings.cloudLinked) items.push(["users", "Empleados"]); items.push(["settings", "Configuración"]); }
  return items.filter(([target]) => canAccessScreen(target));
}
function desktopShell(content, active = "home") {
  const current = screen || active;
  const nav = desktopNavItems().map(([target, label]) => `<button class="${current === target ? "active" : ""}" onclick="go('${target}')">${label}</button>`).join("");
  const shift = currentShift();
  return `<div class="desktop-app"><aside class="desktop-sidebar"><div class="desktop-logo">${brandIcon("brand-icon small")}<div><strong>${esc(state.settings.businessName)}</strong><small>Mi Punto CR</small></div></div><nav class="desktop-nav">${nav}</nav><div class="desktop-sidebar-foot">${isFood() ? (shift ? `Caja abierta · ${dateTime(shift.openedAt)}` : "Caja cerrada") : "Listo para cobrar"}</div></aside><main class="desktop-main"><header class="desktop-topbar"><div class="desktop-topbar-title"><strong>${esc(state.settings.businessName)}</strong><span>${isFood() ? (shift ? "Punto de venta · Caja abierta" : "Punto de venta · Caja cerrada") : (isServices() ? "Servicios" : "Punto de venta")}</span></div><div class="desktop-top-actions">${securityLockButton()}<button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ Pantalla completa</button>${badge()}</div></header><div class="desktop-page">${!navigator.onLine ? `<div class="offline-note">Sin conexión. Las funciones internas siguen guardándose en este dispositivo.</div>` : ""}${content}</div></main></div>`;
}
function shell(content, active = "home") {
  if (isDesktopPOS()) return desktopShell(content, active);
  const third = isFood() ? ["orders", "Pedidos"] : ["sales", "Mis ventas"];
  return `<main class="shell">
    <header class="topbar"><div class="brand brand-with-icon">${brandIcon("brand-icon")}<div><h1>${esc(state.settings.businessName)}</h1><p>Mi Punto CR</p></div></div><div class="status-row">${securityLockButton()}${badge()}</div></header>
    ${!navigator.onLine ? `<div class="offline-note">Sin conexión. Las funciones internas siguen guardándose en este dispositivo.</div>` : ""}

  try { await cloudLoadPlanStatus(); } catch (error) { console.error("Plan Pro:", error); }
  try { await cloudSyncCatalogClients({ silent: true }); } catch (error) { console.error("Catálogo inicial:", error); }
  try { await cloudSyncOperations({ silent: true }); } catch (error) { console.error("Operación inicial:", error); }
  return { user: mpCloudUser, business };
}

async function initCloudAuth() {
  if (!initCloudClient()) return false;

  try {
    const { data, error } = await mpCloud.auth.getSession();
    if (error) throw error;

    if (data?.session) {
      await cloudHydrateSession(data.session);
    } else if (navigator.onLine && state.settings.cloudLinked) {
      state.settings.sessionActive = false;
      await put("settings", state.settings);
    }

    if (!mpCloudAuthSubscription) {
      const { data: listener } = mpCloud.auth.onAuthStateChange(async (event, session) => {
        mpCloudSession = session || null;
        mpCloudUser = session?.user || null;

        if (event === "PASSWORD_RECOVERY" && session?.user) {
          mpPasswordRecovery = true;
          state.settings.email = session.user.email || state.settings.email || "";
          state.settings.sessionActive = true;
          try { await put("settings", state.settings); } catch (error) { console.warn("No se pudo guardar el estado de recuperación:", error); }
          if (db && !document.querySelector("#modalRoot")) render();
          return;
        }

        if (session?.user && ["SIGNED_IN", "TOKEN_REFRESHED", "USER_UPDATED", "INITIAL_SESSION"].includes(event)) {
          if (mpEmployeeLoginInProgress && session.user?.is_anonymous) return;
          try {
            await cloudHydrateSession(session);
            if (db && !document.querySelector("#modalRoot")) render();
          } catch (error) {
            console.error("Supabase hydrate:", error);
          }
        }

        if (event === "SIGNED_OUT") {
          mpCloudBusiness = null;
          mpPasswordRecovery = false;
        }
      });
      mpCloudAuthSubscription = listener?.subscription || true;
    }

    return true;
  } catch (error) {
    console.error("Supabase init:", error);
    return false;
  }
}

function cloudInviteCode() {
  const bytes = new Uint8Array(6);
  crypto.getRandomValues(bytes);
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out = "";
  for (const b of bytes) out += chars[b % chars.length];
  return `MP-${out.slice(0,3)}-${out.slice(3)}`;
}

function cloudOperationsConnected() {
  return !!(mpCloud && mpCloudUser && mpCloudBusiness?.id && state.settings.cloudLinked);
}
function cloudUuidLike(value) {
  return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(value || ""));
}
function cloudEnsureId(obj) {
  if (!obj.cloudId) obj.cloudId = cloudUuidLike(obj.id) ? obj.id : cloudUuid();
  return obj.cloudId;
}
function cloudLocalByCloud(list, cloudId) {
  return list.find(item => item.cloudId === cloudId || (cloudUuidLike(item.id) && item.id === cloudId));
}
function cloudClientRemoteId(localId) {
  const item = state.clients.find(c => c.id === localId);
  return item?.cloudId || (cloudUuidLike(item?.id) ? item.id : null);
}
function cloudProductRemoteId(localId) {
  const item = state.products.find(p => p.id === localId);
  return item?.cloudId || (cloudUuidLike(item?.id) ? item.id : null);
}
function cloudShiftRemoteId(localId) {

}
function cloudTableAccountRemoteId(localId) {

  return item?.cloudId || (cloudUuidLike(item?.id) ? item.id : null);
}
function cloudSaleRemoteId(localId) {

}
function cloudMethodToRemote(method) {
  const m = String(method || "").toLowerCase();
  if (m.includes("efect")) return "cash";
  if (m.includes("sinpe")) return "sinpe";
  if (m.includes("tarjeta")) return "card";
  if (m.includes("crédito") || m.includes("credito")) return "credit";
  return "other";
}
function cloudMethodToLocal(method) {
  if (method === "cash") return "Efectivo";
  if (method === "sinpe") return "SINPE";
  if (method === "card") return "Tarjeta/Otro";
  if (method === "credit") return "Crédito";
  return "Tarjeta/Otro";
}
function cloudOrderStatusToRemote(status) {
  const s = String(status || "").toLowerCase();
  if (s.includes("listo")) return "ready";
  if (s.includes("entregado")) return "delivered";
  if (s.includes("cancel")) return "cancelled";
  return "taken";
}
function cloudOrderStatusToLocal(status) {
  if (status === "preparing") return "Listo";
  if (status === "ready") return "Listo";
  if (status === "delivered") return "Entregado";
  if (status === "cancelled") return "Cancelado";
  return "Tomado";
}

// AUDITORÍA + INVENTARIO + NUMERACIÓN V7.12
// =========================================
function cloudSafeJson(value) {
  if (value == null) return null;
  try { return JSON.parse(JSON.stringify(value)); } catch (_) { return null; }
}
function cloudQueueAuditEvent(entity, action, entityType, oldData = null, newData = null) {
  if (!entity) return null;
  if (!Array.isArray(entity.cloudAuditQueue)) entity.cloudAuditQueue = [];
  const event = {
    id: cloudUuid(),
    action: String(action || 'update'),
    entityType: String(entityType || 'record'),
    oldData: cloudSafeJson(oldData),
    newData: cloudSafeJson(newData),
    createdAt: new Date().toISOString()
  };
  entity.cloudAuditQueue.push(event);
  return event.id;
}
function cloudQueueInventoryEvent(entity, detail = {}) {
  if (!entity) return null;
  if (!Array.isArray(entity.cloudInventoryQueue)) entity.cloudInventoryQueue = [];
  const event = {
    id: detail.id || cloudUuid(),
    productLocalId: detail.productLocalId || '',
    movementType: detail.movementType || 'adjustment',
    quantity: Number(detail.quantity || 0),
    previousStock: detail.previousStock == null ? null : Number(detail.previousStock),
    newStock: detail.newStock == null ? null : Number(detail.newStock),
    linkedSale: !!detail.linkedSale,
    notes: detail.notes || '',
    createdAt: detail.createdAt || new Date().toISOString()
  };
  entity.cloudInventoryQueue.push(event);
  return event.id;
}
async function cloudInsertIdempotent(table, payload) {
  const { error } = await mpCloud.from(table).insert(payload);
  if (error && error.code !== '23505') throw error;
  return true;
}
async function cloudFlushAuditQueue(entity) {
  if (!cloudOperationsConnected() || !navigator.onLine || !entity || !Array.isArray(entity.cloudAuditQueue) || !entity.cloudAuditQueue.length) return false;
  const entityId = entity.cloudId || (cloudUuidLike(entity.id) ? entity.id : null);
  const pending = [...entity.cloudAuditQueue];
  for (const event of pending) {
    await cloudInsertIdempotent('audit_log', {
      id: event.id,
      business_id: mpCloudBusiness.id,
      user_id: mpCloudUser.id,
      action: event.action,
      entity_type: event.entityType,
      entity_id: entityId,
      old_data: event.oldData,
      new_data: event.newData,
      created_at: event.createdAt || new Date().toISOString()
    });
    entity.cloudAuditQueue = entity.cloudAuditQueue.filter(x => x.id !== event.id);
  }
  return true;
}
async function cloudFlushInventoryQueue(entity) {
  if (!cloudOperationsConnected() || !navigator.onLine || !entity || !Array.isArray(entity.cloudInventoryQueue) || !entity.cloudInventoryQueue.length) return false;
  const pending = [...entity.cloudInventoryQueue];
  for (const event of pending) {
    const product = state.products.find(p => p.id === event.productLocalId || p.cloudId === event.productLocalId);
    const productId = product?.cloudId || (cloudUuidLike(product?.id) ? product.id : null);
    if (!productId) throw new Error('Producto pendiente de sincronizar antes del movimiento de inventario.');
    const saleId = event.linkedSale ? (entity.cloudId || (cloudUuidLike(entity.id) ? entity.id : null)) : null;
    await cloudInsertIdempotent('inventory_movements', {
      id: event.id,
      business_id: mpCloudBusiness.id,
      product_id: productId,
      movement_type: event.movementType,
      quantity: Number(event.quantity || 0),
      previous_stock: event.previousStock,
      new_stock: event.newStock,
      sale_id: saleId,
      notes: event.notes || null,
      created_by: mpCloudUser.id,
      created_at: event.createdAt || new Date().toISOString()
    });
    entity.cloudInventoryQueue = entity.cloudInventoryQueue.filter(x => x.id !== event.id);
  }
  return true;
}
async function cloudFlushTrackingQueues(entity) {
  await cloudFlushAuditQueue(entity);
  await cloudFlushInventoryQueue(entity);
}
async function cloudAssignOfficialReceiptNumber(sale) {
  if (!cloudOperationsConnected() || !navigator.onLine || !sale) return null;
  if (Number(sale.cloudReceiptNumber || 0) > 0) return Number(sale.cloudReceiptNumber);
  const { data, error } = await mpCloud.rpc('next_receipt_number', { p_business_id: mpCloudBusiness.id });
  if (error) throw error;
  const number = Number(data || 0);
  if (!number) throw new Error('No se pudo obtener el número de comprobante.');
  sale.cloudReceiptNumber = number;
  sale.number = number;
  if (Array.isArray(sale.cloudAuditQueue)) {
    for (const event of sale.cloudAuditQueue) {
      if (event.entityType === 'sale' && event.action === 'create' && event.newData) event.newData.number = number;
    }
  }
  await put('sales', sale);
  return number;
}

  let paidSaleRemoteId = null;
  if (!skipPaidSale && account.paidSaleId) paidSaleRemoteId = cloudSaleRemoteId(account.paidSaleId);
  const remoteOrderIds = (account.orderIds || []).map(local => {
    const order = state.orders.find(o => o.id === local);
    return order?.cloudId || (cloudUuidLike(local) ? local : null);
  }).filter(Boolean);
  const payload = {
    id,
    business_id: mpCloudBusiness.id,
    table_number: Number(account.tableNumber || 0),
    client_id: clientRemoteId,

    items: cloudSerializedItems(account.items || []),
    order_ids: remoteOrderIds,

    opened_at: account.openedAt || new Date().toISOString(),
    paid_at: account.paidAt || null,
    updated_at: account.updatedAt || new Date().toISOString()
  };

  const id = cloudEnsureId(sale);
  await cloudAssignOfficialReceiptNumber(sale);
  const payload = {
    id,
    business_id: mpCloudBusiness.id,
    receipt_number: Number(sale.cloudReceiptNumber || sale.number || 0) || undefined,
    client_id: cloudClientRemoteId(sale.clientId),
    cash_shift_id: cloudShiftRemoteId(sale.shiftId),
    table_id: null,
    business_type: sale.businessType || state.settings.businessType || "food",

    table_number: sale.table ? Number(sale.table) : null,

    voided_by: sale.voided ? mpCloudUser.id : null,
    voided_at: sale.voidedAt || null,
    void_reason: sale.voidReason || null
  };
  const { data, error } = await mpCloud.from("sales").upsert(payload, { onConflict: "id" }).select("id,receipt_number").single();
  if (error) throw error;
  sale.cloudReceiptNumber = data?.receipt_number || sale.cloudReceiptNumber || null;

  for (const item of sale.items || []) {
    if (!item.cloudItemId) item.cloudItemId = cloudUuid();
    const itemPayload = {
      id: item.cloudItemId,
      business_id: mpCloudBusiness.id,
      sale_id: id,
      product_id: cloudProductRemoteId(item.id),
      product_name: item.name || "Producto",
      variant: item.variant || null,
      quantity: Number(item.qty || 0),
      unit_price: Number(item.price || 0),
      subtotal: Number(item.price || 0) * Number(item.qty || 0),
      created_at: sale.createdAt || new Date().toISOString()
    };
    const { error: itemError } = await mpCloud.from("sale_items").upsert(itemPayload, { onConflict: "id" });
    if (itemError) throw itemError;
  }

  if (!sale.cloudPaymentId) sale.cloudPaymentId = cloudUuid();
  const payPayload = {
    id: sale.cloudPaymentId,
    business_id: mpCloudBusiness.id,
    sale_id: id,
    client_id: cloudClientRemoteId(sale.clientId),
    cash_shift_id: cloudShiftRemoteId(sale.shiftId),
    method: cloudMethodToRemote(sale.method),
    amount: Number(sale.total || 0),
    created_by: mpCloudUser.id,
    created_at: sale.createdAt || new Date().toISOString()
  };
  const { error: paymentError } = await mpCloud.from("payments").upsert(payPayload, { onConflict: "id" });
  if (paymentError) throw paymentError;

  if (sale.method === "Crédito" && sale.clientId) {
    if (!sale.cloudCreditMoveId) sale.cloudCreditMoveId = cloudUuid();
    const creditPayload = {
      id: sale.cloudCreditMoveId,
      business_id: mpCloudBusiness.id,
      client_id: cloudClientRemoteId(sale.clientId),
      sale_id: id,
      payment_id: sale.cloudPaymentId,
      movement_type: "credit_sale",
      amount: Number(sale.total || 0),
      notes: sale.note || null,
      created_by: mpCloudUser.id,
      created_at: sale.createdAt || new Date().toISOString()
    };
    const { error: creditError } = await mpCloud.from("credit_movements").upsert(creditPayload, { onConflict: "id" });
    if (creditError) throw creditError;
    if (sale.voided) {
      if (!sale.cloudVoidCreditMoveId) sale.cloudVoidCreditMoveId = cloudUuid();
      const { error: voidError } = await mpCloud.from("credit_movements").upsert({
        id: sale.cloudVoidCreditMoveId,
        business_id: mpCloudBusiness.id,
        client_id: cloudClientRemoteId(sale.clientId),
        sale_id: id,
        payment_id: null,

      }, { onConflict: "id" });
      if (voidError) throw voidError;
    }
  }

  sale.cloudPending = false;
  sale.cloudSyncedAt = new Date().toISOString();
  await cloudFlushTrackingQueues(sale);
  await put("sales", sale);

  if (account) {
    await cloudSaveTableAccount(account);
    await put("tableAccounts", account);
  }
  return id;
}

async function cloudLoadOperationsRemote() {
  if (!cloudOperationsConnected() || !navigator.onLine) return null;
  const b = mpCloudBusiness.id;
  const [shifts, accounts, sales, saleItems, payments, creditMoves, cashMoves, tables, orders, orderItems] = await Promise.all([
    mpCloud.from("cash_shifts").select("*").eq("business_id", b).order("opened_at", { ascending: true }),
    mpCloud.from("table_accounts").select("*").eq("business_id", b).order("opened_at", { ascending: true }),
    mpCloud.from("sales").select("*").eq("business_id", b).order("created_at", { ascending: true }),
    mpCloud.from("sale_items").select("*").eq("business_id", b).order("created_at", { ascending: true }),
    mpCloud.from("payments").select("*").eq("business_id", b).order("created_at", { ascending: true }),
    mpCloud.from("credit_movements").select("*").eq("business_id", b).order("created_at", { ascending: true }),
    mpCloud.from("cash_movements").select("*").eq("business_id", b).order("created_at", { ascending: true }),
    mpCloud.from("restaurant_tables").select("id,table_number").eq("business_id", b),
    mpCloud.from("orders").select("*").eq("business_id", b).order("created_at", { ascending: true }),
    mpCloud.from("order_items").select("*").eq("business_id", b).order("created_at", { ascending: true })
  ]);
  for (const result of [shifts, accounts, sales, saleItems, payments, creditMoves, cashMoves, tables, orders, orderItems]) {
    if (result.error) throw result.error;
  }
  return {
    shifts: shifts.data || [], accounts: accounts.data || [], sales: sales.data || [], saleItems: saleItems.data || [],
    payments: payments.data || [], creditMoves: creditMoves.data || [], cashMoves: cashMoves.data || [], tables: tables.data || [],
    orders: orders.data || [], orderItems: orderItems.data || []
  };
}

async function cloudMergeOperationsRemote(remote) {
  if (!remote) return;
  const clientLocalId = remoteId => cloudLocalByCloud(state.clients, remoteId)?.id || remoteId || "";
  const productLocalId = remoteId => cloudLocalByCloud(state.products, remoteId)?.id || remoteId || "";

  const oldShifts = state.cashSessions.slice();
  const shifts = remote.shifts.map(row => {
    const existing = cloudLocalByCloud(oldShifts, row.id);
    return {
      ...(existing || {}), id: existing?.id || row.id, cloudId: row.id, cloudPending: false,
      opening: Number(row.opening_amount || 0), expected: row.expected_cash == null ? undefined : Number(row.expected_cash),
      counted: row.counted_cash == null ? undefined : Number(row.counted_cash), difference: row.difference == null ? undefined : Number(row.difference),
      openedAt: row.opened_at, closedAt: row.closed_at || "", status: row.status === "closed" ? "closed" : "open", report: row.report || {},
      cloudSyncedAt: row.closed_at || row.opened_at
    };
  });
  const shiftLocalId = remoteId => cloudLocalByCloud(shifts, remoteId)?.id || "";

  const oldAccounts = state.tableAccounts.slice();
  const accounts = remote.accounts.map(row => {
    const existing = cloudLocalByCloud(oldAccounts, row.id);
    return {
      ...(existing || {}), id: existing?.id || row.id, cloudId: row.id, cloudPending: false,
      tableNumber: Number(row.table_number || 0), clientId: clientLocalId(row.client_id), status: row.status === "paid" ? "paid" : "open",
      items: cloudHydratedItems(Array.isArray(row.items) ? row.items : []), note: row.notes || "", total: Number(row.total || 0),
      openedAt: row.opened_at, paidAt: row.paid_at || "", updatedAt: row.updated_at || row.opened_at,
      paidSaleCloudId: row.paid_sale_id || "", remoteOrderIds: Array.isArray(row.order_ids) ? row.order_ids : []
    };
  });
  const accountLocalId = remoteId => cloudLocalByCloud(accounts, remoteId)?.id || "";

  const itemsBySale = new Map();
  for (const item of remote.saleItems) {
    if (!itemsBySale.has(item.sale_id)) itemsBySale.set(item.sale_id, []);
    itemsBySale.get(item.sale_id).push(item);
  }
  const oldSales = state.sales.slice();
  const sales = remote.sales.map(row => {
    const existing = cloudLocalByCloud(oldSales, row.id);
    return {
      ...(existing || {}), id: existing?.id || row.id, cloudId: row.id, cloudPending: false,
      number: Number(row.local_number || row.receipt_number || 0), cloudReceiptNumber: row.receipt_number || null,
      createdAt: row.created_at, shiftId: shiftLocalId(row.cash_shift_id), businessType: row.business_type || state.settings.businessType || "food",
      items: (itemsBySale.get(row.id) || []).map(item => ({
        id: productLocalId(item.product_id), cloudItemId: item.id, name: item.product_name, variant: item.variant || "",
        price: Number(item.unit_price || 0), qty: Number(item.quantity || 0)
      })),
      subtotal: Number(row.subtotal || 0), tax: Number(row.tax || 0), taxMode: row.tax_mode || "added", taxRate: Number(row.tax_rate || 0), total: Number(row.total || 0),
      method: cloudMethodToLocal(row.payment_method), reference: row.payment_reference || "", clientId: clientLocalId(row.client_id),
      received: row.received == null ? null : Number(row.received), change: Number(row.change_amount || 0), orderType: row.order_type || "Mostrador",
      table: row.table_number ? String(row.table_number) : "", tableAccountId: accountLocalId(row.table_account_id), note: row.notes || "",
      employeeId: row.employee_id || "", employeeName: row.employee_name || "", employeeCode: row.employee_code || "",
      voided: row.status === "voided", voidedAt: row.voided_at || "", voidReason: row.void_reason || "",
      hiddenFromSales: !!row.hidden_from_sales, hiddenFromSalesAt: row.hidden_at || "", cloudSyncedAt: row.voided_at || row.created_at
    };
  });
  const saleLocalId = remoteId => cloudLocalByCloud(sales, remoteId)?.id || "";
  for (const acc of accounts) {
    if (acc.paidSaleCloudId) acc.paidSaleId = saleLocalId(acc.paidSaleCloudId);
  }

  const paymentMap = new Map(remote.payments.map(row => [row.id, row]));
  const oldCredits = state.creditMoves.slice();
  const credits = remote.creditMoves.filter(row => row.movement_type === "payment").map(row => {
    const existing = cloudLocalByCloud(oldCredits, row.id);
    const payment = paymentMap.get(row.payment_id);
    return {
      ...(existing || {}), id: existing?.id || row.id, cloudId: row.id, cloudPaymentId: row.payment_id || "", cloudPending: false,
      type: "payment", clientId: clientLocalId(row.client_id), amount: Number(row.amount || 0), method: cloudMethodToLocal(payment?.method),
      note: row.notes || "", createdAt: row.created_at, shiftId: shiftLocalId(payment?.cash_shift_id), businessType: state.settings.businessType || "food",
      cloudSyncedAt: row.created_at
    };
  });

  const oldCashMoves = state.cashMoves.slice();
  const cashMoves = remote.cashMoves.map(row => {
    const existing = cloudLocalByCloud(oldCashMoves, row.id);
    return {
      ...(existing || {}), id: existing?.id || row.id, cloudId: row.id, cloudPending: false,
      type: row.movement_type === "credit_payment" ? "creditPayment" : row.movement_type,
      clientId: clientLocalId(row.client_id), amount: Number(row.amount || 0), method: row.payment_method ? cloudMethodToLocal(row.payment_method) : "Efectivo",
      note: row.notes || "", createdAt: row.created_at, shiftId: shiftLocalId(row.cash_shift_id), cloudSyncedAt: row.created_at
    };
  });

  const tableNumberMap = new Map(remote.tables.map(row => [row.id, Number(row.table_number || 0)]));
  const itemsByOrder = new Map();
  for (const item of remote.orderItems) {
    if (!itemsByOrder.has(item.order_id)) itemsByOrder.set(item.order_id, []);
    itemsByOrder.get(item.order_id).push(item);
  }
  const oldOrders = state.orders.slice();
  const orders = remote.orders.map(row => {
    const existing = cloudLocalByCloud(oldOrders, row.id);
    return {
      ...(existing || {}), id: existing?.id || row.id, cloudId: row.id, cloudPending: false,
      number: Number(row.local_number || 0), tableNumber: tableNumberMap.get(row.table_id) || existing?.tableNumber || 0,
      tableAccountId: accountLocalId(row.table_account_id), customer: "",
      items: (itemsByOrder.get(row.id) || []).map(item => ({
        id: productLocalId(item.product_id), cloudItemId: item.id, name: item.product_name, variant: item.notes || "",
        price: Number(item.unit_price || 0), qty: Number(item.quantity || 0)
      })),
      notes: row.notes || "", status: cloudOrderStatusToLocal(row.status), createdAt: row.created_at, updatedAt: row.updated_at || row.created_at,
      statusHistory: Array.isArray(row.status_history) ? row.status_history : [], preparingAt: row.preparing_at || "", readyAt: row.ready_at || "", deliveredAt: row.delivered_at || "",
      cloudSyncedAt: row.updated_at || row.created_at
    };
  });
  const localOnlyWhatsappOrders = oldOrders.filter(order => order.kind === "whatsapp" && !order.cloudId);
  for (const order of localOnlyWhatsappOrders) {
    if (!orders.some(current => current.id === order.id)) orders.push(order);
  }
  const orderLocalId = remoteId => cloudLocalByCloud(orders, remoteId)?.id || "";
  for (const acc of accounts) acc.orderIds = (acc.remoteOrderIds || []).map(orderLocalId).filter(Boolean);

  for (const [storeName, values] of [["cashSessions", shifts], ["tableAccounts", accounts], ["sales", sales], ["creditMoves", credits], ["cashMoves", cashMoves], ["orders", orders]]) {
    await clearStore(storeName);
    for (const value of values) await put(storeName, value);
    state[storeName] = values;
  }
}

async function cloudSyncOperations({ silent = false } = {}) {
  if (!cloudOperationsConnected() || !navigator.onLine) return false;
  try {
    // Primero subimos cualquier operación local pendiente para no perder trabajo offline.
    for (const shift of state.cashSessions) {
      if (!shift.cloudId || shift.cloudPending) { await cloudSaveCashSession(shift); await put("cashSessions", shift); }
    }
    for (const account of state.tableAccounts) {
      if (!account.cloudId || account.cloudPending) { await cloudSaveTableAccount(account, { skipPaidSale: true }); await put("tableAccounts", account); }
    }
    for (const sale of state.sales) {
      if (!sale.cloudId || sale.cloudPending) await cloudSaveSale(sale);
    }
    for (const move of state.creditMoves) {
      if (move.type === "payment" && (!move.cloudId || move.cloudPending)) { await cloudSaveCreditMove(move); await put("creditMoves", move); }
    }
    for (const move of state.cashMoves) {
      if (!move.cloudId || move.cloudPending) { await cloudSaveCashMove(move); await put("cashMoves", move); }
    }
    for (const order of state.orders) {
      if (!order.cloudId || order.cloudPending) await cloudSaveOrder(order);
    }
    // Segunda pasada de cuentas para enlazar venta pagada / pedidos remotos.
    for (const account of state.tableAccounts) { await cloudSaveTableAccount(account); await put("tableAccounts", account); }

    const remote = await cloudLoadOperationsRemote();
    await cloudMergeOperationsRemote(remote);
    state.settings.operationsCloudV711Ready = true;
    state.settings.operationsLastCloudSyncAt = new Date().toISOString();
    await put("settings", state.settings);
    if (!silent) toast("Operación sincronizada con la nube.");
    return true;
  } catch (error) {
    console.error("Supabase operación:", error);
    if (!silent) toast("No se pudo sincronizar toda la operación. Los cambios quedan pendientes.");
    return false;
  }
}

window.connectCurrentBusinessToCloud = async () => {
  const email = $("#cloudLinkEmail").value.trim().toLowerCase();
  const pass = $("#cloudLinkPass").value;
  const pass2 = $("#cloudLinkPass2").value;
  const button = $("#cloudLinkButton");
  if (!/^\S+@\S+\.\S+$/.test(email)) return toast("Escribe un correo válido.");
  if (pass.length < 6) return toast("La contraseña debe tener al menos 6 caracteres.");
  if (pass !== pass2) return toast("Las contraseñas no coinciden.");
  if (!navigator.onLine) return toast("Necesitas Internet para conectar la nube.");
  if (button) { button.disabled = true; button.textContent = "Guardando…"; }
  try {
    const data = await cloudConnectLegacyBusiness(email, pass);
    state.settings.email = email; state.settings.accountCreated = true; state.settings.guestMode = false;
    state.settings.pendingCloudConfirmation = !data?.session; state.settings.sessionActive = !!data?.session;
    await put("settings", state.settings); closeModal();
    if (data?.session) { toast("Negocio guardado en la nube."); render(); return; }
    authStep = "activation"; renderActivation();
  } catch (error) {
    console.error(error); toast(cloudAuthErrorMessage(error));
    if (button) { button.disabled = false; button.textContent = "Crear cuenta y guardar"; }
  }
};

function totals(subtotal) {
  const rate = Number(state.settings.taxRate || 0), mode = state.settings.taxMode;
  if (mode === "added") return { subtotal, tax: subtotal * rate / 100, total: subtotal * (1 + rate / 100) };
  if (mode === "included" && rate > 0) return { subtotal, tax: subtotal - subtotal / (1 + rate / 100), total: subtotal };
  return { subtotal, tax: 0, total: subtotal };
}
function saleSubtotal() { return cart.reduce((a, b) => a + Number(b.price || 0) * Number(b.qty || 0), 0); }
function clientName(id) { return state.clients.find(x => x.id === id)?.name || ""; }

  if (method === "credit") {
    const opts = state.clients.map(c => `<option value="${c.id}" ${(saleMeta.clientId === c.id) ? "selected" : ""}>${esc(c.name)}</option>`).join("");

window.setCashReceived = (amount, total, kind = "") => {
  const input = $("#received"); if (!input) return;

};

window.finishCredit = async () => {

};

  cloudQueueAuditEvent(c,"create","client",null,{name:c.name,phone:c.phone});
  try{await cloudSaveClientFromApp(c);}catch(error){console.error(error);c.cloudPending=true;}
  await put("clients", c); state.clients.push(c); saleMeta.clientId = c.id; closeModal(); pay("credit");
};

async function saveSale(method, reference = "", clientId = "", received = null) {
  const t = totals(saleSubtotal());
  const sale = {
    id: uid("sale"),
    number: nextSaleNumber(),
    createdAt: new Date().toISOString(),
    shiftId: currentShift()?.id || null,
    businessType: type(),
    items: cart.map(i => ({ id: i.id, name: i.name, variant: i.variant || "", price: i.price, qty: i.qty })),
    subtotal: t.subtotal,
    tax: t.tax,
    taxMode: state.settings.taxMode,
    taxRate: Number(state.settings.taxRate || 0),
    total: t.total,
    method,
    reference,
    clientId: clientId || "",
    received,
    change: received === null ? 0 : Math.max(0, received - t.total),
    orderType: saleMeta.orderType || "Mostrador",
    table: saleMeta.table || "",
    tableAccountId: saleMeta.tableAccountId || "",
    note: saleMeta.note || "",
    sourceOrderId: saleMeta.sourceOrderId || "",
    sourceOrderNumber: saleMeta.sourceOrderNumber || "",
    customerPhone: saleMeta.sourceOrderPhone || "",
    deliveryAddress: saleMeta.sourceOrderAddress || "",
    employeeId: role === "employee" ? (state.settings.employeeId || "") : "",
    employeeName: role === "employee" ? (state.settings.memberDisplayName || "Empleado") : (state.settings.ownerName || "Dueño"),
    employeeCode: role === "employee" ? Number(state.settings.employeeCode || 0) : null
  };
  cloudQueueAuditEvent(sale,"create","sale",null,{number:sale.number,total:sale.total,method:sale.method,businessType:sale.businessType,clientId:sale.clientId||null,orderType:sale.orderType,table:sale.table||null});
  await put("sales", sale);
  state.sales.push(sale);
  if (!isServices()) {
    for (const item of sale.items) {
      const p = currentProducts().find(x => x.id === item.id);
      if (p) {
        const beforeStock=Number(p.stock||0);
        const afterStock=Math.max(0,beforeStock-Number(item.qty||0));
        item.stockBefore=beforeStock;
        item.stockAfter=afterStock;
        p.stock=afterStock;
        cloudQueueInventoryEvent(sale,{productLocalId:p.id,movementType:"sale",quantity:-Number(item.qty||0),previousStock:beforeStock,newStock:afterStock,linkedSale:true,notes:`Venta #${sale.number}` ,createdAt:sale.createdAt});
        try { await cloudSaveProductFromApp(p); } catch (error) { console.error(error); p.cloudPending = true; }
        await put("products", p);
      }
    }
    await put("sales",sale);
  }
  if (isFood() && sale.orderType === "Mesa" && sale.table) {
    let acc = sale.tableAccountId ? state.tableAccounts.find(a => a.id === sale.tableAccountId) : tableAccount(Number(sale.table));
    if (!acc) {
      acc = { id: uid("table"), tableNumber: Number(sale.table), openedAt: sale.createdAt };
      state.tableAccounts.push(acc);
    }
    acc.status = "paid";
    acc.items = sale.items.map(i => ({ ...i }));
    acc.note = sale.note || "";
    acc.clientId = sale.clientId || "";
    acc.total = sale.total;
    acc.paidSaleId = sale.id;
    acc.paidAt = sale.createdAt;
    acc.updatedAt = sale.createdAt;
    await put("tableAccounts", acc);
    sale.tableAccountId = acc.id;
    await put("sales", sale);
  }
  if (sale.sourceOrderId) {
    const order = state.orders.find(o => o.id === sale.sourceOrderId);
    if (order) {
      const now = new Date().toISOString();
      order.status = "Entregado";
      order.deliveredAt = now;
      order.updatedAt = now;
      order.linkedSaleId = sale.id;
      order.statusHistory = [...(order.statusHistory || []), { status: "Entregado", at: now, saleId: sale.id }];
      await put("orders", order);
      try { await cloudSaveOrderFromApp(order); } catch (error) { console.error(error); order.cloudPending = true; await put("orders", order); }
    }
  }
  try { await cloudSaveSaleFromApp(sale); } catch (error) { console.error(error); sale.cloudPending = true; await put("sales", sale); }
  cart = [];
  resetSaleMeta();
  closeModal();
  showReceipt(sale);
}

function loadExternalScript(src, id) {
  return new Promise((resolve, reject) => {
    const old = document.getElementById(id);
    if (old) {
      if (old.dataset.loaded === "true") return resolve();
      old.addEventListener("load", resolve, { once: true }); old.addEventListener("error", reject, { once: true }); return;
    }
    const script = document.createElement("script"); script.id = id; script.src = src; script.async = true;
    script.onload = () => { script.dataset.loaded = "true"; resolve(); }; script.onerror = reject; document.head.appendChild(script);
  });
}

    pdf.addImage(image, "PNG", 0, 0, pdfWidth, pdfHeight, undefined, "FAST");
    return pdf.output("blob");
  } finally { receipt.remove(); }
}

function salesGroupLabel(key) {
  const today = localDayKey(new Date());
  const y = new Date(); y.setDate(y.getDate()-1);
  if (key === today) return `Hoy · ${new Date(key+"T12:00:00").toLocaleDateString("es-CR")}`;
  if (key === localDayKey(y)) return `Ayer · ${new Date(key+"T12:00:00").toLocaleDateString("es-CR")}`;
  return new Date(key+"T12:00:00").toLocaleDateString("es-CR", { weekday:"long", day:"2-digit", month:"2-digit", year:"numeric" });
}
function groupedSalesHtml(items) {
  if (!items.length) return `<div class="empty">No hay ventas en este período.</div>`;
  const groups = {};
  for (const sale of items) (groups[localDayKey(sale.createdAt)] ||= []).push(sale);
  return Object.keys(groups).sort().reverse().map(key => {
    const daySales = groups[key].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
    const activeTotal = daySales.filter(s=>!s.voided).reduce((a,b)=>a+Number(b.total||0),0);
    const voidedTotal = daySales.filter(s=>s.voided).reduce((a,b)=>a+Number(b.total||0),0);
    const voidedCount = daySales.filter(s=>s.voided).length;
    return `<section class="sales-day"><div class="sales-day-head"><div><h3>${esc(salesGroupLabel(key))}</h3><span>${daySales.length} ${daySales.length===1?"venta":"ventas"}${voidedCount ? ` · ${voidedCount} anulada${voidedCount===1?"":"s"}` : ""}</span></div><div style="text-align:right"><strong>${money(activeTotal)}</strong>${voidedTotal ? `<div class="muted" style="font-size:12px;margin-top:3px">Anulado ${money(voidedTotal)}</div>` : ""}</div></div><div class="sales-day-list">${daySales.map(s => `<button class="row-card" style="width:100%;text-align:left;${s.voided?"opacity:.72;border-style:dashed":""}" onclick="openSale('${s.id}')"><div class="row-head"><div><strong>Comprobante #${s.number}${s.voided?" · ANULADO":""}</strong><div class="muted">${new Date(s.createdAt).toLocaleTimeString("es-CR",{hour:"2-digit",minute:"2-digit"})}</div></div><strong>${money(s.total)}</strong></div><div class="muted" style="margin-top:7px">${esc(s.method)}${s.clientId ? ` · ${esc(clientName(s.clientId))}` : ""}${s.table ? ` · Mesa ${esc(s.table)}` : ""}</div></button>`).join("")}</div></section>`;
  }).join("");
}
let salesDateMode = "all";
let salesStatusMode = "active";
function filteredSalesForView() {
  const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate()), yesterday = new Date(today), week = new Date(today);
  yesterday.setDate(yesterday.getDate()-1); const d=week.getDay()||7; week.setDate(week.getDate()-d+1);
  let list=[...visibleCurrentSales()];
  if(salesDateMode==="today") list=list.filter(s=>new Date(s.createdAt)>=today);
  if(salesDateMode==="yesterday") list=list.filter(s=>{const x=new Date(s.createdAt);return x>=yesterday&&x<today;});
  if(salesDateMode==="week") list=list.filter(s=>new Date(s.createdAt)>=week);
  if(salesStatusMode==="active") list=list.filter(s=>!s.voided);
  if(salesStatusMode==="voided") list=list.filter(s=>s.voided);
  list.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  return list;
}
function refreshSalesList() {
  const el=$("#salesList");
  if(el) el.innerHTML=groupedSalesHtml(filteredSalesForView());
}
function renderSales() {
  $("#app").innerHTML = shell(`<section class="screen-title"><h2>Mis ventas</h2><p>Agrupadas por día. Toca una venta para abrir su comprobante.</p></section><div class="toolbar"><button class="btn ghost" onclick="filterSales('today')">Hoy</button><button class="btn ghost" onclick="filterSales('yesterday')">Ayer</button><button class="btn ghost" onclick="filterSales('week')">Esta semana</button><button class="btn ghost" onclick="filterSales('all')">Todas las fechas</button></div><div class="toolbar"><button class="btn ${salesStatusMode==='active'?'primary':'ghost'}" onclick="filterSalesStatus('active')">Activas</button><button class="btn ${salesStatusMode==='voided'?'primary':'ghost'}" onclick="filterSalesStatus('voided')">Anuladas</button><button class="btn ${salesStatusMode==='all'?'primary':'ghost'}" onclick="filterSalesStatus('all')">Todas</button></div><div id="salesList" class="sales-scroll">${groupedSalesHtml(filteredSalesForView())}</div>`, isFood() ? "more" : "sales");
}
window.filterSales = mode => { salesDateMode=mode; refreshSalesList(); };
window.filterSalesStatus = mode => { salesStatusMode=mode; renderSales(); };
window.openSale = id => { const sale=state.sales.find(x=>x.id===id); if(sale) showReceipt(sale); };

function buildShiftSnapshot(shift) {
  const r=shiftReportData(shift);
  return {
    count:r.count,gross:r.gross,tax:r.tax,cash:r.cash,sinpe:r.sinpe,card:r.card,credit:r.credit,
    creditCash:r.creditCash,creditPayments:r.creditPayments,ins:r.ins,outs:r.outs,expected:r.expected,
    products:r.products,orderCounts:r.orderCounts,saleIds:r.sales.map(s=>s.id),
    voidedSaleIds:state.sales.filter(s=>s.shiftId===shift.id&&s.voided).map(s=>s.id)
  };
}
async function refreshShiftAfterVoid(sale) {
  if(!sale.shiftId) return;
  const shift=state.cashSessions.find(x=>x.id===sale.shiftId);
  if(!shift) return;
  const snap=buildShiftSnapshot(shift);
  shift.report=snap;
  if(shift.status==="closed") {
    shift.expected=snap.expected;
    shift.difference=Number(shift.counted||0)-Number(shift.expected||0);
  }
  await put("cashSessions",shift);
}
async function restoreSaleStock(sale) {
  if(sale.stockRestoredAt || sale.businessType === "services") return;
  for(const item of sale.items||[]) {
    const p=state.products.find(x=>x.id===item.id && x.businessType===sale.businessType);
    if(!p) continue;
    const beforeStock=Number(p.stock||0);
    const afterStock=beforeStock+Number(item.qty||0);
    p.stock=afterStock;
    cloudQueueInventoryEvent(sale,{productLocalId:p.id,movementType:"void",quantity:Number(item.qty||0),previousStock:beforeStock,newStock:afterStock,linkedSale:true,notes:`Anulación comprobante #${sale.number}`,createdAt:new Date().toISOString()});
    try { await cloudSaveProductFromApp(p); } catch (error) { console.error(error); p.cloudPending = true; }
    await put("products",p);
  }
  sale.stockRestoredAt=new Date().toISOString();
}
window.askVoidSale = id => {
  if (!requirePermission("void_sales", "No tienes permiso para anular ventas.")) return;
  const sale=state.sales.find(x=>x.id===id);
  if(!sale || sale.voided) return;
  modal(`<h3>Anular comprobante #${sale.number}</h3><p>La venta dejará de contar en los totales activos, Caja, reportes y Crédito.</p><p class="muted">El comprobante quedará guardado como ANULADO para mantener el historial.</p><div class="field"><label>Motivo opcional</label><input id="voidReason" placeholder="Ej. venta ingresada por error"></div><div class="toolbar"><button class="btn danger" onclick="voidSale('${id}')">Anular comprobante</button><button class="btn" onclick="closeModal()">Cancelar</button></div>`);
};
window.voidSale = async id => {
  if (!requirePermission("void_sales", "No tienes permiso para anular ventas.")) return;
  const sale=state.sales.find(x=>x.id===id);
  if(!sale || sale.voided) return;
  const reason=$("#voidReason")?.value?.trim()||"";
  const beforeVoid={status:"active",hiddenFromSales:!!sale.hiddenFromSales,total:Number(sale.total||0)};
  sale.voided=true;
  sale.voidedAt=new Date().toISOString();
  sale.voidReason=reason;
  cloudQueueAuditEvent(sale,"void","sale",beforeVoid,{status:"voided",reason,total:Number(sale.total||0)});
  await restoreSaleStock(sale);
  await put("sales",sale);
  if(sale.businessType==="food" && sale.tableAccountId) {
    const acc=state.tableAccounts.find(a=>a.id===sale.tableAccountId);
    if(acc && acc.status==="paid" && acc.paidSaleId===sale.id) {
      acc.status="open";
      acc.paidSaleId="";
      acc.paidAt="";
      acc.updatedAt=new Date().toISOString();
      await put("tableAccounts",acc);
      try { await cloudSaveTableAccountFromApp(acc); } catch (error) { console.error(error); acc.cloudPending = true; await put("tableAccounts",acc); }
    }
  }
  await refreshShiftAfterVoid(sale);
  try { await cloudSaveSaleFromApp(sale); } catch (error) { console.error(error); sale.cloudPending = true; await put("sales",sale); }
  if (sale.shiftId) { const sh=state.cashSessions.find(x=>x.id===sale.shiftId); if(sh){ try{await cloudSaveCashSessionFromApp(sh);}catch(error){console.error(error);sh.cloudPending=true;await put("cashSessions",sh);} } }
  closeModal();
  salesStatusMode="voided";
  screen="sales";
  renderSales();
  toast(`Comprobante #${sale.number} anulado.`);
};
window.askHideSale = id => {
  if (!requirePermission("void_sales", "No tienes permiso para eliminar comprobantes anulados de la vista.")) return;
  const sale=state.sales.find(x=>x.id===id);
  if(!sale || !sale.voided) return;
  modal(`<h3>Eliminar de Mis ventas</h3><p>¿Quieres quitar el comprobante #${sale.number} de la pantalla Mis ventas?</p><p class="muted">El registro interno de la anulación se conservará. No cambia Caja, Crédito ni reportes.</p><div class="toolbar"><button class="btn danger" onclick="hideSaleFromHistory('${id}')">Eliminar de Mis ventas</button><button class="btn" onclick="closeModal()">Cancelar</button></div>`);
};
window.hideSaleFromHistory = async id => {
  if (!requirePermission("void_sales", "No tienes permiso para eliminar comprobantes anulados de la vista.")) return;
  const sale=state.sales.find(x=>x.id===id);
  if(!sale || !sale.voided) return;
  sale.hiddenFromSales=true;
  sale.hiddenFromSalesAt=new Date().toISOString();
  cloudQueueAuditEvent(sale,"hide_from_sales","sale",{hiddenFromSales:false},{hiddenFromSales:true});
  await put("sales",sale);
  try { await cloudSaveSaleFromApp(sale); } catch (error) { console.error(error); sale.cloudPending = true; await put("sales",sale); }
  closeModal();
  screen="sales";
  renderSales();
  toast("Comprobante eliminado de Mis ventas.");
};

window.saveProduct = async id => {
  const name=$("#pName").value.trim(), price=Number($("#pPrice").value||0); if(!name||price<=0)return toast("Nombre y precio son obligatorios.");
  let p=id?currentProducts().find(x=>x.id===id):null;
  const isNew=!p;
  const before=p?{name:p.name,price:Number(p.price||0),category:p.category||"Otros",stock:Number(p.stock||0),variants:[...(p.variants||[])]}:null;
  const previousStock=p?Number(p.stock||0):0;
  if(!p){p={id:(crypto?.randomUUID?crypto.randomUUID():uid("p")),businessType:type()};state.products.push(p);}
  p.businessType=type();p.name=name;p.price=price;p.category=$("#pCategory").value.trim()||"Otros";p.stock=Number($("#pStock").value||0);p.variants=isProducts()?$("#pVariants").value.split(",").map(x=>x.trim()).filter(Boolean):[];
  const after={name:p.name,price:Number(p.price||0),category:p.category,stock:Number(p.stock||0),variants:[...(p.variants||[])]};
  cloudQueueAuditEvent(p,isNew?"create":"update","product",before,after);
  if(!isServices() && Number(p.stock||0)!==previousStock){
    cloudQueueInventoryEvent(p,{productLocalId:p.id,movementType:isNew?"initial":"adjustment",quantity:Number(p.stock||0)-previousStock,previousStock,newStock:Number(p.stock||0),notes:isNew?"Stock inicial":"Ajuste manual de stock"});
  }
  try { await cloudSaveProductFromApp(p); } catch (error) { console.error(error); p.cloudPending=true; }
  await put("products",p); const cat=p.category; closeModal(); openProductCategory(cat); toast(p.cloudPending?"Guardado. Pendiente de sincronizar con la nube.":"Guardado en la nube.");
};

window.deleteProduct = async id => { const p=currentProducts().find(x=>x.id===id); if(!p)return; const cat=p?.category||"Otros"; if(state.settings.cloudLinked&&navigator.onLine){try{await cloudDeleteProduct(p);}catch(error){console.error(error);return toast("No se pudo eliminar de la nube. Intenta de nuevo.");}} else if(state.settings.cloudLinked&&!navigator.onLine){return toast("Conéctate a Internet para eliminar este producto.");} await del("products",id); state.products=state.products.filter(x=>x.id!==id);cart=cart.filter(x=>x.id!==id);closeModal(); if(currentProducts().some(x=>(x.category?.trim()||"Otros")===cat))openProductCategory(cat);else renderProducts();toast("Eliminado."); };

function tablePickerButtons(){const count=Number(state.settings.tableCount||0);return Array.from({length:count},(_,i)=>i+1).map(n=>{const a=tableAccount(n);const status=a?.status==="open"?"Abierta":a?.status==="paid"?"Pagada":"Libre";return `<button class="table-pick" onclick="selectTable(${n})">Mesa ${n}<small>${status}</small></button>`;}).join("");}

window.previewCurrentPrebill=()=>{if(saleMeta.orderType!=="Mesa"||!saleMeta.table)return toast("Selecciona una mesa.");if(!cart.length)return toast("La mesa no tiene productos.");const total=tableItemsTotal(cart);modal(`<h3>Precuenta · Mesa ${esc(saleMeta.table)}</h3><div>${cart.map(i=>`<div class="ticket-line"><span>${i.qty} × ${esc(i.name)}</span><strong>${money(i.price*i.qty)}</strong></div>`).join("")}</div><div class="divider"></div><div class="ticket-line ticket-total"><span>Total actual</span><strong>${money(total)}</strong></div><div class="toolbar"><button class="btn primary" onclick="printPrebill()">Imprimir precuenta</button><button class="btn" onclick="closeModal()">Cerrar</button></div>`);};

window.askCleanTable=id=>{const a=state.tableAccounts.find(x=>x.id===id);if(!a)return;modal(`<h3>¿Limpiar Mesa ${a.tableNumber}?</h3><p>La venta y el comprobante quedarán guardados en Mis ventas.</p><div class="toolbar"><button class="btn primary" onclick="cleanTable('${id}')">Limpiar mesa</button><button class="btn" onclick="closeModal()">Cancelar</button></div>`);};
window.cleanTable=async id=>{const a=state.tableAccounts.find(x=>x.id===id);if(!a)return;if(state.settings.cloudLinked&&!navigator.onLine)return toast("Conéctate a Internet para limpiar una mesa sincronizada.");try{await cloudDeleteTableAccountFromApp(a);}catch(error){console.error(error);return toast("No se pudo limpiar la mesa en la nube.");}await del("tableAccounts",id);state.tableAccounts=state.tableAccounts.filter(x=>x.id!==id);closeModal();cart=[];resetSaleMeta();screen="tables";renderTables();toast(`Mesa ${a.tableNumber} libre.`);};

/* =========================
   PEDIDOS · RESTAURANTE
   Flujo secuencial en ventanas flotantes:
   Mesa → Categoría → Productos → Revisar → Guardar
========================= */
let orderDraft = null;

function normalizeOrderStatus(status) {
  if (status === "Pendiente" || status === "Tomado" || status === "taken") return "Recibido";
  if (status === "Preparando" || status === "En preparación" || status === "preparing") return "Recibido";
  if (status === "ready") return "Listo";
  if (status === "delivered") return "Entregado";
  if (status === "on_way") return "Listo";
  return status || "Recibido";
}

function orderStatusTime(o) {
  const status = normalizeOrderStatus(o.status);
  const at = status === "Entregado"
    ? o.deliveredAt
    : status === "Listo"
        ? o.readyAt
        : o.createdAt;

  return at
    ? new Date(at).toLocaleTimeString("es-CR", { hour: "2-digit", minute: "2-digit" })
    : "";
}

let ordersTab = "table";
function orderKind(order) { return order.kind || (order.tableNumber ? "table" : "whatsapp"); }
function orderOriginLabel(order) {
  if (orderKind(order) === "table") return `Mesa ${order.tableNumber || "-"}`;
  return order.fulfillment === "Express" ? "WhatsApp · Express" : "WhatsApp";
}
function orderTotal(order) {
  return totals((order.items || []).reduce((sum, item) => sum + Number(item.price || 0) * Number(item.qty || 0), 0)).total;
}
function orderAgeText(order) {
  const mins = Math.max(0, Math.floor((Date.now() - new Date(order.createdAt || Date.now()).getTime()) / 60000));
  if (mins < 1) return "Ahora";
  if (mins < 60) return `Hace ${mins} min`;
  const hours = Math.floor(mins / 60);
  return `Hace ${hours} h ${mins % 60} min`;
}
function nextVisibleOrderStatus(order) {
  const status = normalizeOrderStatus(order.status);
  if (status === "Recibido") return "Listo";
  if (status === "Listo") return "Entregado";
  return "";
}
function orderPhoneHref(order, text = "") {
  const digits = String(order.phone || "").replace(/\D/g, "");
  if (!digits) return "";
  const phone = digits.length === 8 ? `506${digits}` : digits;
  return `https://wa.me/${phone}${text ? `?text=${encodeURIComponent(text)}` : ""}`;
}

function nextOrderNumber() {
  return Math.max(0, ...state.orders.map(o => Number(o.number || 0))) + 1;
}

function orderDraftSubtotal() {
  return (orderDraft?.items || []).reduce(
    (sum, item) => sum + Number(item.price || 0) * Number(item.qty || 0),
    0
  );
}

function orderDraftQty() {
  return (orderDraft?.items || []).reduce(
    (sum, item) => sum + Number(item.qty || 0),
    0
  );
}

function mergeTableItems(base = [], added = []) {
  const result = base.map(item => ({ ...item }));

  for (const item of added) {
    const variant = item.variant || "";
    const found = result.find(current =>
      current.id === item.id && (current.variant || "") === variant
    );

    if (found) {
      found.qty = Number(found.qty || 0) + Number(item.qty || 0);
    } else {
      result.push({
        id: item.id,
        name: item.name,
        variant,
        price: Number(item.price || 0),
        qty: Number(item.qty || 0)
      });
    }
  }

  return result;
}

function orderTablePickerHtml() {
  const count = Number(state.settings.tableCount || 0);

  return Array.from({ length: count }, (_, index) => index + 1)
    .map(number => {
      const account = tableAccount(number);
      const paid = account?.status === "paid";
      const label = paid
        ? "Pagada · limpiar primero"
        : account?.status === "open"
          ? `Cuenta abierta · ${money(tableItemsTotal(account.items))}`
          : "Libre";

      return `
        <button
          class="table-pick"
          ${paid ? "disabled" : ""}
          style="${paid ? "opacity:.45;cursor:not-allowed" : ""}"
          onclick="startOrderForTable(${number})"
        >
          Mesa ${number}
          <small>${label}</small>
        </button>
      `;
    })
    .join("");
}

function orderDraftSummaryHtml() {
  if (!orderDraft?.items?.length) {
    return `<div class="empty" style="padding:18px 8px">Todavía no has agregado productos.</div>`;
  }

  return orderDraft.items
    .map(item => `
      <div class="ticket-line">
        <span>${item.qty} × ${esc(item.name)}</span>
        <strong>${money(Number(item.price || 0) * Number(item.qty || 0))}</strong>
      </div>
    `)
    .join("");
}

function renderOrders() {
  if (!isFood()) { screen = "home"; return renderHome(); }

  const active = [...state.orders].filter(o => normalizeOrderStatus(o.status) !== "Entregado");
  const tableCount = active.filter(o => orderKind(o) === "table").length;
  const whatsCount = active.filter(o => orderKind(o) === "whatsapp").length;
  const list = active
    .filter(o => ordersTab === "table" ? orderKind(o) === "table" : orderKind(o) === "whatsapp")
    .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));

  const html = list.length ? list.map(order => {
    const status = normalizeOrderStatus(order.status);
    const next = nextVisibleOrderStatus(order);
    const account = orderKind(order) === "table"
      ? (order.tableAccountId ? state.tableAccounts.find(a => a.id === order.tableAccountId) : tableAccount(order.tableNumber))
      : null;
    const accountState = account?.status === "open"
      ? `Cuenta abierta · ${money(tableItemsTotal(account.items))}`
      : account?.status === "paid"
        ? "Cuenta pagada"
        : orderKind(order) === "table" ? "Cuenta de mesa" : `${order.customer || "Cliente"}${order.phone ? ` · ${order.phone}` : ""}`;
    const statusTime = orderStatusTime(order);
    const title = orderKind(order) === "table" ? `Mesa ${esc(order.tableNumber || "-")}` : `${esc(order.customer || "Cliente WhatsApp")}`;
    const subtitle = orderKind(order) === "table"
      ? `Pedido #${order.number} · ${dateTime(order.createdAt)}`
      : `Pedido #W-${String(order.number || "").padStart(3,"0")} · ${esc(order.fulfillment || "Recoger")} · ${dateTime(order.createdAt)}`;
    const openButton = orderKind(order) === "table"
      ? (account?.status === "open" ? `<button class="btn ghost" onclick="openTable(${Number(order.tableNumber)})">Abrir cuenta de mesa</button>` : "")
      : `<button class="btn primary" onclick="openOrderInSale('${order.id}')">Abrir en Venta</button>`;
    const whatsHref = orderPhoneHref(order);
    const readyText = `Hola ${order.customer || ""}. Tu pedido #W-${String(order.number || "").padStart(3,"0")} está listo. Total: ${money(orderTotal(order))}. Gracias por comprar con nosotros.`;
    const readyHref = orderPhoneHref(order, readyText);
    const whatsappButtons = orderKind(order) === "whatsapp" ? `
      ${whatsHref ? `<a class="btn ghost" href="${whatsHref}" target="_blank" rel="noopener">Abrir chat</a>` : ""}
      ${status === "Listo" && readyHref ? `<a class="btn ghost" href="${readyHref}" target="_blank" rel="noopener">Avisar listo</a>` : ""}
    ` : "";

    return `
      <div class="row-card">
        <div class="row-head">
          <div>
            <strong style="font-size:21px">${title}</strong>
            <div class="muted">${subtitle}</div>
          </div>
          <span class="badge">${esc(status)}</span>
        </div>
        <div class="muted" style="margin-top:8px">${esc(accountState)} · ${orderAgeText(order)}${statusTime ? ` · ${esc(status)} ${esc(statusTime)}` : ""}</div>
        ${order.address ? `<div class="panel" style="box-shadow:none;margin-top:10px;padding:12px"><span class="muted">Dirección / referencia</span><div>${esc(order.address)}</div></div>` : ""}
        <div style="margin-top:12px">
          ${(order.items || []).map(item => `<div class="ticket-line"><span>${item.qty} × ${esc(item.name)}</span><strong>${money(Number(item.price || 0) * Number(item.qty || 0))}</strong></div>`).join("")}
        </div>
        ${order.notes ? `<div class="panel" style="box-shadow:none;margin-top:10px;padding:12px"><span class="muted">Nota</span><div>${esc(order.notes)}</div></div>` : ""}
        <div class="toolbar" style="margin-top:12px">
          ${next ? `<button class="btn primary" onclick="orderStatus('${order.id}','${next}')">${next}</button>` : `<span class="badge" style="background:#e8f4ec;color:#2d6d43">Entregado</span>`}
          ${whatsappButtons}
          ${openButton}
        </div>
      </div>`;
  }).join("") : `<div class="empty">No hay pedidos activos en esta sección.</div>`;

  $("#app").innerHTML = shell(`
    <section class="screen-title"><h2>Pedidos</h2><p>Recibido → Listo → Entregado.</p></section>
    <div class="toolbar order-tabs">
      <button class="btn ${ordersTab === "table" ? "primary" : "ghost"}" onclick="ordersTab='table';renderOrders()">Pedidos de mesa (${tableCount})</button>
      <button class="btn ${ordersTab === "whatsapp" ? "primary" : "ghost"}" onclick="ordersTab='whatsapp';renderOrders()">Pedidos WhatsApp (${whatsCount})</button>
    </div>
    <div class="toolbar">
      <button class="btn primary" onclick="newOrder()">Tomar pedido de mesa</button>
      <button class="btn ghost" onclick="newWhatsappOrder()">Nuevo pedido WhatsApp</button>
      <button class="btn ghost" onclick="go('tables')">Ver mesas</button>
    </div>
    <div class="list">${html}</div>
  `, "orders");
}

window.newOrder = () => {
  if (!currentShift()) return toast("Primero debes abrir la caja.");
  if (!Number(state.settings.tableCount || 0)) return configureTables();

  orderDraft = {
    tableNumber: "",
    items: [],
    note: "",
    category: ""
  };

  showOrderTableStep();
};

window.showOrderTableStep = () => {
  if (!orderDraft) {
    orderDraft = { tableNumber: "", items: [], note: "", category: "" };
  }

  modal(`
    <div class="category-modal-header">
      <div>
        <h3>1. Elegir mesa</h3>
        <p class="muted" style="margin:5px 0 0">Selecciona la mesa donde vas a tomar el pedido.</p>
      </div>
      <button class="modal-close" onclick="cancelOrderDraft()">×</button>
    </div>

    <div class="table-picker-grid">
      ${orderTablePickerHtml()}
    </div>

    ${orderDraft.items.length ? `
      <div class="table-account-banner" style="margin-top:16px">
        <span>Tu pedido sigue guardado</span>
        <strong>${orderDraftQty()} productos · ${money(totals(orderDraftSubtotal()).total)}</strong>
      </div>
    ` : ""}

    <div class="toolbar" style="margin-top:18px">
      <button class="btn" onclick="cancelOrderDraft()">Cancelar</button>
    </div>
  `);
};

window.startOrderForTable = number => {
  const account = tableAccount(number);

  if (account?.status === "paid") {
    return toast(`Mesa ${number} ya fue pagada. Límpiala antes de usarla de nuevo.`);
  }

  if (!orderDraft) {
    orderDraft = { tableNumber: "", items: [], note: "", category: "" };
  }

  orderDraft.tableNumber = Number(number);
  showOrderCategoryStep();
};

function showOrderCategoryStep() {
  if (!orderDraft) return renderOrders();

  const categories = productCategories();
  const isWhatsappDraft = orderDraft.kind === "whatsapp";
  const account = isWhatsappDraft ? null : tableAccount(orderDraft.tableNumber);
  const accountText = isWhatsappDraft
    ? `${orderDraft.fulfillment || "Recoger"}${orderDraft.customer ? ` · ${orderDraft.customer}` : ""}`
    : account?.status === "open"
      ? `Cuenta abierta: ${money(tableItemsTotal(account.items))}`
      : "Mesa sin cuenta abierta";

  const categoryHtml = categories.length
    ? categories.map(category => {
        const count = currentProducts().filter(
          product => (product.category?.trim() || "Otros") === category
        ).length;

        return `
          <button
            class="category-card"
            onclick="orderPickCategory(decodeURIComponent('${enc(category)}'))"
          >
            <span class="category-name">${esc(category)}</span>
            <span class="category-count">${count} productos</span>
            <span class="category-arrow">›</span>
          </button>
        `;
      }).join("")
    : `<div class="empty">Primero agrega productos y categorías.</div>`;

  modal(`
    <div class="category-modal-header">
      <div>
        <h3>${isWhatsappDraft ? "Elegir categoría" : "2. Elegir categoría"}</h3>
        <p class="muted" style="margin:5px 0 0">${isWhatsappDraft ? "WhatsApp" : `Mesa ${orderDraft.tableNumber}`} · ${esc(accountText)}</p>
      </div>
      <button class="modal-close" onclick="cancelOrderDraft()">×</button>
    </div>

    <div class="category-grid" style="margin-top:16px">
      ${categoryHtml}
    </div>

    ${orderDraft.items.length ? `
      <div class="table-account-banner" style="margin-top:16px">
        <span>${orderDraftQty()} productos en este pedido</span>
        <strong>${money(totals(orderDraftSubtotal()).total)}</strong>
      </div>
    ` : ""}

    <div class="toolbar" style="margin-top:16px">
      <button class="btn ghost" onclick="orderDraft.kind === 'whatsapp' ? showWhatsappInfoStep() : showOrderTableStep()">‹ Volver</button>
      ${orderDraft.items.length ? `<button class="btn primary" onclick="showOrderReviewStep()">Revisar pedido</button>` : ""}
      <button class="btn" onclick="cancelOrderDraft()">Cancelar</button>
    </div>
  `);

window.orderPickCategory = category => {

window.addOrderProduct = id => {
  if (!orderDraft) return;

  const product = currentProducts().find(item => item.id === id);
  if (!product) return;

  const cartId = `${product.id}_normal`;
  const found = orderDraft.items.find(item => item.cartId === cartId);

  if (found) {
    found.qty++;
  } else {
    orderDraft.items.push({
      cartId,
      id: product.id,
      name: product.name,
      variant: "",
      price: Number(product.price || 0),
      qty: 1
    });
  }

  showOrderProductsStep();
};

window.orderQty = (cartId, delta) => {
  if (!orderDraft) return;

  const item = orderDraft.items.find(current => current.cartId === cartId);
  if (!item) return;

  item.qty += delta;

  if (item.qty <= 0) {
    orderDraft.items = orderDraft.items.filter(current => current.cartId !== cartId);
  }

  if (!orderDraft.items.length) {
    return showOrderProductsStep();
  }

  showOrderReviewStep();
};
