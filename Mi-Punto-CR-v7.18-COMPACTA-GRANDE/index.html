window.saveTableOrder = async () => {
  if (!orderDraft?.items?.length) return toast("Agrega al menos un producto.");

  const now = new Date().toISOString();
  let account = tableAccount(orderDraft.tableNumber);

  if (account?.status === "paid") {
    return toast("Esta mesa ya fue pagada. Límpiala primero.");
  }

  if (!account) {
    account = {
      id: uid("table"),
      tableNumber: Number(orderDraft.tableNumber),
      openedAt: now,
      status: "open",
      items: [],
      orderIds: []
    };
    state.tableAccounts.push(account);
  }

  const order = {
    id: uid("o"),
    number: nextOrderNumber(),
    tableNumber: Number(orderDraft.tableNumber),
    tableAccountId: account.id,
    customer: "",
    items: orderDraft.items.map(item => ({
      id: item.id,
      name: item.name,
      variant: item.variant || "",
      price: Number(item.price || 0),
      qty: Number(item.qty || 0)
    })),
    notes: orderDraft.note.trim(),
    status: "Recibido",
    kind: "table",
    fulfillment: "Mesa",
    createdAt: now,
    statusHistory: [{ status: "Recibido", at: now }]
  };

  account.status = "open";
  account.items = mergeTableItems(account.items || [], order.items);
  account.orderIds = [...new Set([...(account.orderIds || []), order.id])];
  account.updatedAt = now;
  account.total = tableItemsTotal(account.items);
  delete account.paidSaleId;
  delete account.paidAt;

  await put("orders", order);
  state.orders.push(order);
  await put("tableAccounts", account);
  try { await cloudSaveOrderFromApp(order); } catch (error) { console.error(error); order.cloudPending = true; account.cloudPending = true; await put("orders", order); await put("tableAccounts", account); }

  orderDraft = null;
  closeModal();
  screen = "orders";
  renderOrders();
  toast(`Pedido #${order.number} guardado en Mesa ${order.tableNumber}.`);
};

window.orderStatus = async (id, status) => {
  const order = state.orders.find(item => item.id === id);
  if (!order) return;

  const now = new Date().toISOString();
  order.status = status;
  order.updatedAt = now;
  order.statusHistory = [
    ...(order.statusHistory || []),
    { status, at: now }
  ];

  if (status === "Listo") order.readyAt = now;
  if (status === "Entregado") order.deliveredAt = now;

  await put("orders", order);
  try { await cloudSaveOrderFromApp(order); } catch (error) { console.error(error); order.cloudPending = true; await put("orders", order); }
  renderOrders();
};

function shiftReportData(shift){
  const sales=state.sales.filter(s=>s.shiftId===shift.id&&!s.voided);
  const sum=m=>sales.filter(s=>s.method===m).reduce((a,b)=>a+Number(b.total||0),0);
  const moves=state.cashMoves.filter(m=>m.shiftId===shift.id);
  const ins=moves.filter(m=>m.type==="in").reduce((a,b)=>a+Number(b.amount||0),0);
  const outs=moves.filter(m=>m.type==="out").reduce((a,b)=>a+Number(b.amount||0),0);
  const creditCash=moves.filter(m=>m.type==="creditPayment"&&m.method==="Efectivo").reduce((a,b)=>a+Number(b.amount||0),0);
  const products={};for(const sale of sales)for(const item of sale.items||[]){const k=item.name+(item.variant?` · ${item.variant}`:"");products[k]=(products[k]||0)+Number(item.qty||0);}
  const cash=sum("Efectivo"),sinpe=sum("SINPE"),card=sum("Tarjeta/Otro"),credit=sum("Crédito");
  const creditPayments=state.creditMoves.filter(m=>m.shiftId===shift.id&&m.type==="payment").reduce((a,b)=>a+Number(b.amount||0),0);
  const orderCounts={Mostrador:0,"Para llevar":0,Express:0,Mesa:0,WhatsApp:0};
  for(const sale of sales){const key=sale.orderType||"Mostrador";orderCounts[key]=(orderCounts[key]||0)+1;}
  return {sales,count:sales.length,gross:sales.reduce((a,b)=>a+Number(b.total||0),0),tax:sales.reduce((a,b)=>a+Number(b.tax||0),0),cash,sinpe,card,credit,creditCash,creditPayments,ins,outs,expected:Number(shift.opening||0)+cash+ins+creditCash-outs,products,orderCounts};
}
function closingHistoryHtml(){const closed=[...state.cashSessions].filter(s=>s.status==="closed").sort((a,b)=>new Date(b.closedAt)-new Date(a.closedAt));return closed.length?closed.map(s=>`<button class="row-card" style="width:100%;text-align:left" onclick="showDayReport('${s.id}')"><div class="row-head"><div><strong>${new Date(s.closedAt).toLocaleDateString("es-CR")}</strong><div class="muted">${dateTime(s.openedAt)} → ${dateTime(s.closedAt)}</div></div><strong>${money(s.report?.gross||shiftReportData(s).gross)}</strong></div><div class="muted" style="margin-top:7px">${s.report?.count??shiftReportData(s).count} ventas · Diferencia ${money(s.difference||0)}</div></button>`).join(""):`<div class="empty">Todavía no hay cierres guardados.</div>`;}
function renderCash(){
  if(!isFood()){screen="home";return renderHome();}
  const shift=currentShift();
  if(!shift){$("#app").innerHTML=shell(`<section class="screen-title"><h2>Caja</h2><p>Abre una caja para comenzar un nuevo turno.</p></section><div class="panel"><h3>Caja cerrada</h3>${hasPermission("cash")?`<button class="btn primary full" onclick="openCash()">Abrir caja</button>`:`<p class="muted">No tienes permiso para abrir la caja.</p>`}</div><section class="screen-title" style="margin-top:24px"><h2 style="font-size:26px">Historial de cierres</h2><p>Reportes del día guardados.</p></section><div class="closing-list">${closingHistoryHtml()}</div>`,"more");return;}
  const r=shiftReportData(shift);
  $("#app").innerHTML=shell(`<section class="screen-title"><h2>Caja</h2><p>Todo lo vendido en este turno queda ligado aquí.</p></section><div class="kpi-grid"><div class="kpi"><span class="muted">Efectivo</span><strong>${money(r.cash)}</strong></div><div class="kpi"><span class="muted">SINPE</span><strong>${money(r.sinpe)}</strong></div><div class="kpi"><span class="muted">Tarjeta</span><strong>${money(r.card)}</strong></div><div class="kpi"><span class="muted">Crédito</span><strong>${money(r.credit)}</strong></div></div><div class="panel" style="margin-top:14px"><div class="ticket-line"><span>Ventas del turno</span><strong>${r.count}</strong></div><div class="ticket-line"><span>Fondo inicial</span><strong>${money(shift.opening)}</strong></div><div class="ticket-line"><span>Abonos en efectivo</span><strong>${money(r.creditCash)}</strong></div><div class="ticket-line"><span>Entradas</span><strong>${money(r.ins)}</strong></div><div class="ticket-line"><span>Salidas</span><strong>${money(r.outs)}</strong></div><div class="ticket-line ticket-total"><span>Efectivo esperado</span><strong>${money(r.expected)}</strong></div></div><div class="toolbar"><button class="btn ghost" onclick="cashMoveForm('in')">Entrada de efectivo</button><button class="btn ghost" onclick="cashMoveForm('out')">Salida de efectivo</button></div>${hasPermission("cash")?`<button class="btn primary full" style="margin-top:4px" onclick="closeCash(${r.expected})">Cerrar caja</button>`:""}`,"more");
}
window.openCash=()=>{if(!requirePermission("cash","No tienes permiso para abrir la caja."))return;modal(`<h3>Abrir caja</h3><div class="field"><label>Fondo inicial</label><input id="opening" type="number" value="0"></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick="saveOpenCash()">Abrir caja</button><button class="btn" onclick="closeModal()">Cancelar</button></div>`);};
window.saveOpenCash=async()=>{if(!requirePermission("cash","No tienes permiso para abrir la caja."))return;const s={id:uid("shift"),opening:Number($("#opening").value||0),openedAt:new Date().toISOString(),status:"open"};cloudQueueAuditEvent(s,"open","cash_shift",null,{opening:s.opening,status:"open"});await put("cashSessions",s);state.cashSessions.push(s);try{await cloudSaveCashSessionFromApp(s);}catch(error){console.error(error);s.cloudPending=true;await put("cashSessions",s);}closeModal();screen="home";render();toast("Caja abierta. Ya puedes vender.");};

window.closeCash=expected=>{if(!requirePermission("cash","No tienes permiso para cerrar la caja."))return;const open=openTableAccounts();if(open.length)return modal(`<h3>No puedes cerrar la caja</h3><p>Hay ${open.length} ${open.length===1?"mesa con cuenta abierta":"mesas con cuentas abiertas"}.</p><p class="muted">Cobra o resuelve esas mesas antes de cerrar.</p><div class="toolbar"><button class="btn primary" onclick="closeModal();go('tables')">Ver mesas</button><button class="btn" onclick="closeModal()">Cancelar</button></div>`);modal(`<h3>Cerrar caja</h3><p>Esperado: <strong>${money(expected)}</strong></p><div class="field"><label>Efectivo contado</label><input id="counted" type="number" inputmode="decimal"></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick="saveCloseCash(${expected})">Confirmar cierre</button><button class="btn" onclick="closeModal()">Cancelar</button></div>`);};
window.saveCloseCash=async expected=>{if(!requirePermission("cash","No tienes permiso para cerrar la caja."))return;const sh=currentShift();if(!sh)return;const report=shiftReportData(sh);sh.expected=expected;sh.counted=Number($("#counted").value||0);sh.difference=sh.counted-expected;sh.closedAt=new Date().toISOString();sh.status="closed";sh.report=buildShiftSnapshot(sh);cloudQueueAuditEvent(sh,"close","cash_shift",{status:"open",opening:Number(sh.opening||0)},{status:"closed",expected:Number(sh.expected||0),counted:Number(sh.counted||0),difference:Number(sh.difference||0)});await put("cashSessions",sh);try{await cloudSaveCashSessionFromApp(sh);}catch(error){console.error(error);sh.cloudPending=true;await put("cashSessions",sh);}closeModal();showDayReport(sh.id);};
window.showDayReport=id=>{const sh=state.cashSessions.find(x=>x.id===id);if(!sh)return;const r=shiftReportData(sh);const products=Object.entries(sh.report?.products||r.products);modal(`<h3>Reporte del día</h3><p class="muted">${dateTime(sh.openedAt)} → ${sh.closedAt?dateTime(sh.closedAt):"Abierto"}</p><div class="report-grid"><div class="report-stat"><span>Ventas</span><strong>${sh.report?.count??r.count}</strong></div><div class="report-stat"><span>Total vendido</span><strong>${money(sh.report?.gross??r.gross)}</strong></div><div class="report-stat"><span>Efectivo</span><strong>${money(sh.report?.cash??r.cash)}</strong></div><div class="report-stat"><span>SINPE</span><strong>${money(sh.report?.sinpe??r.sinpe)}</strong></div><div class="report-stat"><span>Tarjeta</span><strong>${money(sh.report?.card??r.card)}</strong></div><div class="report-stat"><span>Crédito</span><strong>${money(sh.report?.credit??r.credit)}</strong></div><div class="report-stat"><span>Abonos recibidos</span><strong>${money(sh.report?.creditPayments??r.creditPayments)}</strong></div><div class="report-stat"><span>Mesas / Express</span><strong>${(sh.report?.orderCounts?.Mesa??r.orderCounts.Mesa)} / ${(sh.report?.orderCounts?.Express??r.orderCounts.Express)}</strong></div></div><div class="panel" style="box-shadow:none"><div class="ticket-line"><span>Fondo inicial</span><strong>${money(sh.opening)}</strong></div><div class="ticket-line"><span>Efectivo esperado</span><strong>${money(sh.expected??r.expected)}</strong></div><div class="ticket-line"><span>Efectivo contado</span><strong>${money(sh.counted||0)}</strong></div><div class="ticket-line ticket-total"><span>Diferencia</span><strong>${money(sh.difference||0)}</strong></div></div>${products.length?`<h4>Productos vendidos</h4><div class="list">${products.map(([name,qty])=>`<div class="ticket-line"><span>${esc(name)}</span><strong>${qty}</strong></div>`).join("")}</div>`:""}<div class="toolbar" style="margin-top:16px"><button class="btn primary" onclick="shareDayReportPdf('${sh.id}')">Compartir PDF</button><button class="btn ghost" onclick="printDayReport('${sh.id}')">Imprimir</button><button class="btn" onclick="closeModal();screen='home';render()">Cerrar</button></div>`);};

/* ===== backup.js ===== */
/* =========================
   RESPALDOS / RESTAURACIÓN
   Mi Punto CR v7.15
========================= */
const MPCR_BACKUP_VERSION = 1;
const MPCR_BACKUP_TABLES = [
  "categories",
  "products",
  "clients",
  "business_employees",
  "restaurant_tables",
  "cash_shifts",
  "table_accounts",
  "sales",
  "sale_items",
  "payments",
  "credit_movements",
  "cash_movements",
  "orders",
  "order_items",
  "inventory_movements",
  "audit_log"
];

let pendingBackupRestore = null;

function backupReady() {
  return !!(role === "owner" && mpCloud && mpCloudUser && mpCloudBusiness?.id && state.settings.cloudLinked);
}

function renderBackupSettingsPanel() {
  if (role !== "owner") return "";
  const online = navigator.onLine;
  return `<div class="panel" style="margin-top:14px">
    <div class="row-head">
      <div>
        <strong>Copias de seguridad</strong>
        <p class="muted" style="margin:5px 0 0">Descarga un respaldo del negocio desde Supabase y úsalo para recuperar información si fuera necesario.</p>
      </div>
    </div>
    <div class="toolbar" style="margin-top:12px">
      <button class="btn primary" onclick="cloudExportBusinessBackup()" ${online ? "" : "disabled"}>Descargar respaldo</button>
      <button class="btn ghost" onclick="openBackupRestore()" ${online ? "" : "disabled"}>Restaurar respaldo</button>
    </div>
    <input id="backupRestoreFile" type="file" accept="application/json,.json" hidden onchange="readBackupRestoreFile(this)">
    <p class="muted" style="margin:10px 0 0">Solo el Dueño puede exportar o restaurar. La restauración recupera los registros incluidos en el archivo y no elimina información más nueva que no esté en ese respaldo.</p>
  </div>`;
}

function backupFileName(name, exportedAt) {
  const safe = String(name || "negocio")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9_-]+/gi, "-")
    .replace(/^-+|-+$/g, "")
    .slice(0, 40) || "negocio";
  const date = new Date(exportedAt || Date.now()).toISOString().slice(0, 10);
  return `Mi-Punto-CR-${safe}-${date}.json`;
}

async function backupSelectAll(table, businessId) {
  const pageSize = 1000;
  const rows = [];
  for (let from = 0; ; from += pageSize) {
    const { data, error } = await mpCloud
      .from(table)
      .select("*")
      .eq("business_id", businessId)
      .order("id", { ascending: true })
      .range(from, from + pageSize - 1);
    if (error) throw error;
    const batch = data || [];
    rows.push(...batch);
    if (batch.length < pageSize) break;
  }
  return rows;
}

async function backupAudit(action, newData = null) {
  if (!backupReady()) return;
  try {
    await mpCloud.from("audit_log").insert({
      business_id: mpCloudBusiness.id,
      user_id: mpCloudUser.id,
      action,
      entity_type: "backup",
      entity_id: null,
      old_data: null,
      new_data: newData
    });
  } catch (error) {
    console.warn("Auditoría respaldo:", error?.message || error);
  }
}

window.cloudExportBusinessBackup = async () => {
  if (role !== "owner") return toast("Solo el Dueño puede crear respaldos.");
  if (!navigator.onLine) return toast("Necesitas Internet para descargar el respaldo.");
  if (!backupReady()) return toast("La cuenta no está conectada a la nube.");

  try {
    modal(`<h3>Preparando respaldo</h3><p class="muted">Estamos leyendo la información del negocio desde Supabase. No cierres esta ventana.</p>`);

    // Primero intenta subir cualquier trabajo offline pendiente.
    await cloudSyncCatalogClients({ silent: true });
    await cloudSyncOperations({ silent: true });

    const businessId = mpCloudBusiness.id;
    const { data: business, error: businessError } = await mpCloud
      .from("businesses")
      .select("id,name,business_type,settings,created_at,updated_at")
      .eq("id", businessId)
      .single();
    if (businessError) throw businessError;

    const tables = {};
    for (const table of MPCR_BACKUP_TABLES) {
      tables[table] = await backupSelectAll(table, businessId);
    }

    const exportedAt = new Date().toISOString();
    const payload = {
      app: "Mi Punto CR",
      backupVersion: MPCR_BACKUP_VERSION,
      exportedAt,
      businessId,
      businessName: business?.name || state.settings.businessName || "Mi Punto CR",
      businessType: business?.business_type || state.settings.businessType || "food",
      business,
      tables
    };

    const json = JSON.stringify(payload, null, 2);
    const blob = new Blob([json], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = backupFileName(payload.businessName, exportedAt);
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);

    await backupAudit("backup_export", {
      exported_at: exportedAt,
      counts: Object.fromEntries(Object.entries(tables).map(([key, value]) => [key, value.length]))
    });

    closeModal();
    toast("Respaldo descargado.");
  } catch (error) {
    console.error("Respaldo:", error);
    closeModal();
    toast(`No se pudo crear el respaldo: ${cloudAuthErrorMessage(error)}`);
  }
};

window.openBackupRestore = () => {
  if (role !== "owner") return toast("Solo el Dueño puede restaurar respaldos.");
  if (!navigator.onLine) return toast("Necesitas Internet para restaurar.");
  const input = document.querySelector("#backupRestoreFile");
  if (!input) return toast("Abre Configuración e inténtalo de nuevo.");
  input.value = "";
  input.click();
};

function backupSummaryHtml(backup) {
  const t = backup.tables || {};
  const items = [
    ["Productos / servicios", (t.products || []).length],
    ["Clientes", (t.clients || []).length],
    ["Ventas", (t.sales || []).length],
    ["Pagos", (t.payments || []).length],
    ["Cajas", (t.cash_shifts || []).length],
    ["Pedidos", (t.orders || []).length]
  ];
  return items.map(([label, count]) => `<div class="ticket-line"><span>${esc(label)}</span><strong>${Number(count || 0)}</strong></div>`).join("");
}

window.readBackupRestoreFile = async input => {
  const file = input?.files?.[0];
  if (!file) return;
  if (file.size > 50 * 1024 * 1024) {
    input.value = "";
    return toast("El archivo supera el límite de 50 MB.");
  }

  try {
    const parsed = JSON.parse(await file.text());
    if (parsed?.app !== "Mi Punto CR" || Number(parsed?.backupVersion || 0) !== MPCR_BACKUP_VERSION || !parsed?.tables) {
      throw new Error("El archivo no es un respaldo válido de Mi Punto CR.");
    }
    if (!backupReady()) throw new Error("La cuenta no está conectada a la nube.");
    if (String(parsed.businessId || "") !== String(mpCloudBusiness.id || "")) {
      throw new Error("Este respaldo pertenece a otro negocio.");
    }

    pendingBackupRestore = parsed;
    modal(`<h3>Restaurar respaldo</h3>
      <p class="muted">Respaldo de <strong>${esc(parsed.businessName || "Mi Punto CR")}</strong> · ${esc(dateTime(parsed.exportedAt))}</p>
      <div style="margin:14px 0">${backupSummaryHtml(parsed)}</div>
      <div class="setup-note">La restauración reemplaza por ID los registros incluidos en el respaldo, pero no borra registros más nuevos que no estén en el archivo. Debes estar conectado a Internet.</div>
      <p style="margin:14px 0 7px"><strong>Para confirmar escribe RESTAURAR</strong></p>
      <input id="restoreConfirmText" autocomplete="off" placeholder="RESTAURAR" style="text-transform:uppercase">
      <div class="toolbar" style="margin-top:14px">
        <button class="btn danger" onclick="confirmCloudRestoreBackup()">Restaurar ahora</button>
        <button class="btn ghost" onclick="pendingBackupRestore=null;closeModal()">Cancelar</button>
      </div>`);
  } catch (error) {
    console.error("Leer respaldo:", error);
    pendingBackupRestore = null;
    toast(error?.message || "No se pudo leer el respaldo.");
  } finally {
    input.value = "";
  }
};

function backupRows(backup, table) {
  return Array.isArray(backup?.tables?.[table]) ? backup.tables[table] : [];
}

function backupBusinessRows(backup, table, transform = null) {
  return backupRows(backup, table).map(row => {
    const next = { ...row, business_id: mpCloudBusiness.id };
    return transform ? transform(next, row) : next;
  });
}

async function backupUpsert(table, rows, { ignoreDuplicates = false } = {}) {
  if (!rows.length) return;
  const chunkSize = 200;
  for (let i = 0; i < rows.length; i += chunkSize) {
    const chunk = rows.slice(i, i + chunkSize);
    const { error } = await mpCloud
      .from(table)
      .upsert(chunk, { onConflict: "id", ignoreDuplicates });
    if (error) throw error;
  }
}

window.confirmCloudRestoreBackup = async () => {
  if (role !== "owner") return toast("Solo el Dueño puede restaurar respaldos.");
  if (!navigator.onLine) return toast("Necesitas Internet para restaurar.");
  if (!pendingBackupRestore) return toast("Selecciona nuevamente el respaldo.");
  if (String(document.querySelector("#restoreConfirmText")?.value || "").trim().toUpperCase() !== "RESTAURAR") {
    return toast("Escribe RESTAURAR para confirmar.");
  }

  const backup = pendingBackupRestore;
  pendingBackupRestore = null;

  try {
    modal(`<h3>Restaurando</h3><p class="muted">Estamos recuperando la información en Supabase. No cierres Mi Punto CR hasta que termine.</p>`);

    const businessPatch = {
      name: backup.business?.name || backup.businessName || mpCloudBusiness.name,
      business_type: backup.business?.business_type || backup.businessType || mpCloudBusiness.business_type,
      settings: backup.business?.settings && typeof backup.business.settings === "object" ? backup.business.settings : (mpCloudBusiness.settings || {})
    };
    const { data: restoredBusiness, error: businessError } = await mpCloud
      .from("businesses")
      .update(businessPatch)
      .eq("id", mpCloudBusiness.id)
      .select("*")
      .single();
    if (businessError) throw businessError;

    // Dependencias básicas.
    await backupUpsert("categories", backupBusinessRows(backup, "categories"));
    await backupUpsert("products", backupBusinessRows(backup, "products"));
    await backupUpsert("clients", backupBusinessRows(backup, "clients"));
    await backupUpsert("business_employees", backupBusinessRows(backup, "business_employees"));
    await backupUpsert("restaurant_tables", backupBusinessRows(backup, "restaurant_tables"));
    await backupUpsert("cash_shifts", backupBusinessRows(backup, "cash_shifts"));

    // Rompemos temporalmente el ciclo table_accounts <-> sales.
    const originalAccounts = backupBusinessRows(backup, "table_accounts");
    await backupUpsert("table_accounts", originalAccounts.map(row => ({ ...row, paid_sale_id: null })));
    await backupUpsert("sales", backupBusinessRows(backup, "sales"));
    await backupUpsert("table_accounts", originalAccounts);

    await backupUpsert("sale_items", backupBusinessRows(backup, "sale_items"));
    await backupUpsert("payments", backupBusinessRows(backup, "payments"));
    await backupUpsert("credit_movements", backupBusinessRows(backup, "credit_movements"));
    await backupUpsert("cash_movements", backupBusinessRows(backup, "cash_movements"));
    await backupUpsert("orders", backupBusinessRows(backup, "orders"));
    await backupUpsert("order_items", backupBusinessRows(backup, "order_items"));

    // Tablas de solo historial: si el ID ya existe, se conserva el registro actual.
    await backupUpsert("inventory_movements", backupBusinessRows(backup, "inventory_movements"), { ignoreDuplicates: true });
    await backupUpsert("audit_log", backupBusinessRows(backup, "audit_log"), { ignoreDuplicates: true });

    mpCloudBusiness = restoredBusiness || { ...mpCloudBusiness, ...businessPatch };
    await cloudPersistLocalIdentity(mpCloudUser, mpCloudBusiness, mpCloudMembership);

    // Recarga local directamente desde la nube sin subir primero el caché viejo.
    const catalogRemote = await cloudLoadCatalogClientsRemote();
    await cloudMergeRemoteCatalogClients(catalogRemote);
    const operationsRemote = await cloudLoadOperationsRemote();
    await cloudMergeOperationsRemote(operationsRemote);

    await backupAudit("backup_restore", {
      backup_exported_at: backup.exportedAt || null,
      restored_at: new Date().toISOString()
    });

    closeModal();
    screen = "home";
    render();
    toast("Respaldo restaurado correctamente.");
  } catch (error) {
    console.error("Restaurar respaldo:", error);
    closeModal();
    toast(`No se pudo completar la restauración: ${cloudAuthErrorMessage(error)}`);
  }
};

function adminTrackedEntities() {
  return [
    ...state.products,
    ...state.clients,
    ...state.sales,
    ...state.orders,
    ...state.cashMoves,
    ...state.cashSessions,
    ...state.creditMoves,
    ...state.tableAccounts
  ];
}

function adminPendingSyncCount() {
  return adminTrackedEntities().reduce((total, entity) => {
    if (!entity || typeof entity !== "object") return total;
    let pending = 0;
    if (entity.cloudPending) pending += 1;
    if (entity.cloudPendingDelete) pending += 1;
    if (Array.isArray(entity.cloudAuditQueue)) pending += entity.cloudAuditQueue.length;
    if (Array.isArray(entity.cloudInventoryQueue)) pending += entity.cloudInventoryQueue.length;
    return total + pending;
  }, 0);
}

function adminLastSyncAt() {
  const values = [
    state.settings.catalogLastCloudSyncAt,
    state.settings.operationsLastCloudSyncAt
  ].filter(Boolean).map(value => new Date(value)).filter(date => !Number.isNaN(date.getTime()));
  if (!values.length) return "";
  return new Date(Math.max(...values.map(date => date.getTime()))).toISOString();
}

function renderAdminSyncPanel() {
  const pending = adminPendingSyncCount();
  const online = navigator.onLine;
  const linked = !!state.settings.cloudLinked;
  const lastSync = adminLastSyncAt();

  let title = state.settings.guestMode ? "Modo sin cuenta" : "Nube no vinculada";
  let detail = state.settings.guestMode ? "Tus datos están solo en este dispositivo. Puedes crear una cuenta cuando quieras para guardarlos en la nube." : "Inicia sesión con una cuenta para sincronizar los datos del negocio.";
  if (linked && !online) {
    title = pending ? `${pending} cambio${pending === 1 ? "" : "s"} pendiente${pending === 1 ? "" : "s"}` : "Sin conexión";
    detail = pending ? "Se guardaron en este dispositivo y se subirán cuando vuelva Internet." : "Los datos locales siguen disponibles. La nube se actualizará al recuperar conexión.";
  } else if (linked && pending) {
    title = `${pending} cambio${pending === 1 ? "" : "s"} pendiente${pending === 1 ? "" : "s"}`;
    detail = "Puedes sincronizar ahora o dejar que Mi Punto CR lo haga automáticamente.";

    title = "Todo sincronizado ✓";
    detail = lastSync ? `Última sincronización: ${dateTime(lastSync)}.` : "Los datos del negocio están conectados a Supabase.";
  }

  return `<div class="panel" style="margin-top:14px">

const TEAM_PERMISSION_OPTIONS = [
  ["sell", "Vender"],
  ["orders", "Pedidos"],
  ["tables", "Mesas"],
  ["cash", "Caja"],
  ["products", "Productos / Servicios"],
  ["clients", "Clientes / Crédito"],
  ["sales", "Mis ventas"],
  ["catalog", "Menú / Catálogo QR"],
  ["void_sales", "Anular ventas"]
];
let employeesCache = [];

function teamDefaultPermissions() {
  return { ...(ROLE_PERMISSION_DEFAULTS.employee || {}) };
}
function teamPermissionCheckboxes(prefix, permissions = {}) {
  return TEAM_PERMISSION_OPTIONS.map(([key, label]) => {
    const checked = permissions[key] === true ? "checked" : "";
    return `<label style="display:flex;align-items:center;gap:9px;padding:9px 0"><input id="${prefix}_${key}" type="checkbox" ${checked}><span>${esc(label)}</span></label>`;
  }).join("");
}
function teamReadPermissions(prefix) {
  const out = {};
  for (const [key] of TEAM_PERMISSION_OPTIONS) out[key] = !!$("#" + prefix + "_" + key)?.checked;
  return out;
}
function employeeSalesStats(employee) {
  const today = localDayKey(new Date());
  const sales = state.sales.filter(s => !s.voided && (s.employeeId === employee.id || Number(s.employeeCode || 0) === Number(employee.code_number || 0)));
  const todaySales = sales.filter(s => localDayKey(s.createdAt) === today);
  return {
    todayCount: todaySales.length,
    todayTotal: todaySales.reduce((sum, sale) => sum + Number(sale.total || 0), 0),
    allCount: sales.length,
    allTotal: sales.reduce((sum, sale) => sum + Number(sale.total || 0), 0)
  };
}

    toast("Empleado eliminado.");
  } catch (error) {
    console.error(error);
    toast(cloudAuthErrorMessage(error));
  }
};


/* ===== ui-init.js ===== */
/* =========================
   BLOQUEO / MODALES
========================= */
let lockPinBuffer = "";
function proCodeMode(){ return !state.settings.guestMode && isProPlan(); }
function renderLock() {
  lockPinBuffer = "";
  const pro = proCodeMode();
  const display = pro
    ? `<div class="employee-code-display"><span>CR</span><strong id="lockPinDisplay">____</strong></div>`
    : `<div class="pin-display" id="lockPinDisplay">____</div>`;
  $("#app").innerHTML = `<div class="lock-screen"><div class="lock-card pin-pad-card"><div class="lock-brand">${brandVertical("brand-logo-vertical")}</div><p>${pro ? "Ingresa tu código CR." : "Ingresa tu código."}</p>${display}<div class="pin-keypad">${[1,2,3,4,5,6,7,8,9].map(n => `<button onclick="lockPinKey('${n}')">${n}</button>`).join("")}<button class="key-delete" onclick="lockPinBackspace()">⌫</button><button onclick="lockPinKey('0')">0</button><button class="key-clear" onclick="lockPinClear()">×</button></div><div id="lockPinStatus" class="muted" style="text-align:center;margin-top:10px"></div></div></div>`;
}
function drawLockPin() {
  const len = 4;
  const el = $("#lockPinDisplay");
  if (el) el.textContent = "•".repeat(lockPinBuffer.length) + "_".repeat(Math.max(0, len - lockPinBuffer.length));
}
window.lockPinKey = digit => {
  if (lockPinBuffer.length >= 4) return;
  lockPinBuffer += String(digit);
  drawLockPin();
  if (lockPinBuffer.length === 4) setTimeout(unlock, 100);
};
window.lockPinBackspace = () => { lockPinBuffer = lockPinBuffer.slice(0, -1); drawLockPin(); };
window.lockPinClear = () => { lockPinBuffer = ""; drawLockPin(); };
window.unlock = async () => {
  const p = lockPinBuffer;
  const status = $("#lockPinStatus");
  if (proCodeMode()) {
    const n = Number(p);
    if (n === Number(state.settings.ownerProCode || 1000)) {
      role = "owner";
      state.settings.employeeId = ""; state.settings.employeeCode = ""; state.settings.memberDisplayName = "";
      await put("settings", state.settings);
      locked = false; lockPinBuffer = ""; lastActivityAt = Date.now(); return render();
    }
    try {
      if (status) status.textContent = "Verificando…";
      const row = await cloudEmployeeCodeLogin(n);
      if (!row) throw new Error("Código incorrecto");
      locked = false; lockPinBuffer = ""; lastActivityAt = Date.now(); return render();
    } catch (error) {
      console.error(error);
      if (status) status.textContent = "Código incorrecto.";
      lockPinBuffer = ""; return drawLockPin();
    }
  }
  if (state.settings.ownerPin && p === state.settings.ownerPin) {
    role = "owner"; locked = false; lockPinBuffer = ""; lastActivityAt = Date.now(); return render();
  }
  if (status) status.textContent = "Código incorrecto.";
  lockPinBuffer = ""; drawLockPin();
};
function modal(html) { closeModal(); const e = document.createElement("div"); e.id = "modalRoot"; e.className = "modal-backdrop"; e.innerHTML = `<div class="modal">${html}</div>`; e.onclick = ev => { if (ev.target === e) closeModal(); }; document.body.appendChild(e); }
window.closeModal = () => $("#modalRoot")?.remove();
function toast(text) { const old = document.querySelector(".toast"); old?.remove(); const e = document.createElement("div"); e.className = "toast"; e.textContent = text; document.body.appendChild(e); setTimeout(() => e.remove(), 2400); }

let resizeTimer;
function handleViewportChange() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const active = document.activeElement;
    const editing = active && ["INPUT", "SELECT", "TEXTAREA"].includes(active.tagName);
    if (screen === "settings" && (settingsFormDirty || editing)) return;
    if (!document.querySelector("#modalRoot")) render();
  }, 180);
}
window.addEventListener("resize", handleViewportChange);
window.addEventListener("orientationchange", handleViewportChange);
window.addEventListener("online", async () => {
  if (mpCloudSession?.user) {
    try { await cloudHydrateSession(mpCloudSession); } catch (error) { console.error(error); }
  } else if (state.settings.cloudLinked) {
    try { await cloudSyncCatalogClients({ silent: true }); } catch (error) { console.error(error); }
    try { await cloudSyncOperations({ silent: true }); } catch (error) { console.error(error); }
  }
  render();
});
window.addEventListener("offline", render);
window.addEventListener("pageshow", () => {
  setTimeout(() => {
    if (db && !document.querySelector("#modalRoot")) {
      if (!checkInactivityLock()) render();
    }
  }, 80);
});

["pointerdown", "keydown", "touchstart"].forEach(eventName => {
  window.addEventListener(eventName, registerUserActivity, { passive: true });
});
window.addEventListener("scroll", registerUserActivity, { passive: true });
window.addEventListener("focus", () => checkInactivityLock());
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) checkInactivityLock();
});

(async () => {
  injectStyles();
  injectV7Styles();
  db = await openDB();
  await load();
  await initCloudAuth();
  if (new URLSearchParams(location.search).get("catalog") === "1") { renderPublicCatalog(); return; }
  locked = !!state.settings.pinEnabled;
  lastActivityAt = Date.now();
  render();
  // Hotfix v7.1: algunos navegadores restauran la página antes de repintar #app.
  // Forzamos un segundo render estable; el mismo efecto que provocaba F12 al redimensionar.
  requestAnimationFrame(() => { if (!document.querySelector("#modalRoot")) render(); });
  setTimeout(() => { if (!document.querySelector("#modalRoot")) render(); }, 250);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("./service-worker.js").catch(console.error);
})().catch(err => {
  console.error(err);
  injectStyles();
  document.querySelector("#app").innerHTML = `<section class="onboarding"><div class="onboard-card">${brandHorizontal("brand-logo-horizontal compact")}<h2>No se pudo iniciar</h2><p>Ocurrió un error al abrir los datos locales.</p><pre style="white-space:pre-wrap;font-size:12px">${esc(err?.message || err)}</pre></div></section>`;
});

</script>
